<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dilemma Game – Health Care Management</title>
<style>
:root{
  --bg:#f6f4ef;--card:#fff;--ink:#1d2433;--muted:#5f6878;--line:#e3dfd6;
  --accent:#0c6b58;--accent-soft:#e2f1ec;--warn:#b4541f;--warn-soft:#fbeee6;
  --A:#2f6db5;--B:#c2741a;--C:#3f8f4f;--D:#8a4fa8;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14171d;--card:#1d222b;--ink:#e9ebef;--muted:#9aa3b2;--line:#2e3542;
  --accent:#4fc2a5;--accent-soft:#1d3a33;--warn:#f0955f;--warn-soft:#3b2a20;
  --A:#6ea4e6;--B:#e8a14d;--C:#6fc380;--D:#c08ad9;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;gap:14px;padding:12px 0;flex-wrap:wrap}
.logo{font-weight:750;font-size:18px;letter-spacing:-.01em}
.logo span{color:var(--accent)}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 12px;border-radius:9px;color:var(--muted);font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
main{padding:22px 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
h1{font-size:24px;margin:0 0 6px;letter-spacing:-.015em}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
input[type=text],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:70px;resize:vertical}
.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 15px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.dark .btn.primary,.btn.primary{color:#fff}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:13px;padding:6px 10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.steps{display:flex;gap:6px;margin:4px 0 18px;flex-wrap:wrap}
.step{flex:1;min-width:110px;padding:8px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.step b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.step.on{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 2px var(--accent-soft)}
.step.done{color:var(--accent)}
.dq{font-size:17px;line-height:1.6}
.opt{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-top:10px;background:var(--card);text-align:left;width:100%;font:inherit;color:inherit}
button.opt{cursor:pointer}
button.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.let{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;color:#fff}
.lA{background:var(--A)}.lB{background:var(--B)}.lC{background:var(--C)}.lD{background:var(--D)}
.players{display:flex;gap:8px;flex-wrap:wrap}
.pchip{padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.pchip.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pchip.holder::after{content:" ★";color:var(--warn)}
.reveal{border-left:4px solid var(--line);padding:10px 14px;margin-top:10px;border-radius:8px;background:var(--bg)}
.reveal.h{border-left-color:var(--warn)}
.big{font-size:44px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bar{height:22px;border-radius:6px;display:flex;overflow:hidden;background:var(--line)}
.bar div{height:100%}
.legend{display:flex;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.num{font-variant-numeric:tabular-nums}
.list .it{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:hover h3{color:var(--accent)}
.hidden{display:none}
.scale{display:flex;gap:4px}
.scale button{flex:1;padding:7px 0;border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;font:inherit;font-size:13px;color:var(--ink)}
.scale button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.privacy{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14px}
.kpi{padding:14px;border:1px solid var(--line);border-radius:12px}
.kpi .v{font-size:28px;font-weight:750;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted)}
footer{color:var(--muted);font-size:12px;text-align:center;padding:20px}
</style>
</head>
<body>
<header><div class="wrap top">
  <div class="logo">Dilemma <span>Game</span></div>
  <nav id="nav">
    <button data-v="setup">Spelers</button>
    <button data-v="play">Spelen</button>
    <button data-v="results">Resultaten</button>
    <button data-v="library">Alle dilemma's</button>
    <button data-v="rules">Spelregels</button>
  </nav>
</div></header>
<main class="wrap" id="app"></main>
<footer>Dilemma's: Erasmus School of Health Policy &amp; Management · Je spel wordt alleen in deze browser bewaard. Exporteer het onder Resultaten om het te delen.</footer>

<script>
const DILEMMAS = [{"n": 1, "q": "In the hospital department you manage, a physician of high standing has made a mistake. He has failed to complete the full list of admission forms for a patient in time, causing an extended stay. This is a recurring problem for this physician. How will you deal with this internally?", "o": {"A": "During a team meeting, I will address the problem and talk to the person responsible. Transparency is important for the proper functioning of any department.", "B": "I will discuss the problem only with the responsible physician. This approach allows me to tackle the issue at the source while leaving the physician's reputation unharmed within the department.", "C": "I will inform the department of the situation so that everyone can learn from it. I will mention no names; all I care about is preventing the problem from recurring in future.", "D": "I will disregard the issue as I simply do not have the time. I am sure that the physician has taken a deliberate decision, weighing all of the interests at stake."}}, {"n": 2, "q": "You manage a team in a hospital department. The head of the department asks you for notes concerning a patient that are kept in a locked cupboard belonging to a physician. The information is needed to prepare for an intake interview for a routine surgical operation. The physician concerned is currently away on holiday, but you know the code of the lock. Will you open the cupboard and provide the department head with the patient details?", "o": {"A": "Yes, I will do as I am told, because otherwise, the operation would have to be delayed, and the patient would suffer. If, in retrospect, it turns out that unlocking the cupboard was not allowed, the responsibility will be on the department head.", "B": "Yes, provided that this is normal procedure here, and only if I know that the physician would not mind. If I am not sure whether she would mind, I will refuse to open the cupboard.", "C": "I will not do this, it would fly in the face of integrity.", "D": "I will try to contact the physician at her holiday location. I will not open the cupboard without her permission."}}, {"n": 3, "q": "Many hospitals struggle with significant IC staff shortages, including the one where you serve as director. What will you do to ensure that sufficient capacity is reserved for the IC?", "o": {"A": "I will raise the wages of IC personnel substantially in the hopes of securing the loyalty of my current staff and perhaps even attracting staff from other hospitals.", "B": "The base of available IC professionals in the Netherlands is insufficient. I will therefore look abroad to try and recruit additional manpower.", "C": "I will sign an agreement with another hospital to enable the exchange and sharing of personnel.", "D": "I will ensure that there are sufficient training slots for our current staff, so that we can supplement any shortages from our own resources."}}, {"n": 4, "q": "In the hospital where you serve as director, hygiene is a prime focus. Professional cleaners deliver an important contribution to the hospital’s hygiene on a daily basis. You have a choice either to employ these cleaning professionals on a (permanent) contract or to outsource. Which do you choose?", "o": {"A": "I will employ the cleaners. The main reason for this choice is that I want to convey to the outside world that my hospital considers hygiene of paramount importance and regards cleaners as indispensable hospital personnel.", "B": "I will employ the cleaners. The main reason for this choice is that I want to secure their loyalty to the hospital and therefore increase their commitment to the best possible hygiene.", "C": "I will outsource the cleaners. This will help to avoid the additional expenses involved in the employment of personnel.", "D": "I will outsource the cleaners, predominantly in view of the flexibility it allows me to deploy more or fewer cleaners (temporarily) according to current needs."}}, {"n": 5, "q": "You have a vacancy for a nurse. A single dad comes to apply for the job. He is the sole caretaker of his child. He seems competent enough, but there is always the risk that he may be late if the child falls ill or the school teachers go on strike. You do need to hire someone as soon as possible to ensure sufficient capacity. Will you hire this single dad?", "o": {"A": "Yes, I will hire him. His personal situation is less important to me. All that counts is that he will do a good job.", "B": "Yes, I will hire him. I hope that this job will help him cope with his personal situation.", "C": "No, I will not hire him. I cannot take the chance. The proper functioning of my department and, ultimately, the hospital itself, is my responsibility. I will look for a new candidate as soon as possible.", "D": "Yes, I will hire him, but on the condition that he himself arranges for replacement in case of such a situation."}}, {"n": 6, "q": "You are the director of a nursing home. You have recently been presented with an attractive offer for the purchase of Zoras, care robots, the type that more and more care institutions rave about. Zoras allegedly motivate the elderly to be more active, help psychiatric patients to find peace of mind, and even health care personnel seem to like to have them around. However, purchasing these robots would make part of the staff redundant, and it involves a hefty investment. Would you purchase the robots?", "o": {"A": "Yes, I would purchase the robots. They will bring a lot of positive energy to the patients and the nurses, making them worth the investment.", "B": "Yes, I would purchase the robots to point out that we are a modern nursing home. This will benefit our reputation, and that is how I hope to recoup the investment.", "C": "No, I would not purchase the robots. Technology is developing so fast these days that I suspect the robots will be outdated the moment they arrive. That seems a waste of money to me.", "D": "No, I would not purchase the robots. It is important for the atmosphere in the nursing home that people are not replaced by robots, nor that they need to fear that they will be in the future."}}, {"n": 7, "q": "As a manager of a hospital department, you notice a trend that doctors and nurses increasingly want to be able to plan their own working hours. They want to have more flexibility and a better balance between work and their private lives. This has a serious impact, mainly on work schedules that need to be prepared every few months. Will you switch to flexible workhours or hang on to traditional work schedules?", "o": {"A": "I will continue to use the traditional work schedule, as the implementation of flexible hours would not benefit the quality and continuity of our care.", "B": "I will stick to traditional hours. It would take too much time, energy and resources to prepare new schedules every time to suit everyone's wishes.", "C": "I will switch to flexible work hours. This will increase the quality of the work, as it will enhance employee satisfaction.", "D": "I will arrange for better opportunities within the schedule to swap shifts, even if this means more red tape."}}, {"n": 8, "q": "As a department head, you have a budget of €10,000.- for 10 FTE of training, 1 FTE per staff member. If you offer every employee €1,000 a year, they can each take a small training course. Alternatively, you can choose to allocate the funds differently, for instance by offering great talents a more extensive training programme. What would you choose?", "o": {"A": "I will allocate the funds differently. Great talents will be given more training opportunities. That is how I hope to retain talents.", "B": "Everyone should be given the same development opportunities. Every employee will get the same amount.", "C": "Employees who love to learn, are motivated, and have a good plan to back up their ambitions, will receive more money for training. Those who indicate that they are not interested in studying or who show little commitment to do so, will receive a smaller amount.", "D": "I will decide per individual who applies for training. Those who want to take a course that is a perfect match for the department will receive more budget than those who want to take a less suitable training course."}}, {"n": 9, "q": "The hospital where you serve as director applies targets for the number of medical procedures that need to be carried out. However, to gain new knowledge and to advance the reputation of the hospital, it is important to carry out sufficient experiments as well. This makes it harder to achieve the targets. You are in a position to decide to set new targets. Will you?", "o": {"A": "Up-to-date knowledge and the reputation of the hospital are both so important that I decide to adjust the targets. A good reputation, new inventions, and employees who embrace the opportunities of the future will all combine to generate more revenue anyway.", "B": "No matter how important reputation and knowledge development are to a hospital, in the end, it needs to be a ‘healthy’ business for it to be able to provide good care. I will, therefore, not adjust the targets.", "C": "In order to motivate the staff to keep on developing, I will adjust the targets to include a better focus on gaining knowledge and skills and conducting experiments.", "D": "I will adjust the targets for a portion of the staff; those who apply a high degree of innovation and experiments in their work. The current targets will continue to apply for the rest."}}, {"n": 10, "q": "The nursing home where you serve as director accommodates many long-stay patients. These patients stay here for many, many years, and for them it is convenient if the bedside staff consists of familiar faces as much as possible. This avoids situations where they need to get used to new faces, find out which is the best way to communicate with them, et cetera. For the nursing home, however, change is good. Nurses who have to carry out the same tasks again and again for extended periods of time will easily lose their motivation, have insufficient opportunities to learn how to deal with a wide variety of patients and situations, and are at risk of becoming less attentive due to habituation. Will you focus your management style on change or on retention?", "o": {"A": "The patient experience is paramount. I will try to retain the same staff for the nursing home for as long as possible.", "B": "The proper functioning of the nursing home is what is most important. I will promote staff changes.", "C": "Not only for the patients, but also for the staff themselves it is more convenient not to have to switch jobs too often. I will try to retain the same staff for the nursing home for as long as possible.", "D": "Not only for the nursing home, but also for the staff themselves it is better to switch jobs every now and then. I will promote staff changes."}}, {"n": 11, "q": "A few of the doctors in your team frequently cancel surgical operations due to work schedule inconvenience. They will then have to be replaced, or the operation has to be cancelled. This is inconvenient for the replacement and colleagues, but also for the patients, and it causes a lack of continuity of care. How will you respond to this situation as an OR manager?", "o": {"A": "I will accept it. Physicians are simply in a position to change their schedules whenever and however they want.", "B": "I will not accept it and will discuss the situation with the physicians. Appointments with patients should never be changed unless for very good reasons.", "C": "My department considers a good work-life balance very important. For this reason, physicians are entitled to adjust their schedules to suit their private lives. We will sit down together to reach agreement on the extent to which this is possible.", "D": "The physicians are only entitled to adjust their schedules if their replacement and other employees have no objections."}}, {"n": 12, "q": "It has come to your notice that many residents (i.e. doctor in training) in the department under your management suffer from fatigue, are nearing burnout or are burnt out. This may have an adverse impact on patients and colleagues. To relieve the pressure somewhat, you can implement a downwards adjustment to the number of mandatory contact hours. However, this also entails disadvantages, including the risk of an impaired bond with their medical supervisors (physicians). Which approach will you take?", "o": {"A": "In my approach, the same number of mandatory contact hours will apply to everyone. After all, working in health care is hard work, and residents should better find out sooner than later.", "B": "I will make a distinction, as not everyone can handle the same heavy workload. Care would be compromised if I would make people who are less able to handle a heavy workload work as hard as the rest.", "C": "For the sake of the contact with their medical supervisors, I will urge them to stick to the number of mandatory contact hours. At the same time, I will urge their medical supervisors to watch closely for any signs of excessive fatigue in their ‘pupils’.", "D": "If people feel that they are at risk of collapsing under the pressure of the large number of contact hours, they should bring this to my attention. Together with a few medical supervisors, I will decide for every individual case whether it is necessary to reduce the number of contact hours."}}, {"n": 13, "q": "Residing in your psychiatric institution for children is an eight-year-old boy who does not respond well to some of the staff. While he is great friends with some, he is mostly at odds with a number of others. These employees prefer not to work with the boy. The boy, in his turn, is quite picky in who gets to take care of him and who does not. What will you do? Will you adjust the schedules to ensure that only ‘matching’ staff will work with this boy?", "o": {"A": "In the interest of the staff, I will make sure that only those staff members who can handle him will work with the boy.", "B": "In the interest of the boy, I will make sure that only those staff members who can handle him will work with the boy.", "C": "In order to point out clearly to the boy that he is not the one who is in charge of who gets to work with him, I will let all of the staff work with the boy. I will not take his preferences into account.", "D": "All staff members should be able to work with all patients. I will not adjust the schedules to include only optimal ‘matches’."}}, {"n": 14, "q": "You manage a team in a hospital department. Several of the team members call in sick during their holidays. They may actually be sick, but they may also be doing this under false pretences to save up holidays. Team members who report in sick on a holiday can use this day later to take a day off. At times, this may result in large numbers of free days for the team members concerned, which the rest of the team have to absorb. How will you handle this as a team leader?", "o": {"A": "I trust my staff completely. It is nothing but a mere coincidence that they happen to fall ill during their holidays. I cannot hold them accountable.", "B": "I assume that the team members who call in sick during a holiday are actually sick on that particular day. I will, however, broach the subject during the team meeting. After all, this is an issue that has a serious impact on the entire team.", "C": "I do not trust the situation. It cannot be a coincidence when so many team members report in sick during holidays. I will personally discuss the subject with all of the team members who did this to question whether they have been honest and to point out how annoying this may be to the rest of the team.", "D": "I have to put a stop to this. For this purpose, I will introduce strict rules, require a doctor's note, and perform checks."}}, {"n": 15, "q": "Some of the treatment procedures in the hospital where you serve as director depend on a small number of medical specialists. They threaten to switch to a rival hospital where they will earn more money. Will you try to retain the specialists or would you rather choose to stop offering these particular treatments?", "o": {"A": "I will pay them what they ask. After all, I want to be able to treat all patients.", "B": "There is a limit to my budget for human resources, and I will not cross it. Otherwise, the hospital would go bankrupt.", "C": "I will stop offering these particular therapies and ensure that the hospital specializes in other therapies.", "D": "I say good riddance to employees who leave the hospital for financial reasons. I want highly motivated specialists only."}}, {"n": 16, "q": "A patient wants to be treated for varicose veins. Upon examination, this patient’s varicose veins appear to fall into category 2, which means that the treatment is not covered by health insurance. The patient states that she finds the costs too high, and decides not to go ahead with the operation in spite of her complaints. In the event of classification in category 3, the treatment would be covered. What do you do?", "o": {"A": "I will meet my patient’s need and put her condition down as category 3 instead of category 2. I will bear the responsibility for this choice.", "B": "I will remind my patient of the health benefits of the procedure and urge her to reconsider.", "C": "My involvement stops here. I will not put down category 3 where category 2 applies, as that would drive up the cost of health care.", "D": "I can do nothing about this. Rules are rules, and it is up to the patient to decide whether or not to go ahead with the operation."}}, {"n": 17, "q": "A patient wants to be treated for varicose veins. Upon examination, this patient’s varicose veins appear to fall into category 2. If the classification were category 3, the hospital would receive a higher reimbursement, while the actual procedure is practically identical. It makes no difference to the patient which category you put down. What do you do?", "o": {"A": "I will put down category 3. It is a small adjustment and the only consequence is that the hospital receives more money.", "B": "I will put down category 3, but I will feel guilty about it as it is not entirely honest.", "C": "I will put down category 2, because that is what it is.", "D": "I will ask my supervisor what to do."}}, {"n": 18, "q": "You work as a patient care coordinator for three children from a multiple-problem family. One of your tasks is to arrange for financial support. Being in close contact and having access to financial documents, you soon discover that the children’s mother works in the black economy. A municipal fraud investigator suspects social benefit fraud and turns to you for information. What will you tell him?", "o": {"A": "I will tell the investigator what I know. I am the only one who knows it, and I feel that it is my responsibility to share this knowledge with those who need to know.", "B": "I will tell the investigator what I know. It is not my responsibility, but I feel that this is an unjust burden on the community.", "C": "I will say that I have no knowledge of this. Live and let live. A bit of extra cash can go a long way to help the mother in her difficult situation.", "D": "It seems to me that this is privileged information, so I keep my mouth shut."}}, {"n": 19, "q": "You are the director of a daycare centre for disabled children. The municipality imposes an unrealistic hourly rate. You are allowed to charge €19.- an hour for your work, but the current cost amounts to €23.- an hour. What will you do?", "o": {"A": "I will discuss the matter with the alderman to try to get him to reverse the decision. In the meantime, I will accept the (paltry) rate.", "B": "I will refuse to sign the contract, and will temporarily be unable to provide sufficient care. As a result, the waiting lists will grow and children in need of help will go without help.", "C": "I will accept the hourly rate, as I simply want to provide care. To make ends meet, I will carry out a restructuring that will require me to lay off employees and hire new ones at a lower rate.", "D": "This is a scandal and I will be sure to inform the media. Until the time when the municipality bows to media attention, I will offer care against the low rate. I will share the consequences of this decision with the entire media landscape."}}, {"n": 20, "q": "Integrated care is the trend nowadays. However, partnerships between organizations can, in practice, lead to ‘throwing things over the fence’, a situation in which the organizations keep referring patients to other organizations as long-stay care is too expensive. You are the manager of a rehabilitation centre. Will you acquiesce in this development, or will you, on the contrary, fight it and try to turn the tide?", "o": {"A": "I will acquiesce in the development. One person cannot change the world.", "B": "I will acquiesce. If you play the game of throwing problems over the fence well, you will end up with a financially healthy organization. This, in turn, will benefit both staff and patients.", "C": "I will try to turn the tide by conducting monthly meetings with the organizations with which I collaborate. Together, we can make the difference.", "D": "Each organization has its own responsibility. My rehabilitation centre is not one to participate in the game of throwing problems over the fence. I will set up policies to avoid this, and I will have my staff trained to refrain from such practices."}}, {"n": 21, "q": "One of the junior doctors in your department who is a doctor in training quits and resigns his position in the hospital. During the time this training doctor worked in the hospital, he made a mistake that could lead to reputational damage for the hospital. The information has come out. How will you deal with this as a manager?", "o": {"A": "I will speak to the press whenever I am asked to, but other than that, I will have no part in it. This concerns a mistake made by someone who is no longer involved in the hospital.", "B": "I will get actively involved in explaining the details of this mistake to the media. We need to be transparent at all times, even when it comes to matters that took place in the past.", "C": "I will share no information on the topic. The attention for this mistake will soon die down. Any serious discussion of the matter on my part would only further jeopardize our reputation.", "D": "I will seize this opportunity to show the outside world how we deal with this type of mistakes, in our department and as a hospital. Together with our consultants, I will draft a story that will make the hospital come out smelling like roses."}}, {"n": 22, "q": "You are the director of a hospital. This hospital attracts abundant attention on social media. People are asking questions, they respond to news releases, and they discuss their experiences with the hospital. Social media offer a great platform for interaction with (future) patients, but there is a downside to it as well. For instance, it takes a lot of time and energy to monitor all of this attention and to respond to it in a responsible manner. Furthermore, reputation risk management requires great accuracy. Will you reserve time and budget for social media?", "o": {"A": "I will recruit a large team for web care to engage proactively in social media.", "B": "I will instruct a team of web editors to answer questions only.", "C": "I will do nothing at all. Despite full commitment, the risk is too high that we will slip up in the many replies and messages we would send out.", "D": "I will have the media attention monitored. I will limit our responses to times when it is absolutely necessary to respond or when we have an opportunity to contribute significantly to our reputation."}}, {"n": 23, "q": "Your hospital is struggling with a drug-resistant bacteria. Internally, almost no one knows about this, and outside the hospital, it is completely unknown. You serve on the board of directors. Which approach will you advocate?", "o": {"A": "It is absolutely vital that we release this news. This information is important to the entire region. I will engage a communications agency to broadcast and respond on as many channels as possible, while at the same time trying to minimize reputational damage.", "B": "I will start an internal investigation immediately to find out how this could have happened and who is responsible.", "C": "We will share this across the organization so that all employees are informed and so that they can take precautions. We will ensure internally that we will get rid of the bacteria.", "D": "We will share this information internally, but only with those people who absolutely need to know. We will urge them to keep the information confined within the walls of the institution."}}, {"n": 24, "q": "You are the director of a service flat. For their evening meals, all residents can use a catering service. There is a contract with one sole supplier, and the residents are expected to order their meals from this supplier. A provision to this effect is incorporated in their tenancy contract. Some of the residents are dissatisfied with the meals of this supplier and decide to order their meals elsewhere. How will you respond as a director?", "o": {"A": "I will send a letter to the residents stating that this is unacceptable; if everyone were to order their meals elsewhere, it would become too expensive to offer this service any longer.", "B": "I will accept their decision. Residents should be free to choose their own meals.", "C": "I will personally discuss the matter with each of the dissatisfied residents. I want to hear their story, but I also want to point out to them that ordering your own meals is unacceptable.", "D": "In fact, the complaints of residents are the responsibility of the catering company. I will, therefore, submit them all to the catering company, requesting that they improve the quality of their service."}}, {"n": 25, "q": "You serve on the board of a nursing home. Your staff has tied a women to her bed for a couple of hours. Allegedly, she was being aggressive to the point of becoming a danger to herself, the other patients, and the staff. The BOPZ status (Psychiatric Hospitals [Compulsory Admission] status) was not in place yet and, therefore, taking such measures is not allowed officially, but you can apply for it. If granted, it is allowed to tie up patients subject to strict conditions. What do you do?", "o": {"A": "Tying people up is inhuman and I will definitely not apply for BOPZ status. Those who do decide to tie someone up, will be held accountable. It must never happen again.", "B": "I will not apply for BOPZ status. I fear that this would open the floodgates and that on another occasion the staff will be all too eager to decide in favour of tying patients up.", "C": "I will apply for BOPZ status. Subsequently, I will discuss the very stringent legal conditions internally and supervise compliance. Tying someone up must remain the exception.", "D": "I will apply for BOPZ status. The safety of our staff takes top priority, so they should be allowed to tie patients up if they see no alternative to calm them down."}}, {"n": 26, "q": "Your organization offers a so-called ‘last station’ to people with severe psychiatric problems. You have a lot of suicidal patients in your institution, for instance, for whom adequate help is unavailable. The applications keep rolling in, your organization is becoming overcrowded, and the care providers are under increasingly heavy pressure. This concerns both the number of patients and the severity of their clinical presentation. If you admit new patients, you will no longer be able to cope. However, as you are the only place left for them to turn to, it feels as though you have no choice but to accept them. Furthermore, in many cases, it is unclear who is responsible for these types of cases. What will you do?", "o": {"A": "We will reject patients because otherwise we will not be able to provide proper care for the existing patients.", "B": "We will reject patients in order to make a statement to policymakers. They are in a position to change this situation, but they will not introduce any changes unless they are confronted with shortcomings in the current policy.", "C": "As a last place to turn to, we bear such a heavy social responsibility to certain patients that we will have to keep on admitting them. We will do this only if the patient concerned has nowhere else to turn. This does mean that existing patients will get less care.", "D": "We will continue to admit patients who have nowhere else to turn. We will do this for the sake of these patients, whose predicament should not be aggravated. This does mean that we will need to hire extra staff, which will push us into the red."}}, {"n": 27, "q": "Your hospital is compensated for every inpatient day. This compensation is higher than what you get for a shorter stay. From a financial perspective, a longer stay is, therefore, more attractive, and sometimes, it can be beneficial for patients to be compelled to follow the hospital regime with its peace and proper order. On the other hand, short stays have their advantages as well. Patients often prefer a short stay, and you can fit more treatments in a day. What would you prefer, as the director of this hospital?", "o": {"A": "We will allow patients to stay for longer than strictly necessary in order to be able to claim the higher compensation. This benefits the financial health of the hospital.", "B": "We will allow patients to stay for longer than strictly necessary. This allows us to coerce them into following a daily routine of calm, peace and rest. This will contribute to their speedy recovery and indirectly to our reputation.", "C": "We will try to ensure that people stay for a very short period of time so that we can treat more patients in the same time. In the end, this approach benefits our bottom line and brings in more revenue.", "D": "For the sake of the patients, we will never admit them for longer than necessary without good reason. We will discuss the option with them so that they can stay for longer if that makes them feel more comfortable."}}, {"n": 28, "q": "You are a consultant for a hospital department. In this department, nurses regularly give injections to children. Most of these shots are very inconvenient for the children. Some new versions have been developed that are less burdensome, but they entail additional expenses, which the hospital has to bear. What will you recommend at the time of preparing the hospital policy?", "o": {"A": "The main priority is to run a financially sound hospital. I will, therefore, recommend the use of the injections that do not entail additional expenses.", "B": "The reputation of a hospital is largely the result of patient experiences. I will, therefore, recommend that the injections that are perceived as less burdensome be used at all times.", "C": "As a care provider, one should always choose what is best for the patients. I will, therefore, recommend the use of the injections that are least burdensome to the patients.", "D": "I will recommend to have physicians make their own choice. They are able to assess whether it is necessary in any individual case to use the less burdensome variety."}}, {"n": 29, "q": "After hip replacement surgery, patients are given the choice of partial in-hospital rehabilitation. If recovery takes long, they will have to be admitted to a rehabilitation centre. If, eventually, patients return to their own homes, home care agencies will step in for the final phase of recovery. This passing from ‘station’ to ‘station’ should be as smooth as possible for the patient. As a hospital, you can choose to contribute to smooth proceedings, for instance by providing support in their communication with rehabilitation centres. Will you have your hospital take on additional duties simply because that is what patient-centred care is all about, even though you will not be compensated for it?", "o": {"A": "I am deeply committed to patient-centred care. As a care provider, one should always want what is best for the patients, even if this takes some extra time and money.", "B": "I am deeply committed to patient-centred care. This will boost the reputation of the hospital.", "C": "Patient-centred care is not my concern. It is not the responsibility of hospitals to provide for this type of care. We are not compensated for it, so we cannot afford to take on these duties.", "D": "Patient-centred care is not my concern. We do not specialize in it and so we are not in a position to carry out such duties properly."}}, {"n": 30, "q": "A project proposal has been submitted in your hospital to invest in an OR robot. This innovation will bring many advantages to some patients. This may significantly improve the patient experience with and perception of the hospital, which will benefit the reputation. A focus on innovation will go a long way for our reputation as well. However, the expenses for purchase, installation, and connection will be substantial, and it will require additional training for the staff who will operate the robot. Will you (the director) decide to purchase the robot?", "o": {"A": "No, the expenses for training the staff are too high, relative to the number of patients who will benefit from it.", "B": "Yes, everything that benefits patients is worth the investment.", "C": "Yes, investing in innovations is good for the reputation of the hospital and for the staff, who will see this as a challenge.", "D": "No, this is nothing but ‘toys for the boys’. It will cause disparity and discord between the group of staff who will be trained to work with it and those who will not."}}, {"n": 31, "q": "News reports are singing the praise of an experimental drug. The results are promising for a number of patients who suffer from a very rare condition. A medical specialist in the hospital wants to participate in the experimental study. Prescribing this drug will benefit the doctor-patient relationship as well as contributing to the testing of the new drug. On the other hand, in the short run, this approach will lead to fairly significant additional expenses for the hospital. You serve on the board. What will you recommend?", "o": {"A": "It is unethical to withhold this drug from patients. We simply have to offer it. In order to raise the necessary funds, we will economize on other expenditure items.", "B": "It is wonderful for a hospital to be able to contribute to the development of new drugs. For this reason, we should offer this drug to our patients.", "C": "We will suffer substantial reputational damage if we refrain from offering this drug. Whatever the loss may be in terms of additional expenses will be recouped later as a result of our good reputation.", "D": "We will wait for the drug to reach the market. Until that time, it is too expensive to offer it to our patients."}}, {"n": 32, "q": "It happens quite often in your hospital that patients who are waiting to be admitted want to be admitted sooner or to stay longer. They may be overly concerned about their health, or they may feel lonely at home. Some hospitals flatly refuse to serve as a hotel in this manner, while others agree to meet the patients’ needs. Which approach will you choose as a director?", "o": {"A": "In my hospital, patients are welcome to stay longer if they feel more comfortable doing so. We do, however, set strict limits as to the maximum number of days they are allowed to stay as well as specific requirements pertaining to their reasons for staying longer.", "B": "Patients are not allowed to stay longer than necessary, as this would drive up the costs for the hospital for no good reason.", "C": "My hospital's proper functioning depends on its reputation. For the sake of our reputation, we will accommodate patients who want to stay longer than necessary.", "D": "It is unethical to allow patients to stay longer than they need to. They would occupy beds that could otherwise be used for patients who really do need them. Arranging for extra beds is impossible for a variety of practical reasons."}}, {"n": 33, "q": "Sometimes, patients need to pass through an entire care pathway because of the severity of their condition. They may need a surgical operation, for instance, immediately followed by a course of chemotherapy. Some patients indicate that before undergoing several rounds of therapy, they would like to do something special, such as going on holiday or attending a special wedding. For the patient experience, it would be good to grant them their wish. For the funding of the care pathway, this is less desirable. After all, there is a limit to the time that may pass between diagnosis and treatment. What will your advice be?", "o": {"A": "Patients suffer enough as it is. We will, therefore, always offer them the opportunity to experience some special moments before starting up therapy.", "B": "For the sake of the patient experience, which will benefit our reputation, we will offer our patients the opportunity to experience a couple of special moments before they undergo the necessary rounds of therapy.", "C": "For the sake of the patient's health, we will not allow them to take out time for special events. Their condition might deteriorate in the meantime.", "D": "For the sake of our reputation, we will not allow patients to delay treatment after their diagnosis in order to experience special moments. Exceeding the norm in this respect would give our hospital a bad name, and it would compromise the efficiency and effectiveness of our care."}}, {"n": 34, "q": "In the hospital where you serve as director, medical equipment seems to go missing. This happens in a selfmanaging team. At times, this concerns bandages, but it also happens to drugs and even narcotics, such as morphine. The question is, whose responsibility is it to track down the culprit? The person concerned may be addicted or otherwise vulnerable. How will you handle this situation?", "o": {"A": "I will take charge immediately. This is too serious a matter to be left to the team itself to solve. I will ask the team members to step into my office one by one.", "B": "This is a self-managing team, and it should continue to manage itself even in the face of problems. I will convene the entire team, address the problem and tell them to solve it amongst them.", "C": "This is a self-managing team, and it should continue to manage itself even in the face of problems. I will select one of the team members to discuss the problem, and ask him to find a solution within the team.", "D": "I will take charge immediately. I will call on an investigation bureau to investigate who is stealing the equipment."}}, {"n": 35, "q": "You are head of a hospital department. You have several self-managing teams working in this department, and they generally function very well. One of the teams has decided to stop wearing uniforms and wear their own clothes instead. The reason for this decision is that it allows the team members to have a more informal contact with the patients. You notice that this more informal contact is, indeed, established and that it works out beneficially for the patient experience. And yet, there are some disadvantages attached as well. The level of hygiene may be jeopardized, for instance, and the department itself becomes less uniform in appearance. Will you allow them to wear their own clothes?", "o": {"A": "I will allow it. Self-managing is self-managing, and it leaves no room for thwarting the choices the team makes.", "B": "I will allow it. I do think that it will be pleasant for the patients, and in the end, the patient experience is what matters most.", "C": "I will allow it for now, but I will subsequently develop a framework to delineate the margins of freedom for the self-managing teams.", "D": "I will not allow it. It is unsanitary. You never know where the employees have been and what they have done wearing those clothes."}}, {"n": 36, "q": "You are in charge of a residential group in a nursing home for elderly people. Several highly motivated volunteers work within this residential group. They offer a lot of help doing chores such as cleaning and tidying. There is a lot of work to do, the rate of sickness absenteeism is high, and hiring new employees is too expensive. None of the volunteers are qualified nurses, but one of them likes to help out a little extra to relieve the pressure on the professionals. This involves bathing, dressing and feeding. These are no difficult tasks, but the official rule is that only qualified professionals are allowed to carry them out. Will you allow this volunteer to help out?", "o": {"A": "No, I will not allow it. If the inspection finds out that this happens in our nursing home, our reputation will be shot to ribbons.", "B": "No, I will not allow it. Our responsibility as a nursing home is to offer our patients the best possible care, and that includes that they should be cared for by professionals.", "C": "I will allow it. Any help is welcome. Furthermore, it is better if a volunteer helps the elderly to take a shower, get dressed and eat their meals than if they have to wait for a long time or even go without this help.", "D": "I will allow it, provided that the professionals supervise the volunteer to verify that the tasks are carried out properly."}}, {"n": 37, "q": "In your facility for mentally challenged young people, you notice that one of the volunteers is not performing adequately. The food she cooks is unhealthy, and she can be quite snappy with the patients. You do need this volunteer, though. Without her, the rest of the staff would be under even more pressure. What will you do?", "o": {"A": "I will let it pass. It does not bother the patients all that much, and we do really need this volunteer.", "B": "I will confront the volunteer and tell her in no uncertain terms that this behaviour is not acceptable. Subsequently, I will ensure that her work is monitored more frequently. This does mean, of course, that we will run the risk that she will resign.", "C": "I will tell the volunteer that her help is no longer wanted. The resulting gap will temporarily have to be filled by the employees.", "D": "I will ask the volunteer's colleagues to point out to her that she is not performing adequately, and to coach her into doing a better job."}}, {"n": 38, "q": "In your nursing home, it is your deliberate strategy to engage the help of many volunteers and informal caregivers. They help to relieve the workload, they cost less, and volunteers are often happy to be able to give back to society. Some volunteers come into work so often that the professional employees almost see them as paid colleagues. Will you, as an employer, treat them accordingly? Will you offer them training opportunities, for instance, or will you take precautions to prevent burnout, and will you prepare a personal development plan with and for them?", "o": {"A": "No, their personal development, health, et cetera are not my responsibility.", "B": "No, it would be too expensive to offer them these facilities. I will, however, encourage them to take good care of themselves and I will motivate them to continue developing their skills.", "C": "Yes, I will offer them these facilities. Volunteers and informal caregivers are of vital importance to our organization. I will be happy to invest time and money in them.", "D": "Yes, I will offer them these facilities. I would not want to lose our volunteers and informal caregivers. The job satisfaction of the paid employees would suffer if they were to leave."}}, {"n": 39, "q": "The institution where you serve as manager offers home-away-from-home services. A home-like setting can add greatly to the comfort of residents (and to the peace of mind of their caregivers and relatives). They indicate that they want to bring their own furniture and decorations, clean their own apartment, invite overnight guests, care for their pets, et cetera. If you allow them to do so, this will enhance the residents’ experience, and it is likely to improve both the reputation of the institution and the atmosphere. On the other hand, allowing them this freedom may also detract from the peaceful, orderly setting in your institution, its level of hygiene, and it may lead to conflicts among residents. What will you do?", "o": {"A": "I will allow them this freedom. This will enhance the reputation and atmosphere within our institution, which will eventually improve our operations.", "B": "I will allow them this freedom. It will enable our institution to economize on cleaning and save on furniture, for instance. The money we save can be spent doing other things.", "C": "I will not allow them this freedom. It would disrupt our peaceful setting and lead to disparity among residents, when those are exactly the qualities that are so important to the people who come to live with us.", "D": "I will not allow them this freedom. We would risk deterioration in hygienic conditions. As an institution, we need to be on top of this at all times."}}, {"n": 40, "q": "A private investor expresses the intention to invest in your hospital. This investment is important for you to be able to offer one of your services at a lower rate, so that you can increase your revenue. This investor, however, also invests in the tobacco industry. Signing a contract with this particular investor could, conceivably, damage your reputation. Will you sign the contract?", "o": {"A": "No, I will thank the investor for his offer, but my hospital would suffer undue harm to its reputation if we were to sign a deal with this investor.", "B": "No, I will decline the offer on moral grounds. As a hospital director, I want to have nothing to do with a party who invests in such unhealthy products.", "C": "Yes, I will sign the deal with this investor. The funds will go a long way towards optimizing our care, which, after all, is our main priority.", "D": "Yes, I will sign the deal with this investor. The fact that he has invested part of his capital in unrelated products has nothing to do with his investment in my hospital."}}, {"n": 41, "q": "You serve as the director of a chain of care homes. One of these care homes is located in the Randstad. This particular home is performing very well. With a view to population ageing, the managers approach you asking whether it would be possible to build an additional home. There is no cause for alarm at this point in time, but expectations are that in five years’ time, the care home will be filled to capacity and will not be able to admit any new residents. This is a particularly tough choice to make, if for no other reason than that it involves a long-term decision. On the other hand, you want your chain to be future-resilient. What would be your decision? Would you decide to build a new home or not?", "o": {"A": "We will have to build a new care home. It is always difficult to make predictions, but current knowledge provides us with enough grounds to start building a new home.", "B": "We will have to build a new care home. If we do not, we would be sending a message to the outside world that our chain is not keeping up with the times, when, on the contrary, we want to communicate that we think ahead and that even today, we are already keeping in mind the best interests of our future elderly residents.", "C": "We will not build a new care home. So many things can change in five years’ time. The policy focus is on helping seniors to stay at home longer. At this point in time, it is too risky.", "D": "We will build a new care home, but we will ask the municipality to share the risk with us. They will, of course, demand joint control in return, at the expense of our autonomy as a private institution. However, it is only on this condition that we are prepared to accept the risk."}}, {"n": 42, "q": "Systems and protocols regulate the health care landscape in the Netherlands. They are important to ensure that our health care is properly regulated. Nevertheless, systems and standards may adversely affect our health care. For example, care providers may become obsessed with performance figures, to the point where patient satisfaction is almost completely ignored. Imagine that you are the director of a nursing home. To what extent will you focus on the execution of protocols and guidelines?", "o": {"A": "The well-being of the patients is my top priority. I will, therefore, focus on my patients’ happiness and joy in life, even if that means bypassing protocols sometimes.", "B": "The experience of the patients is extremely important, but proper care depends on proper regulation. I would take the matter up with the staff to find out which protocols they feel are necessary. Apart from this, the patients’ well- being must be the guiding principle.", "C": "The experience of the patients is important, but proper performance of the organization and assurance of the quality of care are more important to me. These aspects simply require a lot of rules and protocols, and I will not breach them.", "D": "I feel that it is important to adhere to guidelines and protocols. They are there for a reason. Failure to adhere to them may land us in trouble with the inspection. That is a situation I want to avoid."}}, {"n": 43, "q": "Only a few hospitals are left in the province of Zeeland, the majority of which provide emergency care only. It is no longer efficient nor cost-effective to offer all specialities. Patients will simply have to travel to Rotterdam, for instance. The plan now is to limit hospital care in Zeeland to emergency care only, and to move all other specialities to Rotterdam. The prospect is daunting to the people living in Zeeland. They will have to travel a lot further to get medical help – sometimes even in life-threatening situations. Furthermore, the plan involves longer-distance commuting for the hospital staff from Zeeland once everything is relocated to Rotterdam. However, from a financial and knowledge sharing perspective, for instance, relocation is a sound idea. You work for a health insurance company. What would you recommend?", "o": {"A": "I would argue in favour of relocation to Rotterdam. At a certain point, this is bound to happen anyway, the hospitals in Zeeland cannot possibly continue to offer all of the care indefinitely.", "B": "I would argue in favour of relocation to Rotterdam. If we want to improve health care in our region, all medical professionals will have to work together.", "C": "I would argue against relocation to Rotterdam. A patient from Zeeland in need of urgent, specialized care should not be redirected to Rotterdam. They might die.", "D": "I would argue against relocation to Rotterdam. For a good patient experience, it is essential to ensure continuity of the hospitals in Zeeland."}}, {"n": 44, "q": "You are on the management team of a nursing home. The HR manager wants the nursing home to transition to a new HR policy in order to distinguish itself in the marketplace. He wants to recruit capable staff and minimize staff turnover. The legal department and the line managers oppose all of these changes. What is your opinion on implementing the changes?", "o": {"A": "Employee resistance is always brief. In retrospect, they are usually happy with the changes. We will, therefore, switch to the new HR policy.", "B": "No matter how serious the resistance of the employees, we will switch to a new HR policy. It is simply necessary in order to ensure that the hospital operations remain healthy.", "C": "I will give consideration to the objections of the employees, and I will convene meetings to listen to their arguments. Even if it takes some time, we will duly consider their views in developing the new HR policy.", "D": "We will not implement any changes. HR policy should be beneficial to employees. If they protest, apparently the changes are not a good idea."}}, {"n": 45, "q": "A new HR policy is implemented in a hospital for the purpose of enhancing the well-being of the staff. The new policy mainly motivates employees to continue developing their talents and skills. For this purpose, they are required to rotate to a new department every four years. As a consultant, you have been asked to provide advice on this development. Do you think that it will, indeed, enhance the employees’ well-being?", "o": {"A": "Yes, I do think that it may enhance the well-being of some employees, but only if they themselves are ambitious and welcome change. I will recommend that they should have a choice in the matter.", "B": "Yes, this will enhance the well-being of all employees.", "C": "No, on the contrary, long-term commitment to a single department is what will enhance the well-being of employees.", "D": "No, I would not recommend mandatory rotation. All employees should be allowed to make their own choice."}}, {"n": 46, "q": "Your organization offers care for the disabled. The organization is performing at an excellent level, but is known for its incoherence. Several units work independently, but they collaborate insufficiently. Scientific studies show that teamwork leads to successful achievements. In response, you create new teams that rotate frequently and work closely together. After six months, the team leaders tell you that the new approach is not panning out for them; they are not happy with it. Will you decide to switch back to the old way of working?", "o": {"A": "No, this new approach deserves a longer trial period. Six months is not enough to assess whether the new approach is successful or not.", "B": "No, it would take too much time and resources to switch back. We will continue as planned. Employees who are unhappy with this method of working are likely to resign of their own accord.", "C": "I will ask the team leaders what it is exactly that they dislike about the new method of working. Wherever necessary and possible, I will implement adjustments.", "D": "I will switch back to the old way of working. If the teams are not functioning properly, the entire organization will not function properly, and this is bound to go from bad to worse."}}, {"n": 47, "q": "You are the manager of an emergency department. In order to improve security in this department, you have developed a new checklist together with your colleagues. A number of employees have embraced the list with enthusiasm, but others question its effectiveness. Some critics complain about the large number of procedures, the top-down method of implementation, as well as a number of other aspects. Will you choose to continue working with the new checklist despite the criticism?", "o": {"A": "We will continue to use the new checklist. It has taken me a lot of time to develop and it is well-thought-out.", "B": "We will continue to use the checklist, but will adjust it to some extent where possible and necessary. I want to be known as a manager who listens to the voices and opinions of the staff.", "C": "I will explain that the checklist serves as a guideline. If practice requires the staff to deviate from this list, I trust them to do so in a responsible manner.", "D": "Checklists are there to improve the quality of the work. If they fail to succeed in doing so, that in itself is reason enough to discontinue their use. We will stop using this checklist."}}, {"n": 48, "q": "You are the head of a hospital department. Your supervisor has given you instructions to increase productivity by ten per cent. Although this is possible, it will require your full commitment. To be able to do this, you will have to delegate one of your duties to one of your staff. You have already found a suitable candidate, but this person is very insecure about his abilities. You are absolutely convinced that he will be able to carry out the task, but he is apprehensive about doing it alone and asks for your support. As all of your time is consumed by the assignment of your supervisor, you do not have the time for this. What will you do?", "o": {"A": "I will have a serious discussion with him, trying to persuade him to assume the full task himself.", "B": "Despite his insecurities, I will delegate the task to him. I will ask him to contribute ideas about the best way to carry it out, leaving plenty of room for his needs.", "C": "I will delegate the task to him, providing an extensive description of the subtasks, an updated to-do list, and a planning until the time I will be able to reassume it. All he will have to do is follow the task list.", "D": "I have no time to support him and will look for a candidate who is less insecure and does have the courage to assume this task."}}, {"n": 49, "q": "You are a team leader in a care home. In the past, you have had a lot of disagreement with someone from your team. She is a slow worker and needs constant reminders and encouragement to do her work properly and efficiently. Without your encouragement, she has dropped the ball on a number of occasions. In the past few weeks, she has suddenly started to work fast and efficiently, even without any encouragement on your part. You feel that this might be the right time to give her a little more freedom, but on the other hand, you fear that she might relapse into old habits. How will you deal with her?", "o": {"A": "I will continue to monitor her closely. Chances are that she will relapse at some point in time, and I want to avoid this.", "B": "I will continue to monitor her, but I will also try to show her that I appreciate her ‘new and improved’ work ethics. I will mainly do this by inviting her to contribute ideas about important issues and decisions.", "C": "I will give her back the same freedom and responsibilities I give to her colleagues. She has proven herself to be capable of doing a good job.", "D": "I will give her back the freedom and responsibilities she had before, and a little extra to reward her. This will encourage her to keep up the good work."}}, {"n": 50, "q": "In the family-type care home where you serve as manager, the care teams work highly independently. They usually function very well, and the knowledge and skills of the staff are up to date. You ensure that the work is properly distributed, and you provide them with advice, tips, and encouragement whenever necessary. However, over the past few weeks, their job performance has gone down considerably. The teams barely manage or even fail to reach the daily norms, and the quality of the work has plummeted. You do not want to convey a lack of trust in the teams, but they give you no choice but to take action. What will you do?", "o": {"A": "I will bring the results to the attention of the care teams. This will make it very clear to them that they are failing to reach the daily norms, and that the quality of the work is substandard. Subsequently, I will give them the instruction to improve their performance themselves.", "B": "Together with the care teams, I will consider ways in which we can improve their performance. Subsequently, I will place the responsibility for implementation on the teams.", "C": "I will hold the care teams accountable and tell them to improve their performance without delay. In addition, I will tell them that I will monitor them more closely.", "D": "In each care team, I will appoint two designated individuals to encourage the rest of the team to improve the quality of their work."}}];
const L = ['A','B','C','D'];
const KEY = 'dilemmaGame.v1';
let S = load() || fresh();
let view = S.players.length >= 2 ? 'play' : 'setup';
let ui = {picker:null, revealIdx:0, timer:null, timerEnd:0};

function fresh(){return {players:[], roundsPerPlayer:2, holderIdx:0, current:null, history:[]}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(S))}catch(e){}}
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D = n => DILEMMAS[n-1];
const holder = () => S.players[S.holderIdx % S.players.length];
const usedNums = () => [...S.history.map(h=>h.n), ...(S.current?[S.current.n]:[])];
const target = () => S.players.length * S.roundsPerPlayer;

function go(v){view=v;render();window.scrollTo(0,0)}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)});

function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  ({setup:rSetup,play:rPlay,results:rResults,library:rLibrary,rules:rRules})[view]();
}

/* ---------- SETUP ---------- */
function rSetup(){
  const p = S.players.length ? S.players : ['','',''];
  $('#app').innerHTML = `
  <div class="card">
    <h1>Spelers</h1>
    <p class="muted">Een groep van 3 tot 5 spelers. De eerste speler is de eerste dilemmahouder; daarna schuift de rol door.</p>
    <div class="grid" id="plist">${p.map((n,i)=>pRow(n,i)).join('')}</div>
    <div class="row" style="margin-top:12px">
      <button class="btn sm" id="addP">+ Speler</button>
      <span class="muted small">Max. 5</span>
    </div>
  </div>
  <div class="card">
    <h2>Speleinde</h2>
    <div class="row"><label>Elke speler is
      <input type="number" id="rpp" min="1" max="5" value="${S.roundsPerPlayer}" style="width:70px;display:inline-block"> keer dilemmahouder</label></div>
    <p class="muted small">Advies uit de spelregels: twee keer per speler. Je mag eerder stoppen.</p>
  </div>
  <div class="row">
    <button class="btn primary" id="startBtn">Opslaan en spelen</button>
    ${S.history.length||S.current?'<button class="btn ghost" id="resetBtn">Nieuw spel (wist alles)</button>':''}
  </div>`;
  $('#addP').onclick=()=>{const l=$('#plist');if(l.children.length<5)l.insertAdjacentHTML('beforeend',pRow('',l.children.length))};
  $('#startBtn').onclick=()=>{
    const names=[...document.querySelectorAll('.pname')].map(i=>i.value.trim()).filter(Boolean);
    if(names.length<2){alertBox('Vul minstens twee namen in.');return}
    if(new Set(names).size!==names.length){alertBox('Gebruik unieke namen.');return}
    S.players=names; S.roundsPerPlayer=Math.max(1,Math.min(5,+$('#rpp').value||2));
    save(); go('play');
  };
  const r=$('#resetBtn'); if(r) r.onclick=()=>{ if(r.dataset.c){S=fresh();save();render()} else {r.dataset.c=1;r.textContent='Klik nogmaals om te bevestigen'} };
}
function pRow(n,i){return `<input type="text" class="pname" placeholder="Naam speler ${i+1}" value="${esc(n)}">`}
function alertBox(m){let a=$('#msg');if(!a){$('#app').insertAdjacentHTML('afterbegin','<div class="privacy" id="msg" style="margin-bottom:14px"></div>');a=$('#msg')}a.textContent=m}

/* ---------- PLAY ---------- */
const STEPS=['Trekken','Kiezen','Onthullen','Discussie','Beoordeling'];const STEPNO=['1','2','3–4','5','6'];
function rPlay(){
  if(S.players.length<2){$('#app').innerHTML=`<div class="card"><h1>Nog geen spelers</h1><p class="muted">Voeg eerst spelers toe.</p><button class="btn primary" onclick="go('setup')">Naar spelers</button></div>`;return}
  const c=S.current, stepI=c?c.step:0;
  const doneN=S.history.length;
  let head=`<div class="row" style="justify-content:space-between;margin-bottom:8px">
     <div><span class="pill">Ronde ${doneN+1} van ${target()}</span> <span class="muted small">Dilemmahouder: <b>${esc(holder())}</b></span></div>
     <div class="players">${S.players.map((p,i)=>`<span class="pchip ${i===S.holderIdx%S.players.length?'holder':''}" style="cursor:default">${esc(p)} · ${S.history.filter(h=>h.holder===p).length}×</span>`).join('')}</div>
  </div>
  <div class="steps">${STEPS.map((s,i)=>`<div class="step ${i===stepI?'on':''} ${i<stepI?'done':''}"><b>Stap ${STEPNO[i]}</b>${s}</div>`).join('')}</div>`;
  if(doneN>=target() && !c){
    $('#app').innerHTML=head+`<div class="card"><h1>Spel compleet</h1><p class="muted">Iedereen is ${S.roundsPerPlayer}× dilemmahouder geweest.</p><div class="row"><button class="btn primary" onclick="go('results')">Bekijk resultaten</button><button class="btn" id="more">Toch nog een ronde</button></div></div>`;
    $('#more').onclick=()=>{S.roundsPerPlayer++;save();render()};return;
  }
  if(!c) return pDraw(head);
  [null,pChoose,pReveal,pDiscuss,pAssess][c.step](head);
}
function dilemmaCard(n,interactive){
  const d=D(n);
  return `<div class="card"><div class="row" style="justify-content:space-between"><span class="pill warn">Dilemma ${n}</span></div>
   <p class="dq" style="margin:12px 0 4px">${esc(d.q)}</p>
   ${L.map(k=>`<div class="opt"><div class="let l${k}">${k}</div><div>${esc(d.o[k])}</div></div>`).join('')}</div>`;
}
function pDraw(head){
  const free=DILEMMAS.map(d=>d.n).filter(n=>!usedNums().includes(n));
  $('#app').innerHTML=head+`<div class="card" style="text-align:center">
    <h1>${esc(holder())}, kies een dilemma</h1>
    <p class="muted">Trek een willekeurig nummer tussen 1 en 50 (al gespeelde dilemma's worden overgeslagen) of kies zelf een nummer.</p>
    <div class="big" id="rollNum">?</div>
    <div class="row" style="justify-content:center;margin-top:14px">
      <button class="btn primary" id="roll">🎲 Willekeurig trekken</button>
      <input type="number" id="manual" min="1" max="50" placeholder="1–50" style="width:90px">
      <button class="btn" id="pick">Kies dit nummer</button>
    </div>
    <p class="muted small" style="margin-top:14px">Nog ${free.length} ongespeelde dilemma's.</p>
  </div>`;
  $('#roll').onclick=()=>{
    const el=$('#rollNum');let t=0;$('#roll').disabled=true;
    const iv=setInterval(()=>{el.textContent=1+Math.floor(Math.random()*50);if(++t>14){clearInterval(iv);const n=free[Math.floor(Math.random()*free.length)];el.textContent=n;setTimeout(()=>start(n),500)}},60);
  };
  $('#pick').onclick=()=>{const n=+$('#manual').value;if(n>=1&&n<=50)start(n)};
}
function start(n){S.current={n,holder:holder(),step:1,choices:{},motiv:{},assess:{}};ui.revealIdx=0;ui.picker=null;save();render()}

function pChoose(head){
  const c=S.current, done=Object.keys(c.choices);
  const all=S.players.every(p=>c.choices[p]);
  let picker='';
  if(ui.picker){
    const p=ui.picker, sel=c.choices[p]||'';
    picker=`<div class="card" style="border-color:var(--accent)">
      <h2>${esc(p)}: jouw keuze (geheim)</h2>
      ${L.map(k=>`<button class="opt ${sel===k?'sel':''}" data-k="${k}"><div class="let l${k}">${k}</div><div>${esc(D(c.n).o[k])}</div></button>`).join('')}
      <label class="small muted" style="display:block;margin-top:12px">Kernwoorden van je motivatie (alleen voor jezelf, zichtbaar bij het onthullen)</label>
      <textarea id="mot">${esc(c.motiv[p]||'')}</textarea>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="saveC" ${sel?'':'disabled'}>Opslaan en verbergen</button></div>
    </div>`;
  }
  $('#app').innerHTML=head+dilemmaCard(c.n)+`
   <div class="card"><h2>Stap 2 · Iedereen kiest, zonder te overleggen</h2>
   <div class="privacy">Speel je op één scherm? Geef het apparaat door. Ieder tikt op zijn eigen naam, kiest en klikt op opslaan; de keuze verdwijnt dan uit beeld.</div>
   <div class="players" style="margin-top:14px">${S.players.map(p=>`<button class="pchip ${c.choices[p]?'done':''} ${p===c.holder?'holder':''}" data-p="${esc(p)}">${c.choices[p]?'✓ ':''}${esc(p)}</button>`).join('')}</div>
   </div>${picker}
   <div class="row"><button class="btn primary" id="next" ${all?'':'disabled'}>Iedereen heeft gekozen → onthullen</button>
   <button class="btn ghost" id="cancel">Dilemma annuleren</button></div>`;
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ui.picker=b.dataset.p;render()});
  document.querySelectorAll('button.opt').forEach(b=>b.onclick=()=>{c.choices[ui.picker]=b.dataset.k;c.motiv[ui.picker]=$('#mot').value;render()});
  const sc=$('#saveC'); if(sc) sc.onclick=()=>{c.motiv[ui.picker]=$('#mot').value;ui.picker=null;save();render()};
  $('#next').onclick=()=>{c.step=2;ui.revealIdx=0;save();render()};
  $('#cancel').onclick=()=>{S.current=null;save();render()};
}
function order(){const c=S.current;return [c.holder,...S.players.filter(p=>p!==c.holder)]}
function pReveal(head){
  const c=S.current, ord=order(); const shown=ord.slice(0,ui.revealIdx+1);
  $('#app').innerHTML=head+dilemmaCard(c.n)+`<div class="card">
   <h2>Stap 3 en 4 · Onthullen en motiveren</h2>
   <p class="muted small">De dilemmahouder begint en legt uit waarom hij of zij voor dit alternatief koos in plaats van voor de andere. Daarna volgen de anderen één voor één. Nog geen discussie.</p>
   ${shown.map((p,i)=>`<div class="reveal ${i===0?'h':''}"><div class="row"><div class="let l${c.choices[p]}">${c.choices[p]}</div><b>${esc(p)}</b>${i===0?'<span class="pill warn">dilemmahouder</span>':''}</div>
     ${c.motiv[p]?`<div class="small muted" style="margin-top:6px">${esc(c.motiv[p])}</div>`:''}</div>`).join('')}
   <div class="row" style="margin-top:14px">
   ${ui.revealIdx<ord.length-1?`<button class="btn primary" id="nx">Onthul ${esc(ord[ui.revealIdx+1])}</button>`:`<button class="btn primary" id="toD">Naar de discussie</button>`}
   </div>
   ${ui.revealIdx===ord.length-1?distBlock(c.choices):''}
  </div>`;
  const nx=$('#nx'); if(nx) nx.onclick=()=>{ui.revealIdx++;render()};
  const t=$('#toD'); if(t) t.onclick=()=>{c.step=3;save();render()};
}
function distBlock(ch){
  const v=Object.values(ch), cnt=L.map(k=>v.filter(x=>x===k).length);
  return `<div style="margin-top:16px"><h3>Verdeling</h3><div class="bar">${L.map((k,i)=>cnt[i]?`<div style="flex:${cnt[i]};background:var(--${k})" title="${k}: ${cnt[i]}"></div>`:'').join('')}</div>
   <div class="legend" style="margin-top:6px">${L.map((k,i)=>`<span><i style="background:var(--${k})"></i>${k}: ${cnt[i]}</span>`).join('')}</div></div>`;
}
function pDiscuss(head){
  const c=S.current;
  $('#app').innerHTML=head+dilemmaCard(c.n)+`<div class="card">
   <h2>Stap 5 · Discussie</h2>
   <p class="muted">Wat is in deze situatie het beste om te doen? Kun je de anderen overtuigen, of overtuigen zij jou? Ook als jullie hetzelfde antwoord kozen, kan de motivatie verschillen.</p>
   <div class="row"><div class="big" id="clock">10:00</div>
     <select id="mins" style="width:auto">${[5,8,10,15,20].map(m=>`<option ${m===10?'selected':''}>${m}</option>`).join('')}</select><span class="muted small">min</span>
     <button class="btn" id="tgo">Start timer</button></div>
   <label class="small muted" style="display:block;margin-top:14px">Notities van de discussie (gedeeld)</label>
   <textarea id="notes">${esc(c.notes||'')}</textarea>
   ${distBlock(c.choices)}
   <div class="row" style="margin-top:14px"><button class="btn primary" id="toA">Naar de beoordeling</button></div>
  </div>`;
  $('#notes').oninput=e=>{c.notes=e.target.value;save()};
  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  $('#mins').onchange=e=>{if(!ui.timer)$('#clock').textContent=fmt(e.target.value*60)};
  $('#tgo').onclick=()=>{
    clearInterval(ui.timer);ui.timerEnd=Date.now()+$('#mins').value*60000;
    ui.timer=setInterval(()=>{const el=$('#clock');if(!el){clearInterval(ui.timer);ui.timer=null;return}
      const s=Math.max(0,Math.round((ui.timerEnd-Date.now())/1000));el.textContent=fmt(s);if(!s){clearInterval(ui.timer);ui.timer=null;el.style.color='var(--warn)'}},250);
  };
  $('#toA').onclick=()=>{clearInterval(ui.timer);ui.timer=null;c.step=4;save();render()};
}
function pAssess(head){
  const c=S.current, others=S.players;
  c.assess=c.assess||{};
  $('#app').innerHTML=head+`<div class="card"><span class="pill warn">Dilemma ${c.n}</span>
   <p class="small muted" style="margin:8px 0 0">${esc(D(c.n).q)}</p>
   <p style="margin:10px 0 0">Standpunt dilemmahouder <b>${esc(c.holder)}</b>: <span class="let l${c.choices[c.holder]}" style="display:inline-grid;width:24px;height:24px;font-size:13px">${c.choices[c.holder]}</span></p></div>
   <div class="card"><h2>Stap 6 · Beoordeling</h2>
   <p class="muted small">Iedereen geeft aan in hoeverre hij of zij het oorspronkelijke standpunt van de dilemmahouder steunt: zowel de keuze als de argumentatie. Wil je je eigen keuze herzien? Noteer dan wie je overtuigde, en met welk argument.</p>
   ${others.map(p=>{const a=c.assess[p]||{};return `<div class="reveal" data-ap="${esc(p)}" style="margin-top:14px">
     <div class="row" style="justify-content:space-between"><b>${esc(p)}</b><span class="small muted">eerste keuze: <b>${c.choices[p]}</b></span></div>
     ${p!==c.holder?`<div class="small muted" style="margin-top:8px">Steun voor standpunt dilemmahouder</div>
     <div class="scale" data-f="approve">${[1,2,3,4,5].map(v=>`<button class="${a.approve===v?'on':''}" data-v="${v}">${['Helemaal oneens','Oneens','Neutraal','Eens','Helemaal eens'][v-1]}</button>`).join('')}</div>`:''}
     <div class="grid g2" style="margin-top:10px">
      <div><div class="small muted">Eindkeuze na discussie</div><select data-f="final">${L.map(k=>`<option ${(a.final||c.choices[p])===k?'selected':''}>${k}</option>`).join('')}</select></div>
