we aan extra kosten verliezen, verdienen we later terug dankzij onze goede reputatie.", "D": "We wachten tot het middel op de markt komt. Tot die tijd is het te duur om het aan onze patiënten aan te bieden."}}, "f": {"A": "patient", "B": "maatschappij", "C": "reputatie", "D": "organisatie"}}, {"n": 32, "q": "It happens quite often in your hospital that patients who are waiting to be admitted want to be admitted sooner or to stay longer. They may be overly concerned about their health, or they may feel lonely at home. Some hospitals flatly refuse to serve as a hotel in this manner, while others agree to meet the patients’ needs. Which approach will you choose as a director?", "o": {"A": "In my hospital, patients are welcome to stay longer if they feel more comfortable doing so. We do, however, set strict limits as to the maximum number of days they are allowed to stay as well as specific requirements pertaining to their reasons for staying longer.", "B": "Patients are not allowed to stay longer than necessary, as this would drive up the costs for the hospital for no good reason.", "C": "My hospital's proper functioning depends on its reputation. For the sake of our reputation, we will accommodate patients who want to stay longer than necessary.", "D": "It is unethical to allow patients to stay longer than they need to. They would occupy beds that could otherwise be used for patients who really do need them. Arranging for extra beds is impossible for a variety of practical reasons."}, "nl": {"q": "In jouw ziekenhuis komt het geregeld voor dat patiënten die op de wachtlijst voor opname staan eerder opgenomen willen worden of langer willen blijven. Misschien maken ze zich overdreven zorgen over hun gezondheid, of voelen ze zich thuis eenzaam. Sommige ziekenhuizen weigeren botweg als hotel te fungeren, andere komen aan de behoeften van de patiënten tegemoet. Welke aanpak kies je als bestuurder?", "o": {"A": "In mijn ziekenhuis zijn patiënten welkom om langer te blijven als ze zich daar prettiger bij voelen. Wel stellen we strikte grenzen aan het maximale aantal dagen dat ze mogen blijven, en specifieke eisen aan de redenen om langer te blijven.", "B": "Patiënten mogen niet langer blijven dan nodig is, want dat drijft de kosten voor het ziekenhuis zonder goede reden op.", "C": "Het goed functioneren van mijn ziekenhuis hangt af van zijn reputatie. Omwille van onze reputatie komen we tegemoet aan patiënten die langer willen blijven dan nodig is.", "D": "Het is onethisch om patiënten langer te laten blijven dan nodig is. Zij zouden bedden bezetten die anders gebruikt kunnen worden voor patiënten die ze echt nodig hebben. Extra bedden regelen is om uiteenlopende praktische redenen onmogelijk."}}, "f": {"A": "patient", "B": "organisatie", "C": "reputatie", "D": "maatschappij"}}, {"n": 33, "q": "Sometimes, patients need to pass through an entire care pathway because of the severity of their condition. They may need a surgical operation, for instance, immediately followed by a course of chemotherapy. Some patients indicate that before undergoing several rounds of therapy, they would like to do something special, such as going on holiday or attending a special wedding. For the patient experience, it would be good to grant them their wish. For the funding of the care pathway, this is less desirable. After all, there is a limit to the time that may pass between diagnosis and treatment. What will your advice be?", "o": {"A": "Patients suffer enough as it is. We will, therefore, always offer them the opportunity to experience some special moments before starting up therapy.", "B": "For the sake of the patient experience, which will benefit our reputation, we will offer our patients the opportunity to experience a couple of special moments before they undergo the necessary rounds of therapy.", "C": "For the sake of the patient's health, we will not allow them to take out time for special events. Their condition might deteriorate in the meantime.", "D": "For the sake of our reputation, we will not allow patients to delay treatment after their diagnosis in order to experience special moments. Exceeding the norm in this respect would give our hospital a bad name, and it would compromise the efficiency and effectiveness of our care."}, "nl": {"q": "Soms moeten patiënten vanwege de ernst van hun aandoening een heel zorgtraject doorlopen. Ze hebben bijvoorbeeld een operatie nodig, direct gevolgd door een chemokuur. Sommige patiënten geven aan dat ze vóór meerdere behandelrondes nog iets bijzonders willen doen, zoals op vakantie gaan of een bijzondere bruiloft bijwonen. Voor de patiëntbeleving is het goed om hun wens in te willigen. Voor de financiering van het zorgtraject is dat minder wenselijk. Er is immers een grens aan de tijd die tussen diagnose en behandeling mag verstrijken. Wat is jouw advies?", "o": {"A": "Patiënten lijden al genoeg. Daarom bieden we hun altijd de gelegenheid om een paar bijzondere momenten mee te maken voordat de therapie begint.", "B": "Omwille van de patiëntbeleving, die goed is voor onze reputatie, bieden we onze patiënten de gelegenheid een paar bijzondere momenten mee te maken voordat ze de noodzakelijke behandelrondes ondergaan.", "C": "Omwille van de gezondheid van de patiënt laten we geen tijd nemen voor bijzondere gebeurtenissen. Zijn of haar toestand kan intussen verslechteren.", "D": "Omwille van onze reputatie laten we patiënten na de diagnose de behandeling niet uitstellen om bijzondere momenten mee te maken. Het overschrijden van de norm op dit punt zou ons ziekenhuis een slechte naam bezorgen en de doelmatigheid en effectiviteit van onze zorg aantasten."}}, "f": {"A": "patient", "B": "reputatie", "C": "patient", "D": "reputatie"}}, {"n": 34, "q": "In the hospital where you serve as director, medical equipment seems to go missing. This happens in a selfmanaging team. At times, this concerns bandages, but it also happens to drugs and even narcotics, such as morphine. The question is, whose responsibility is it to track down the culprit? The person concerned may be addicted or otherwise vulnerable. How will you handle this situation?", "o": {"A": "I will take charge immediately. This is too serious a matter to be left to the team itself to solve. I will ask the team members to step into my office one by one.", "B": "This is a self-managing team, and it should continue to manage itself even in the face of problems. I will convene the entire team, address the problem and tell them to solve it amongst them.", "C": "This is a self-managing team, and it should continue to manage itself even in the face of problems. I will select one of the team members to discuss the problem, and ask him to find a solution within the team.", "D": "I will take charge immediately. I will call on an investigation bureau to investigate who is stealing the equipment."}, "nl": {"q": "In het ziekenhuis waar jij bestuurder bent, lijkt medisch materiaal zoek te raken. Dit gebeurt binnen een zelfsturend team. Soms gaat het om verband, maar ook om medicijnen en zelfs opiaten, zoals morfine. De vraag is wiens verantwoordelijkheid het is om de dader op te sporen. De betrokkene is mogelijk verslaafd of anderszins kwetsbaar. Hoe pak je deze situatie aan?", "o": {"A": "Ik neem meteen de leiding. Dit is een te ernstige zaak om het aan het team zelf over te laten. Ik vraag de teamleden om één voor één bij mij op kantoor te komen.", "B": "Dit is een zelfsturend team en dat moet zichzelf blijven sturen, ook als er problemen zijn. Ik roep het hele team bijeen, leg het probleem op tafel en draag het team op het onderling op te lossen.", "C": "Dit is een zelfsturend team en dat moet zichzelf blijven sturen, ook als er problemen zijn. Ik kies een van de teamleden uit om het probleem te bespreken en vraag hem een oplossing binnen het team te vinden.", "D": "Ik neem meteen de leiding. Ik schakel een recherchebureau in om uit te zoeken wie het materiaal steelt."}}, "f": {"A": "integriteit", "B": "samenwerking", "C": "samenwerking", "D": "integriteit"}}, {"n": 35, "q": "You are head of a hospital department. You have several self-managing teams working in this department, and they generally function very well. One of the teams has decided to stop wearing uniforms and wear their own clothes instead. The reason for this decision is that it allows the team members to have a more informal contact with the patients. You notice that this more informal contact is, indeed, established and that it works out beneficially for the patient experience. And yet, there are some disadvantages attached as well. The level of hygiene may be jeopardized, for instance, and the department itself becomes less uniform in appearance. Will you allow them to wear their own clothes?", "o": {"A": "I will allow it. Self-managing is self-managing, and it leaves no room for thwarting the choices the team makes.", "B": "I will allow it. I do think that it will be pleasant for the patients, and in the end, the patient experience is what matters most.", "C": "I will allow it for now, but I will subsequently develop a framework to delineate the margins of freedom for the self-managing teams.", "D": "I will not allow it. It is unsanitary. You never know where the employees have been and what they have done wearing those clothes."}, "nl": {"q": "Je bent afdelingshoofd in een ziekenhuis. Op jouw afdeling werken verschillende zelfsturende teams, die over het algemeen heel goed functioneren. Een van de teams heeft besloten geen uniform meer te dragen, maar eigen kleding. De reden is dat de teamleden zo informeler contact met de patiënten kunnen hebben. Je merkt dat dit informelere contact er inderdaad komt en dat het gunstig uitpakt voor de patiëntbeleving. Toch zijn er ook nadelen. Zo kan het hygiënepeil in gevaar komen en ziet de afdeling er minder uniform uit. Sta je toe dat zij hun eigen kleding dragen?", "o": {"A": "Ik sta het toe. Zelfsturing is zelfsturing en laat geen ruimte om de keuzes van het team te dwarsbomen.", "B": "Ik sta het toe. Ik denk dat het prettig is voor de patiënten en uiteindelijk gaat het vooral om de patiëntbeleving.", "C": "Ik sta het voorlopig toe, maar ik ontwikkel daarna een kader waarin de vrijheidsmarges van de zelfsturende teams worden afgebakend.", "D": "Ik sta het niet toe. Het is onhygiënisch. Je weet nooit waar de medewerkers zijn geweest en wat ze in die kleding hebben gedaan."}}, "f": {"A": "personeel", "B": "patient", "C": "organisatie", "D": "patient"}}, {"n": 36, "q": "You are in charge of a residential group in a nursing home for elderly people. Several highly motivated volunteers work within this residential group. They offer a lot of help doing chores such as cleaning and tidying. There is a lot of work to do, the rate of sickness absenteeism is high, and hiring new employees is too expensive. None of the volunteers are qualified nurses, but one of them likes to help out a little extra to relieve the pressure on the professionals. This involves bathing, dressing and feeding. These are no difficult tasks, but the official rule is that only qualified professionals are allowed to carry them out. Will you allow this volunteer to help out?", "o": {"A": "No, I will not allow it. If the inspection finds out that this happens in our nursing home, our reputation will be shot to ribbons.", "B": "No, I will not allow it. Our responsibility as a nursing home is to offer our patients the best possible care, and that includes that they should be cared for by professionals.", "C": "I will allow it. Any help is welcome. Furthermore, it is better if a volunteer helps the elderly to take a shower, get dressed and eat their meals than if they have to wait for a long time or even go without this help.", "D": "I will allow it, provided that the professionals supervise the volunteer to verify that the tasks are carried out properly."}, "nl": {"q": "Je bent leidinggevende van een woongroep in een verpleeghuis voor ouderen. In deze woongroep werken verschillende zeer gemotiveerde vrijwilligers. Zij helpen veel met klusjes als schoonmaken en opruimen. Er is veel werk, het ziekteverzuim is hoog en nieuwe medewerkers aannemen is te duur. Geen van de vrijwilligers is een gediplomeerd verpleegkundige, maar een van hen helpt graag wat extra om de professionals te ontlasten. Het gaat dan om wassen, aankleden en eten geven. Dit zijn geen moeilijke taken, maar de officiële regel is dat alleen gekwalificeerde professionals ze mogen uitvoeren. Sta je deze vrijwilliger toe mee te helpen?", "o": {"A": "Nee, dat sta ik niet toe. Als de inspectie erachter komt dat dit in ons verpleeghuis gebeurt, is onze reputatie finaal naar de knoppen.", "B": "Nee, dat sta ik niet toe. Onze verantwoordelijkheid als verpleeghuis is onze bewoners de best mogelijke zorg te bieden, en daar hoort bij dat zij door professionals worden verzorgd.", "C": "Ik sta het toe. Elke hulp is welkom. Bovendien is het beter dat een vrijwilliger ouderen helpt met douchen, aankleden en eten dan dat zij lang moeten wachten of die hulp zelfs moeten missen.", "D": "Ik sta het toe, op voorwaarde dat de professionals toezicht houden op de vrijwilliger en nagaan of de taken goed worden uitgevoerd."}}, "f": {"A": "reputatie", "B": "patient", "C": "organisatie", "D": "patient"}}, {"n": 37, "q": "In your facility for mentally challenged young people, you notice that one of the volunteers is not performing adequately. The food she cooks is unhealthy, and she can be quite snappy with the patients. You do need this volunteer, though. Without her, the rest of the staff would be under even more pressure. What will you do?", "o": {"A": "I will let it pass. It does not bother the patients all that much, and we do really need this volunteer.", "B": "I will confront the volunteer and tell her in no uncertain terms that this behaviour is not acceptable. Subsequently, I will ensure that her work is monitored more frequently. This does mean, of course, that we will run the risk that she will resign.", "C": "I will tell the volunteer that her help is no longer wanted. The resulting gap will temporarily have to be filled by the employees.", "D": "I will ask the volunteer's colleagues to point out to her that she is not performing adequately, and to coach her into doing a better job."}, "nl": {"q": "In jouw voorziening voor jongeren met een verstandelijke beperking zie je dat een van de vrijwilligers niet goed functioneert. Het eten dat zij kookt is ongezond en ze kan nogal kortaf zijn tegen de cliënten. Toch heb je deze vrijwilliger nodig. Zonder haar komt de rest van het personeel nog meer onder druk te staan. Wat doe je?", "o": {"A": "Ik laat het passeren. De cliënten hebben er niet zoveel last van en we hebben deze vrijwilliger echt nodig.", "B": "Ik spreek de vrijwilliger aan en maak haar ondubbelzinnig duidelijk dat dit gedrag niet acceptabel is. Vervolgens zorg ik dat haar werk vaker wordt gecontroleerd. Dit betekent uiteraard dat we het risico lopen dat zij opstapt.", "C": "Ik laat de vrijwilliger weten dat we haar hulp niet langer wensen. Het gat dat zo ontstaat, moeten de medewerkers tijdelijk opvullen.", "D": "Ik vraag de collega's van de vrijwilliger haar erop te wijzen dat ze niet goed functioneert en haar te coachen om beter te presteren."}}, "f": {"A": "organisatie", "B": "integriteit", "C": "patient", "D": "samenwerking"}}, {"n": 38, "q": "In your nursing home, it is your deliberate strategy to engage the help of many volunteers and informal caregivers. They help to relieve the workload, they cost less, and volunteers are often happy to be able to give back to society. Some volunteers come into work so often that the professional employees almost see them as paid colleagues. Will you, as an employer, treat them accordingly? Will you offer them training opportunities, for instance, or will you take precautions to prevent burnout, and will you prepare a personal development plan with and for them?", "o": {"A": "No, their personal development, health, et cetera are not my responsibility.", "B": "No, it would be too expensive to offer them these facilities. I will, however, encourage them to take good care of themselves and I will motivate them to continue developing their skills.", "C": "Yes, I will offer them these facilities. Volunteers and informal caregivers are of vital importance to our organization. I will be happy to invest time and money in them.", "D": "Yes, I will offer them these facilities. I would not want to lose our volunteers and informal caregivers. The job satisfaction of the paid employees would suffer if they were to leave."}, "nl": {"q": "In jouw verpleeghuis is het een bewuste strategie om veel vrijwilligers en mantelzorgers in te schakelen. Zij verlichten de werkdruk, kosten minder, en vrijwilligers vinden het vaak fijn iets terug te kunnen doen voor de maatschappij. Sommige vrijwilligers komen zo vaak werken dat de professionele medewerkers hen bijna als betaalde collega's zien. Behandel je hen als werkgever ook zo? Bied je hun bijvoorbeeld opleidingsmogelijkheden, neem je maatregelen om burn-out te voorkomen en stel je samen met hen en voor hen een persoonlijk ontwikkelplan op?", "o": {"A": "Nee, hun persoonlijke ontwikkeling, gezondheid enzovoort zijn niet mijn verantwoordelijkheid.", "B": "Nee, het zou te duur zijn om hun deze voorzieningen te bieden. Wel moedig ik hen aan goed voor zichzelf te zorgen en motiveer ik hen om hun vaardigheden te blijven ontwikkelen.", "C": "Ja, ik bied hun deze voorzieningen. Vrijwilligers en mantelzorgers zijn van vitaal belang voor onze organisatie. Ik investeer graag tijd en geld in hen.", "D": "Ja, ik bied hun deze voorzieningen. Ik wil onze vrijwilligers en mantelzorgers niet kwijtraken. De arbeidstevredenheid van de betaalde medewerkers zou eronder lijden als zij vertrokken."}}, "f": {"A": "organisatie", "B": "organisatie", "C": "personeel", "D": "personeel"}}, {"n": 39, "q": "The institution where you serve as manager offers home-away-from-home services. A home-like setting can add greatly to the comfort of residents (and to the peace of mind of their caregivers and relatives). They indicate that they want to bring their own furniture and decorations, clean their own apartment, invite overnight guests, care for their pets, et cetera. If you allow them to do so, this will enhance the residents’ experience, and it is likely to improve both the reputation of the institution and the atmosphere. On the other hand, allowing them this freedom may also detract from the peaceful, orderly setting in your institution, its level of hygiene, and it may lead to conflicts among residents. What will you do?", "o": {"A": "I will allow them this freedom. This will enhance the reputation and atmosphere within our institution, which will eventually improve our operations.", "B": "I will allow them this freedom. It will enable our institution to economize on cleaning and save on furniture, for instance. The money we save can be spent doing other things.", "C": "I will not allow them this freedom. It would disrupt our peaceful setting and lead to disparity among residents, when those are exactly the qualities that are so important to the people who come to live with us.", "D": "I will not allow them this freedom. We would risk deterioration in hygienic conditions. As an institution, we need to be on top of this at all times."}, "nl": {"q": "De instelling waar jij manager bent, biedt woonservices die aanvoelen als thuis. Een huiselijke omgeving kan sterk bijdragen aan het comfort van bewoners (en aan de gemoedsrust van hun verzorgers en familieleden). Zij geven aan dat ze hun eigen meubels en aankleding willen meenemen, hun eigen appartement willen schoonmaken, logés willen uitnodigen, voor hun huisdieren willen zorgen, enzovoort. Als je dit toestaat, verbetert dat de beleving van de bewoners en waarschijnlijk ook de reputatie van de instelling en de sfeer. Aan de andere kant kan deze vrijheid ook afbreuk doen aan de rust en orde in jouw instelling en aan het hygiënepeil, en kan het tot conflicten tussen bewoners leiden. Wat doe je?", "o": {"A": "Ik sta hun deze vrijheid toe. Dit verbetert de reputatie en de sfeer binnen onze instelling, wat uiteindelijk onze bedrijfsvoering ten goede komt.", "B": "Ik sta hun deze vrijheid toe. Zo kan onze instelling bijvoorbeeld bezuinigen op schoonmaak en besparen op meubilair. Het bespaarde geld kunnen we aan andere zaken besteden.", "C": "Ik sta hun deze vrijheid niet toe. Het zou onze rustige omgeving verstoren en tot ongelijkheid tussen bewoners leiden, terwijl dat nu juist de kwaliteiten zijn die zo belangrijk zijn voor de mensen die bij ons komen wonen.", "D": "Ik sta hun deze vrijheid niet toe. We zouden het risico lopen dat de hygiënische omstandigheden verslechteren. Als instelling moeten we hier te allen tijde bovenop zitten."}}, "f": {"A": "reputatie", "B": "organisatie", "C": "patient", "D": "integriteit"}}, {"n": 40, "q": "A private investor expresses the intention to invest in your hospital. This investment is important for you to be able to offer one of your services at a lower rate, so that you can increase your revenue. This investor, however, also invests in the tobacco industry. Signing a contract with this particular investor could, conceivably, damage your reputation. Will you sign the contract?", "o": {"A": "No, I will thank the investor for his offer, but my hospital would suffer undue harm to its reputation if we were to sign a deal with this investor.", "B": "No, I will decline the offer on moral grounds. As a hospital director, I want to have nothing to do with a party who invests in such unhealthy products.", "C": "Yes, I will sign the deal with this investor. The funds will go a long way towards optimizing our care, which, after all, is our main priority.", "D": "Yes, I will sign the deal with this investor. The fact that he has invested part of his capital in unrelated products has nothing to do with his investment in my hospital."}, "nl": {"q": "Een particuliere investeerder geeft aan te willen investeren in jouw ziekenhuis. Deze investering is belangrijk om een van je diensten tegen een lager tarief te kunnen aanbieden, zodat je je omzet kunt verhogen. Deze investeerder investeert echter ook in de tabaksindustrie. Een contract met juist deze investeerder zou je reputatie kunnen schaden. Teken je het contract?", "o": {"A": "Nee, ik bedank de investeerder voor zijn aanbod, maar mijn ziekenhuis zou onevenredig veel reputatieschade lijden als we een deal met deze investeerder sluiten.", "B": "Nee, ik wijs het aanbod af op morele gronden. Als ziekenhuisbestuurder wil ik niets te maken hebben met een partij die investeert in zulke ongezonde producten.", "C": "Ja, ik sluit de deal met deze investeerder. Het geld draagt in grote mate bij aan het optimaliseren van onze zorg, die tenslotte onze hoofdprioriteit is.", "D": "Ja, ik sluit de deal met deze investeerder. Het feit dat hij een deel van zijn kapitaal in andere producten heeft belegd, heeft niets te maken met zijn investering in mijn ziekenhuis."}}, "f": {"A": "reputatie", "B": "integriteit", "C": "patient", "D": "organisatie"}}, {"n": 41, "q": "You serve as the director of a chain of care homes. One of these care homes is located in the Randstad. This particular home is performing very well. With a view to population ageing, the managers approach you asking whether it would be possible to build an additional home. There is no cause for alarm at this point in time, but expectations are that in five years’ time, the care home will be filled to capacity and will not be able to admit any new residents. This is a particularly tough choice to make, if for no other reason than that it involves a long-term decision. On the other hand, you want your chain to be future-resilient. What would be your decision? Would you decide to build a new home or not?", "o": {"A": "We will have to build a new care home. It is always difficult to make predictions, but current knowledge provides us with enough grounds to start building a new home.", "B": "We will have to build a new care home. If we do not, we would be sending a message to the outside world that our chain is not keeping up with the times, when, on the contrary, we want to communicate that we think ahead and that even today, we are already keeping in mind the best interests of our future elderly residents.", "C": "We will not build a new care home. So many things can change in five years’ time. The policy focus is on helping seniors to stay at home longer. At this point in time, it is too risky.", "D": "We will build a new care home, but we will ask the municipality to share the risk with us. They will, of course, demand joint control in return, at the expense of our autonomy as a private institution. However, it is only on this condition that we are prepared to accept the risk."}, "nl": {"q": "Je bent directeur van een keten van verzorgingshuizen. Een van die huizen staat in de Randstad en functioneert heel goed. Met het oog op de vergrijzing vragen de managers jou of er een extra huis gebouwd kan worden. Op dit moment is er geen reden tot paniek, maar de verwachting is dat het verzorgingshuis over vijf jaar vol zit en geen nieuwe bewoners meer kan opnemen. Dit is een bijzonder lastige keuze, al was het maar omdat het een beslissing voor de lange termijn is. Aan de andere kant wil je dat jouw keten toekomstbestendig is. Wat is jouw besluit? Ga je een nieuw huis bouwen of niet?", "o": {"A": "Wij gaan een nieuw verzorgingshuis bouwen. Voorspellen is altijd lastig, maar de huidige kennis geeft ons voldoende grond om met de bouw van een nieuw huis te beginnen.", "B": "Wij gaan een nieuw verzorgingshuis bouwen. Doen we dat niet, dan geven we de buitenwereld het signaal dat onze keten niet met de tijd meegaat, terwijl we juist willen uitstralen dat wij vooruitdenken en nu al het belang van onze toekomstige oudere bewoners voor ogen hebben.", "C": "Wij gaan geen nieuw verzorgingshuis bouwen. Er kan in vijf jaar tijd zoveel veranderen. Het beleid richt zich op ouderen die langer thuis blijven wonen. Op dit moment is het te risicovol.", "D": "Wij gaan een nieuw verzorgingshuis bouwen, maar we vragen de gemeente het risico met ons te delen. Zij zal daar uiteraard medezeggenschap voor terugvragen, ten koste van onze autonomie als particuliere instelling. Alleen onder die voorwaarde zijn wij echter bereid het risico te nemen."}}, "f": {"A": "organisatie", "B": "reputatie", "C": "organisatie", "D": "samenwerking"}}, {"n": 42, "q": "Systems and protocols regulate the health care landscape in the Netherlands. They are important to ensure that our health care is properly regulated. Nevertheless, systems and standards may adversely affect our health care. For example, care providers may become obsessed with performance figures, to the point where patient satisfaction is almost completely ignored. Imagine that you are the director of a nursing home. To what extent will you focus on the execution of protocols and guidelines?", "o": {"A": "The well-being of the patients is my top priority. I will, therefore, focus on my patients’ happiness and joy in life, even if that means bypassing protocols sometimes.", "B": "The experience of the patients is extremely important, but proper care depends on proper regulation. I would take the matter up with the staff to find out which protocols they feel are necessary. Apart from this, the patients’ well- being must be the guiding principle.", "C": "The experience of the patients is important, but proper performance of the organization and assurance of the quality of care are more important to me. These aspects simply require a lot of rules and protocols, and I will not breach them.", "D": "I feel that it is important to adhere to guidelines and protocols. They are there for a reason. Failure to adhere to them may land us in trouble with the inspection. That is a situation I want to avoid."}, "nl": {"q": "Systemen en protocollen reguleren het Nederlandse zorglandschap. Ze zijn belangrijk om ervoor te zorgen dat onze zorg goed geregeld is. Toch kunnen systemen en normen de zorg ook schaden. Zo kunnen zorgverleners geobsedeerd raken door prestatiecijfers, tot het punt waarop de tevredenheid van patiënten bijna volledig uit het oog wordt verloren. Stel dat je directeur van een verpleeghuis bent. In hoeverre zet je in op het uitvoeren van protocollen en richtlijnen?", "o": {"A": "Het welzijn van de patiënten staat voor mij voorop. Ik richt mij daarom op het geluk en de levensvreugde van mijn patiënten, ook als dat betekent dat protocollen soms terzijde worden geschoven.", "B": "De beleving van de patiënten is buitengewoon belangrijk, maar goede zorg vraagt om goede regels. Ik zou het gesprek met de medewerkers aangaan om te horen welke protocollen zij nodig vinden. Daarnaast moet het welzijn van de patiënten het leidende principe zijn.", "C": "De beleving van de patiënten is belangrijk, maar het goed functioneren van de organisatie en de borging van de kwaliteit van zorg vind ik belangrijker. Daar zijn nu eenmaal veel regels en protocollen voor nodig, en die overtreed ik niet.", "D": "Ik vind het belangrijk dat richtlijnen en protocollen worden nageleefd. Ze zijn er niet voor niets. Als we ze niet naleven, kunnen we problemen krijgen met de inspectie. Die situatie wil ik voorkomen."}}, "f": {"A": "patient", "B": "samenwerking", "C": "organisatie", "D": "integriteit"}}, {"n": 43, "q": "Only a few hospitals are left in the province of Zeeland, the majority of which provide emergency care only. It is no longer efficient nor cost-effective to offer all specialities. Patients will simply have to travel to Rotterdam, for instance. The plan now is to limit hospital care in Zeeland to emergency care only, and to move all other specialities to Rotterdam. The prospect is daunting to the people living in Zeeland. They will have to travel a lot further to get medical help – sometimes even in life-threatening situations. Furthermore, the plan involves longer-distance commuting for the hospital staff from Zeeland once everything is relocated to Rotterdam. However, from a financial and knowledge sharing perspective, for instance, relocation is a sound idea. You work for a health insurance company. What would you recommend?", "o": {"A": "I would argue in favour of relocation to Rotterdam. At a certain point, this is bound to happen anyway, the hospitals in Zeeland cannot possibly continue to offer all of the care indefinitely.", "B": "I would argue in favour of relocation to Rotterdam. If we want to improve health care in our region, all medical professionals will have to work together.", "C": "I would argue against relocation to Rotterdam. A patient from Zeeland in need of urgent, specialized care should not be redirected to Rotterdam. They might die.", "D": "I would argue against relocation to Rotterdam. For a good patient experience, it is essential to ensure continuity of the hospitals in Zeeland."}, "nl": {"q": "In de provincie Zeeland zijn nog maar enkele ziekenhuizen over, waarvan de meeste alleen spoedeisende zorg bieden. Het is niet meer efficiënt en kosteneffectief om alle specialismen aan te bieden. Patiënten moeten bijvoorbeeld maar naar Rotterdam reizen. Het plan is nu om de ziekenhuiszorg in Zeeland te beperken tot spoedeisende zorg en alle andere specialismen naar Rotterdam te verplaatsen. Voor de inwoners van Zeeland is dat vooruitzicht beangstigend. Zij moeten veel verder reizen voor medische hulp, soms zelfs in levensbedreigende situaties. Bovendien betekent het plan dat het ziekenhuispersoneel uit Zeeland verder moet reizen naar het werk zodra alles naar Rotterdam is verhuisd. Vanuit financieel oogpunt en vanuit het oogpunt van kennisdeling is verhuizen echter een verstandig idee. Je werkt bij een zorgverzekeraar. Wat zou je adviseren?", "o": {"A": "Ik zou pleiten voor verhuizing naar Rotterdam. Op een bepaald moment gaat dit toch gebeuren; de ziekenhuizen in Zeeland kunnen onmogelijk voor onbepaalde tijd alle zorg blijven aanbieden.", "B": "Ik zou pleiten voor verhuizing naar Rotterdam. Als we de zorg in onze regio willen verbeteren, zullen alle medische professionals moeten samenwerken.", "C": "Ik zou pleiten tegen verhuizing naar Rotterdam. Een patiënt uit Zeeland die dringend gespecialiseerde zorg nodig heeft, mag niet naar Rotterdam worden doorverwezen. Die patiënt kan overlijden.", "D": "Ik zou pleiten tegen verhuizing naar Rotterdam. Voor een goede patiëntbeleving is het essentieel dat de ziekenhuizen in Zeeland behouden blijven."}}, "f": {"A": "organisatie", "B": "samenwerking", "C": "patient", "D": "patient"}}, {"n": 44, "q": "You are on the management team of a nursing home. The HR manager wants the nursing home to transition to a new HR policy in order to distinguish itself in the marketplace. He wants to recruit capable staff and minimize staff turnover. The legal department and the line managers oppose all of these changes. What is your opinion on implementing the changes?", "o": {"A": "Employee resistance is always brief. In retrospect, they are usually happy with the changes. We will, therefore, switch to the new HR policy.", "B": "No matter how serious the resistance of the employees, we will switch to a new HR policy. It is simply necessary in order to ensure that the hospital operations remain healthy.", "C": "I will give consideration to the objections of the employees, and I will convene meetings to listen to their arguments. Even if it takes some time, we will duly consider their views in developing the new HR policy.", "D": "We will not implement any changes. HR policy should be beneficial to employees. If they protest, apparently the changes are not a good idea."}, "nl": {"q": "Je zit in het managementteam van een verpleeghuis. De HR-manager wil dat het verpleeghuis overstapt op een nieuw HR-beleid om zich op de markt te onderscheiden. Hij wil capabele medewerkers werven en het personeelsverloop minimaliseren. De juridische afdeling en de leidinggevenden zijn tegen al deze veranderingen. Wat vind je van het invoeren van de veranderingen?", "o": {"A": "Weerstand van medewerkers is altijd van korte duur. Achteraf zijn ze meestal blij met de veranderingen. Wij stappen daarom over op het nieuwe HR-beleid.", "B": "Hoe serieus de weerstand van de medewerkers ook is, wij stappen over op een nieuw HR-beleid. Het is simpelweg nodig om de bedrijfsvoering gezond te houden.", "C": "Ik neem de bezwaren van de medewerkers in overweging en ga bijeenkomsten beleggen om naar hun argumenten te luisteren. Ook als dat enige tijd kost, betrekken wij hun opvattingen zorgvuldig bij de ontwikkeling van het nieuwe HR-beleid.", "D": "Wij voeren geen enkele verandering door. HR-beleid moet ten goede komen aan de medewerkers. Als zij protesteren, is de verandering blijkbaar geen goed idee."}}, "f": {"A": "organisatie", "B": "organisatie", "C": "samenwerking", "D": "personeel"}}, {"n": 45, "q": "A new HR policy is implemented in a hospital for the purpose of enhancing the well-being of the staff. The new policy mainly motivates employees to continue developing their talents and skills. For this purpose, they are required to rotate to a new department every four years. As a consultant, you have been asked to provide advice on this development. Do you think that it will, indeed, enhance the employees’ well-being?", "o": {"A": "Yes, I do think that it may enhance the well-being of some employees, but only if they themselves are ambitious and welcome change. I will recommend that they should have a choice in the matter.", "B": "Yes, this will enhance the well-being of all employees.", "C": "No, on the contrary, long-term commitment to a single department is what will enhance the well-being of employees.", "D": "No, I would not recommend mandatory rotation. All employees should be allowed to make their own choice."}, "nl": {"q": "In een ziekenhuis wordt een nieuw HR-beleid ingevoerd om het welzijn van het personeel te vergroten. Het nieuwe beleid motiveert medewerkers vooral om hun talenten en vaardigheden te blijven ontwikkelen. Daarvoor moeten zij elke vier jaar naar een andere afdeling roteren. Als adviseur is je gevraagd advies te geven over deze ontwikkeling. Denk je dat het het welzijn van de medewerkers inderdaad zal vergroten?", "o": {"A": "Ja, ik denk dat het het welzijn van sommige medewerkers kan vergroten, maar alleen als zij zelf ambitieus zijn en openstaan voor verandering. Ik zal aanbevelen dat zij hierin een keuze hebben.", "B": "Ja, dit zal het welzijn van alle medewerkers vergroten.", "C": "Nee, integendeel: langdurige verbondenheid met één afdeling vergroot juist het welzijn van de medewerkers.", "D": "Nee, ik zou verplichte rotatie niet aanbevelen. Alle medewerkers moeten zelf kunnen kiezen."}}, "f": {"A": "personeel", "B": "personeel", "C": "personeel", "D": "personeel"}}, {"n": 46, "q": "Your organization offers care for the disabled. The organization is performing at an excellent level, but is known for its incoherence. Several units work independently, but they collaborate insufficiently. Scientific studies show that teamwork leads to successful achievements. In response, you create new teams that rotate frequently and work closely together. After six months, the team leaders tell you that the new approach is not panning out for them; they are not happy with it. Will you decide to switch back to the old way of working?", "o": {"A": "No, this new approach deserves a longer trial period. Six months is not enough to assess whether the new approach is successful or not.", "B": "No, it would take too much time and resources to switch back. We will continue as planned. Employees who are unhappy with this method of working are likely to resign of their own accord.", "C": "I will ask the team leaders what it is exactly that they dislike about the new method of working. Wherever necessary and possible, I will implement adjustments.", "D": "I will switch back to the old way of working. If the teams are not functioning properly, the entire organization will not function properly, and this is bound to go from bad to worse."}, "nl": {"q": "Jouw organisatie biedt zorg aan mensen met een beperking. De organisatie presteert uitstekend, maar staat bekend om haar gebrek aan samenhang. Diverse eenheden werken zelfstandig, maar werken onvoldoende samen. Wetenschappelijk onderzoek toont aan dat teamwork tot succesvolle resultaten leidt. Naar aanleiding daarvan vorm je nieuwe teams die regelmatig roteren en nauw samenwerken. Na zes maanden laten de teamleiders je weten dat de nieuwe aanpak voor hen niet werkt; ze zijn er niet blij mee. Besluit je terug te keren naar de oude werkwijze?", "o": {"A": "Nee, deze nieuwe aanpak verdient een langere proefperiode. Zes maanden is te kort om te beoordelen of de nieuwe aanpak succesvol is.", "B": "Nee, terugkeren kost te veel tijd en middelen. Wij gaan door zoals gepland. Medewerkers die ongelukkig zijn met deze werkwijze nemen waarschijnlijk uit zichzelf ontslag.", "C": "Ik vraag de teamleiders wat ze precies niet bevalt aan de nieuwe werkwijze. Waar nodig en mogelijk voer ik aanpassingen door.", "D": "Ik keer terug naar de oude werkwijze. Als de teams niet goed functioneren, functioneert de hele organisatie niet goed, en dat wordt alleen maar erger."}}, "f": {"A": "organisatie", "B": "organisatie", "C": "samenwerking", "D": "organisatie"}}, {"n": 47, "q": "You are the manager of an emergency department. In order to improve security in this department, you have developed a new checklist together with your colleagues. A number of employees have embraced the list with enthusiasm, but others question its effectiveness. Some critics complain about the large number of procedures, the top-down method of implementation, as well as a number of other aspects. Will you choose to continue working with the new checklist despite the criticism?", "o": {"A": "We will continue to use the new checklist. It has taken me a lot of time to develop and it is well-thought-out.", "B": "We will continue to use the checklist, but will adjust it to some extent where possible and necessary. I want to be known as a manager who listens to the voices and opinions of the staff.", "C": "I will explain that the checklist serves as a guideline. If practice requires the staff to deviate from this list, I trust them to do so in a responsible manner.", "D": "Checklists are there to improve the quality of the work. If they fail to succeed in doing so, that in itself is reason enough to discontinue their use. We will stop using this checklist."}, "nl": {"q": "Je bent manager van een spoedeisende hulp (SEH). Om de veiligheid op deze afdeling te verbeteren heb je samen met je collega's een nieuwe checklist ontwikkeld. Een aantal medewerkers heeft de lijst enthousiast omarmd, maar anderen trekken de effectiviteit ervan in twijfel. Sommige critici klagen over het grote aantal procedures, de top-downaanpak van de invoering en een aantal andere aspecten. Kies je ervoor om ondanks de kritiek met de nieuwe checklist door te werken?", "o": {"A": "Wij blijven de nieuwe checklist gebruiken. Het heeft mij veel tijd gekost om hem te ontwikkelen en hij is goed doordacht.", "B": "Wij blijven de checklist gebruiken, maar passen hem in enige mate aan waar mogelijk en nodig. Ik wil bekendstaan als een manager die luistert naar de stem en de mening van het personeel.", "C": "Ik leg uit dat de checklist een richtlijn is. Als de praktijk vraagt dat medewerkers van deze lijst afwijken, vertrouw ik erop dat zij dat op een verantwoorde manier doen.", "D": "Checklists zijn er om de kwaliteit van het werk te verbeteren. Als dat niet lukt, is dat op zichzelf reden genoeg om ze niet meer te gebruiken. Wij stoppen met deze checklist."}}, "f": {"A": "organisatie", "B": "reputatie", "C": "personeel", "D": "organisatie"}}, {"n": 48, "q": "You are the head of a hospital department. Your supervisor has given you instructions to increase productivity by ten per cent. Although this is possible, it will require your full commitment. To be able to do this, you will have to delegate one of your duties to one of your staff. You have already found a suitable candidate, but this person is very insecure about his abilities. You are absolutely convinced that he will be able to carry out the task, but he is apprehensive about doing it alone and asks for your support. As all of your time is consumed by the assignment of your supervisor, you do not have the time for this. What will you do?", "o": {"A": "I will have a serious discussion with him, trying to persuade him to assume the full task himself.", "B": "Despite his insecurities, I will delegate the task to him. I will ask him to contribute ideas about the best way to carry it out, leaving plenty of room for his needs.", "C": "I will delegate the task to him, providing an extensive description of the subtasks, an updated to-do list, and a planning until the time I will be able to reassume it. All he will have to do is follow the task list.", "D": "I have no time to support him and will look for a candidate who is less insecure and does have the courage to assume this task."}, "nl": {"q": "Je bent afdelingshoofd in een ziekenhuis. Je leidinggevende heeft je opdracht gegeven de productiviteit met tien procent te verhogen. Dat is mogelijk, maar vraagt je volledige inzet. Om dit te kunnen doen, moet je een van je taken delegeren aan een van je medewerkers. Je hebt al een geschikte kandidaat gevonden, maar die is erg onzeker over zijn kunnen. Je bent er absoluut van overtuigd dat hij de taak aankan, maar hij durft het niet alleen te doen en vraagt om jouw steun. Omdat je volledig in beslag wordt genomen door de opdracht van je leidinggevende, heb je daar de tijd niet voor. Wat doe je?", "o": {"A": "Ik voer een serieus gesprek met hem en probeer hem te overtuigen de hele taak zelf op zich te nemen.", "B": "Ondanks zijn onzekerheid delegeer ik de taak aan hem. Ik vraag hem ideeën aan te dragen over de beste manier om de taak uit te voeren en laat daarbij ruim baan aan wat hij nodig heeft.", "C": "Ik delegeer de taak aan hem en geef een uitgebreide beschrijving van de deeltaken, een bijgewerkte takenlijst en een planning tot het moment waarop ik de taak weer kan overnemen. Hij hoeft alleen de takenlijst te volgen.", "D": "Ik heb geen tijd om hem te ondersteunen en zoek een kandidaat die minder onzeker is en wel de moed heeft deze taak op zich te nemen."}}, "f": {"A": "personeel", "B": "personeel", "C": "organisatie", "D": "organisatie"}}, {"n": 49, "q": "You are a team leader in a care home. In the past, you have had a lot of disagreement with someone from your team. She is a slow worker and needs constant reminders and encouragement to do her work properly and efficiently. Without your encouragement, she has dropped the ball on a number of occasions. In the past few weeks, she has suddenly started to work fast and efficiently, even without any encouragement on your part. You feel that this might be the right time to give her a little more freedom, but on the other hand, you fear that she might relapse into old habits. How will you deal with her?", "o": {"A": "I will continue to monitor her closely. Chances are that she will relapse at some point in time, and I want to avoid this.", "B": "I will continue to monitor her, but I will also try to show her that I appreciate her ‘new and improved’ work ethics. I will mainly do this by inviting her to contribute ideas about important issues and decisions.", "C": "I will give her back the same freedom and responsibilities I give to her colleagues. She has proven herself to be capable of doing a good job.", "D": "I will give her back the freedom and responsibilities she had before, and a little extra to reward her. This will encourage her to keep up the good work."}, "nl": {"q": "Je bent teamleider in een verzorgingshuis. In het verleden heb je veel onenigheid gehad met iemand uit je team. Zij werkt langzaam en heeft voortdurend herinneringen en aanmoediging nodig om haar werk goed en efficiënt te doen. Zonder jouw aanmoediging heeft zij meerdere keren steken laten vallen. De afgelopen weken is zij ineens snel en efficiënt gaan werken, zelfs zonder enige aanmoediging van jouw kant. Je vindt dat het nu misschien het juiste moment is om haar wat meer vrijheid te geven, maar aan de andere kant vrees je dat zij terugvalt in oude gewoonten. Hoe ga je met haar om?", "o": {"A": "Ik blijf haar nauwlettend in de gaten houden. De kans bestaat dat zij op een gegeven moment terugvalt, en dat wil ik voorkomen.", "B": "Ik blijf haar in de gaten houden, maar probeer haar ook te laten merken dat ik haar 'nieuwe en verbeterde' werkhouding waardeer. Dat doe ik vooral door haar uit te nodigen ideeën aan te dragen over belangrijke zaken en beslissingen.", "C": "Ik geef haar dezelfde vrijheid en verantwoordelijkheden als haar collega's. Zij heeft bewezen dat ze goed werk kan leveren.", "D": "Ik geef haar de vrijheid en verantwoordelijkheden terug die zij eerder had, met als beloning een beetje extra. Dat moedigt haar aan om het goede werk voort te zetten."}}, "f": {"A": "organisatie", "B": "samenwerking", "C": "personeel", "D": "personeel"}}, {"n": 50, "q": "In the family-type care home where you serve as manager, the care teams work highly independently. They usually function very well, and the knowledge and skills of the staff are up to date. You ensure that the work is properly distributed, and you provide them with advice, tips, and encouragement whenever necessary. However, over the past few weeks, their job performance has gone down considerably. The teams barely manage or even fail to reach the daily norms, and the quality of the work has plummeted. You do not want to convey a lack of trust in the teams, but they give you no choice but to take action. What will you do?", "o": {"A": "I will bring the results to the attention of the care teams. This will make it very clear to them that they are failing to reach the daily norms, and that the quality of the work is substandard. Subsequently, I will give them the instruction to improve their performance themselves.", "B": "Together with the care teams, I will consider ways in which we can improve their performance. Subsequently, I will place the responsibility for implementation on the teams.", "C": "I will hold the care teams accountable and tell them to improve their performance without delay. In addition, I will tell them that I will monitor them more closely.", "D": "In each care team, I will appoint two designated individuals to encourage the rest of the team to improve the quality of their work."}, "nl": {"q": "In het kleinschalige woonzorgcentrum waar jij manager bent, werken de zorgteams heel zelfstandig. Meestal functioneren ze goed en is de kennis en vaardigheid van de medewerkers up-to-date. Je zorgt ervoor dat het werk goed verdeeld is en je geeft hun waar nodig advies, tips en aanmoediging. De afgelopen weken zijn hun prestaties echter aanzienlijk gedaald. De teams halen de dagnormen ternauwernood of zelfs niet, en de kwaliteit van het werk is sterk gedaald. Je wilt geen gebrek aan vertrouwen in de teams uitstralen, maar ze laten je geen keus: je moet ingrijpen. Wat doe je?", "o": {"A": "Ik breng de resultaten onder de aandacht van de zorgteams. Zo wordt hun duidelijk dat ze de dagnormen niet halen en dat de kwaliteit van het werk ondermaats is. Vervolgens geef ik hun de opdracht zelf hun prestaties te verbeteren.", "B": "Samen met de zorgteams bekijk ik hoe we hun prestaties kunnen verbeteren. Vervolgens leg ik de verantwoordelijkheid voor de uitvoering bij de teams.", "C": "Ik spreek de zorgteams aan op hun verantwoordelijkheid en zeg dat ze hun prestaties onmiddellijk moeten verbeteren. Bovendien zeg ik dat ik hen nauwlettender ga volgen.", "D": "In elk zorgteam wijs ik twee aanspreekpunten aan die de rest van het team stimuleren de kwaliteit van hun werk te verbeteren."}}, "f": {"A": "organisatie", "B": "samenwerking", "C": "organisatie", "D": "organisatie"}}];
const L = ['A','B','C','D'];
const KEY = 'dilemmaGame.v1';
let S = load() || fresh();
S.lang=S.lang||'nl';S.obs=S.obs||{};S.refl=S.refl||{};
let view = S.players.length >= 2 ? 'play' : 'setup';
let ui = {picker:null, revealIdx:0, timer:null, timerEnd:0};

function fresh(){return {players:[], roundsPerPlayer:2, holderIdx:0, current:null, history:[], lang:'nl', obs:{}, refl:{}}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(S))}catch(e){}}
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D = n => {const d=DILEMMAS[n-1];return (S.lang!=='en'&&d.nl)?{n:d.n,q:d.nl.q,o:d.nl.o,f:d.f}:d};
const holder = () => S.players[S.holderIdx % S.players.length];
const usedNums = () => [...S.history.map(h=>h.n), ...(S.current?[S.current.n]:[])];
const target = () => S.players.length * S.roundsPerPlayer;

function go(v){if(v!=='report')S.repView=0;view=v;render();window.scrollTo(0,0)}
document.getElementById('lang').addEventListener('click',e=>{const b=e.target.closest('button');if(b){S.lang=b.dataset.l;save();render()}});
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)});

function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===S.lang));
  ({setup:rSetup,play:rPlay,results:rResults,library:rLibrary,rules:rRules,report:rReport})[view]();
}

/* ---------- SETUP ---------- */
function rSetup(){
  const p = S.players.length ? S.players : ['','',''];
  $('#app').innerHTML = `
  <div class="card">
    <h1>Spelers</h1>
    <p class="muted">Een groep van 3 tot 5 spelers. De eerste speler is de eerste dilemmahouder; daarna schuift de rol door.</p>
    <div class="grid" id="plist">${p.map((n,i)=>pRow(n,i)).join('')}</div>
    <div class="row" style="margin-top:12px">
      <button class="btn sm" id="addP">+ Speler</button>
      <span class="muted small">Max. 5</span>
    </div>
  </div>
  <div class="card">
    <h2>Speleinde</h2>
    <div class="row"><label>Elke speler is
      <input type="number" id="rpp" min="1" max="5" value="${S.roundsPerPlayer}" style="width:70px;display:inline-block"> keer dilemmahouder</label></div>
    <p class="muted small">Advies uit de spelregels: twee keer per speler. Je mag eerder stoppen.</p>
  </div>
  <div class="row">
    <button class="btn primary" id="startBtn">Opslaan en spelen</button>
    ${S.history.length||S.current?'<button class="btn ghost" id="resetBtn">Nieuw spel (wist alles)</button>':''}
  </div>`;
  $('#addP').onclick=()=>{const l=$('#plist');if(l.children.length<5)l.insertAdjacentHTML('beforeend',pRow('',l.children.length))};
  $('#startBtn').onclick=()=>{
    const names=[...document.querySelectorAll('.pname')].map(i=>i.value.trim()).filter(Boolean);
    if(names.length<2){alertBox('Vul minstens twee namen in.');return}
    if(new Set(names).size!==names.length){alertBox('Gebruik unieke namen.');return}
    S.players=names; S.roundsPerPlayer=Math.max(1,Math.min(5,+$('#rpp').value||2));
    save(); go('play');
  };
  const r=$('#resetBtn'); if(r) r.onclick=()=>{ if(r.dataset.c){const l=S.lang;S=fresh();S.lang=l;save();render()} else {r.dataset.c=1;r.textContent='Klik nogmaals om te bevestigen'} };
}
function pRow(n,i){return `<input type="text" class="pname" placeholder="Naam speler ${i+1}" value="${esc(n)}">`}
function alertBox(m){let a=$('#msg');if(!a){$('#app').insertAdjacentHTML('afterbegin','<div class="privacy" id="msg" style="margin-bottom:14px"></div>');a=$('#msg')}a.textContent=m}

/* ---------- PLAY ---------- */
const STEPS=['Trekken','Kiezen','Onthullen','Discussie','Beoordeling'];const STEPNO=['1','2','3–4','5','6'];
function rPlay(){
  if(S.players.length<2){$('#app').innerHTML=`<div class="card"><h1>Nog geen spelers</h1><p class="muted">Voeg eerst spelers toe.</p><button class="btn primary" onclick="go('setup')">Naar spelers</button></div>`;return}
  const c=S.current, stepI=c?c.step:0;
  const doneN=S.history.length;
  let head=`<div class="row" style="justify-content:space-between;margin-bottom:8px">
     <div><span class="pill">Ronde ${doneN+1} van ${target()}</span> <span class="muted small">Dilemmahouder: <b>${esc(holder())}</b></span></div>
     <div class="players">${S.players.map((p,i)=>`<span class="pchip ${i===S.holderIdx%S.players.length?'holder':''}" style="cursor:default">${esc(p)} · ${S.history.filter(h=>h.holder===p).length}×</span>`).join('')}</div>
  </div>
  <div class="steps">${STEPS.map((s,i)=>`<div class="step ${i===stepI?'on':''} ${i<stepI?'done':''}"><b>Stap ${STEPNO[i]}</b>${s}</div>`).join('')}</div>`;
  if(doneN>=target() && !c){
    $('#app').innerHTML=head+`<div class="card"><h1>Spel compleet</h1><p class="muted">Iedereen is ${S.roundsPerPlayer}× dilemmahouder geweest.</p><div class="row"><button class="btn primary" onclick="go('results')">Bekijk resultaten</button><button class="btn" id="more">Toch nog een ronde</button></div></div>`;
    $('#more').onclick=()=>{S.roundsPerPlayer++;save();render()};return;
  }
  if(!c) return pDraw(head);
  [null,pChoose,pReveal,pDiscuss,pAssess][c.step](head);
}
function dilemmaCard(n,interactive){
  const d=D(n);
  return `<div class="card"><div class="row" style="justify-content:space-between"><span class="pill warn">Dilemma ${n}</span></div>
   <p class="dq" style="margin:12px 0 4px">${esc(d.q)}</p>
   ${L.map(k=>`<div class="opt"><div class="let l${k}">${k}</div><div>${esc(d.o[k])}</div></div>`).join('')}</div>`;
}
function pDraw(head){
  const free=DILEMMAS.map(d=>d.n).filter(n=>!usedNums().includes(n));
  $('#app').innerHTML=head+`<div class="card" style="text-align:center">
    <h1>${esc(holder())}, kies een dilemma</h1>
    <p class="muted">Trek een willekeurig nummer tussen 1 en 50 (al gespeelde dilemma's worden overgeslagen) of kies zelf een nummer.</p>
    <div class="big" id="rollNum">?</div>
    <div class="row" style="justify-content:center;margin-top:14px">
      <button class="btn primary" id="roll">🎲 Willekeurig trekken</button>
      <input type="number" id="manual" min="1" max="50" placeholder="1–50" style="width:90px">
      <button class="btn" id="pick">Kies dit nummer</button>
    </div>
    <p class="muted small" style="margin-top:14px">Nog ${free.length} ongespeelde dilemma's.</p>
  </div>`;
  $('#roll').onclick=()=>{
    const el=$('#rollNum');let t=0;$('#roll').disabled=true;
    const iv=setInterval(()=>{el.textContent=1+Math.floor(Math.random()*50);if(++t>14){clearInterval(iv);const n=free[Math.floor(Math.random()*free.length)];el.textContent=n;setTimeout(()=>start(n),500)}},60);
  };
  $('#pick').onclick=()=>{const n=+$('#manual').value;if(n>=1&&n<=50)start(n)};
}
function start(n){S.current={n,holder:holder(),step:1,choices:{},motiv:{},assess:{}};ui.revealIdx=0;ui.picker=null;save();render()}

function pChoose(head){
  const c=S.current, done=Object.keys(c.choices);
  const all=S.players.every(p=>c.choices[p]);
  let picker='';
  if(ui.picker){
    const p=ui.picker, sel=c.choices[p]||'';
    picker=`<div class="card" style="border-color:var(--accent)">
      <h2>${esc(p)}: jouw keuze (geheim)</h2>
      ${L.map(k=>`<button class="opt ${sel===k?'sel':''}" data-k="${k}"><div class="let l${k}">${k}</div><div>${esc(D(c.n).o[k])}</div></button>`).join('')}
      <label class="small muted" style="display:block;margin-top:12px">Kernwoorden van je motivatie (alleen voor jezelf, zichtbaar bij het onthullen)</label>
      <textarea id="mot">${esc(c.motiv[p]||'')}</textarea>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="saveC" ${sel?'':'disabled'}>Opslaan en verbergen</button></div>
    </div>`;
  }
  $('#app').innerHTML=head+dilemmaCard(c.n)+`
   <div class="card"><h2>Stap 2 · Iedereen kiest, zonder te overleggen</h2>
   <div class="privacy">Speel je op één scherm? Geef het apparaat door. Ieder tikt op zijn eigen naam, kiest en klikt op opslaan; de keuze verdwijnt dan uit beeld.</div>
   <div class="players" style="margin-top:14px">${S.players.map(p=>`<button class="pchip ${c.choices[p]?'done':''} ${p===c.holder?'holder':''}" data-p="${esc(p)}">${c.choices[p]?'✓ ':''}${esc(p)}</button>`).join('')}</div>
   </div>${picker}
   <div class="row"><button class="btn primary" id="next" ${all?'':'disabled'}>Iedereen heeft gekozen → onthullen</button>
   <button class="btn ghost" id="cancel">Dilemma annuleren</button></div>`;
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ui.picker=b.dataset.p;render()});
  document.querySelectorAll('button.opt').forEach(b=>b.onclick=()=>{c.choices[ui.picker]=b.dataset.k;c.motiv[ui.picker]=$('#mot').value;render()});
  const sc=$('#saveC'); if(sc) sc.onclick=()=>{c.motiv[ui.picker]=$('#mot').value;ui.picker=null;save();render()};
  $('#next').onclick=()=>{c.step=2;ui.revealIdx=0;save();render()};
  $('#cancel').onclick=()=>{S.current=null;save();render()};
}
function order(){const c=S.current;return [c.holder,...S.players.filter(p=>p!==c.holder)]}
function pReveal(head){
  const c=S.current, ord=order(); const shown=ord.slice(0,ui.revealIdx+1);
  $('#app').innerHTML=head+dilemmaCard(c.n)+`<div class="card">
   <h2>Stap 3 en 4 · Onthullen en motiveren</h2>
   <p class="muted small">De dilemmahouder begint en legt uit waarom hij of zij voor dit alternatief koos in plaats van voor de andere. Daarna volgen de anderen één voor één. Nog geen discussie.</p>
   ${shown.map((p,i)=>`<div class="reveal ${i===0?'h':''}"><div class="row"><div class="let l${c.choices[p]}">${c.choices[p]}</div><b>${esc(p)}</b>${i===0?'<span class="pill warn">dilemmahouder</span>':''}</div>
     ${c.motiv[p]?`<div class="small muted" style="margin-top:6px">${esc(c.motiv[p])}</div>`:''}</div>`).join('')}
   <div class="row" style="margin-top:14px">
   ${ui.revealIdx<ord.length-1?`<button class="btn primary" id="nx">Onthul ${esc(ord[ui.revealIdx+1])}</button>`:`<button class="btn primary" id="toD">Naar de discussie</button>`}
   </div>
   ${ui.revealIdx===ord.length-1?distBlock(c.choices):''}
  </div>`;
  const nx=$('#nx'); if(nx) nx.onclick=()=>{ui.revealIdx++;render()};
  const t=$('#toD'); if(t) t.onclick=()=>{c.step=3;save();render()};
}
function distBlock(ch){
  const v=Object.values(ch), cnt=L.map(k=>v.filter(x=>x===k).length);
  return `<div style="margin-top:16px"><h3>Verdeling</h3><div class="bar">${L.map((k,i)=>cnt[i]?`<div style="flex:${cnt[i]};background:var(--${k})" title="${k}: ${cnt[i]}"></div>`:'').join('')}</div>
   <div class="legend" style="margin-top:6px">${L.map((k,i)=>`<span><i style="background:var(--${k})"></i>${k}: ${cnt[i]}</span>`).join('')}</div></div>`;
}
function pDiscuss(head){
  const c=S.current;
  $('#app').innerHTML=head+dilemmaCard(c.n)+`<div class="card">
   <h2>Stap 5 · Discussie</h2>
   <p class="muted">Wat is in deze situatie het beste om te doen? Kun je de anderen overtuigen, of overtuigen zij jou? Ook als jullie hetzelfde antwoord kozen, kan de motivatie verschillen.</p>
   <div class="row"><div class="big" id="clock">10:00</div>
     <select id="mins" style="width:auto">${[5,8,10,15,20].map(m=>`<option ${m===10?'selected':''}>${m}</option>`).join('')}</select><span class="muted small">min</span>
     <button class="btn" id="tgo">Start timer</button></div>
   <label class="small muted" style="display:block;margin-top:14px">Notities van de discussie (gedeeld)</label>

/* ---------- RESULTS ---------- */
function rResults(){
  const H=S.history;
  const approvals=[];H.forEach(h=>Object.entries(h.assess).forEach(([p,a])=>{if(p!==h.holder&&a.approve)approvals.push(a.approve)}));
  const revised=[];H.forEach(h=>Object.entries(h.assess).forEach(([p,a])=>{if(a.final&&a.final!==h.choices[p])revised.push({p,h,a})}));
  const consensus=H.filter(h=>new Set(Object.values(h.assess).map(a=>a.final)).size===1).length;
  const avg=approvals.length?(approvals.reduce((s,v)=>s+v,0)/approvals.length).toFixed(1):'–';
  const per=S.players.map(p=>{
    const held=H.filter(h=>h.holder===p);
    const ap=[];held.forEach(h=>Object.entries(h.assess).forEach(([q,a])=>{if(q!==p&&a.approve)ap.push(a.approve)}));
    const conv=revised.filter(r=>r.a.by===p).length;
    const rev=revised.filter(r=>r.p===p).length;
    return {p,held:held.length,ap:ap.length?(ap.reduce((s,v)=>s+v,0)/ap.length).toFixed(1):'–',conv,rev};
  });
  $('#app').innerHTML=`<div class="card"><h1>Resultaten</h1><p class="muted">${H.length} van ${target()||'–'} dilemma's gespeeld.</p>
   <div class="grid g4" style="margin-top:12px">
    <div class="kpi"><div class="v">${H.length}</div><div class="l">Dilemma's gespeeld</div></div>

    <div class="kpi"><div class="v">${revised.length}</div><div class="l">Herziene keuzes</div></div>

   </div></div>

   ${per.map(r=>`<tr><td>${esc(r.p)}</td><td class="num">${r.held}×</td><td class="num">${r.ap}</td><td class="num">${r.conv}</td><td class="num">${r.rev}</td></tr>`).join('')}</table></div>
   <div class="card"><h2>Per dilemma</h2>
   ${H.length?H.map((h,i)=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)">
     <div class="row" style="justify-content:space-between"><b>${i+1}. Dilemma ${h.n}</b><span class="small muted">houder: ${esc(h.holder)} (${h.choices[h.holder]})</span></div>
     <div class="small muted" style="margin:4px 0 8px">${esc(D(h.n).q.slice(0,180))}${D(h.n).q.length>180?'…':''}</div>
     <table><tr><th>Speler</th><th>Eerst</th><th>Eind</th><th>Steun</th><th>Overtuigd door / argument</th></tr>
     ${S.players.filter(p=>h.choices[p]).map(p=>{const a=h.assess[p]||{};return `<tr><td>${esc(p)}</td><td>${h.choices[p]}</td><td>${a.final||h.choices[p]}${a.final&&a.final!==h.choices[p]?' ↺':''}</td><td>${p===h.holder?'—':(a.approve||'–')}</td><td>${esc([a.by,a.arg].filter(Boolean).join(': '))}</td></tr>`}).join('')}</table>
     ${h.notes?`<div class="small" style="margin-top:6px"><b>Notities:</b> ${esc(h.notes)}</div>`:''}
   </div>`).join(''):'<p class="muted">Nog niets gespeeld.</p>'}</div>
   <div class="card"><h2>Exporteren en importeren</h2>
   <p class="muted small">Download het spel voor je verslag (CSV voor Excel) of als back-up (JSON). Met een JSON-bestand kun je het spel op een ander apparaat verder spelen.</p>
   <div class="row"><button class="btn" id="csv">CSV downloaden</button><button class="btn" id="json">JSON downloaden</button>
   <label class="btn">JSON importeren<input type="file" id="imp" accept=".json" class="hidden"></label></div></div>`;
  $('#csv').onclick=()=>{
    const rows=[['ronde','dilemma','dilemmahouder','speler','eerste_keuze','motivatie','eind_keuze','herzien','steun_1_5','overtuigd_door','argument','notities']];
    H.forEach((h,i)=>S.players.filter(p=>h.choices[p]).forEach(p=>{const a=h.assess[p]||{};rows.push([i+1,h.n,h.holder,p,h.choices[p],h.motiv[p]||'',a.final||'',(a.final&&a.final!==h.choices[p])?'ja':'nee',p===h.holder?'':(a.approve||''),a.by||'',a.arg||'',h.notes||''])}));
    dl('dilemma-game.csv','﻿'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n'),'text/csv');

function dl(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

const FOC={patient:['Patiëntbelang','Patient well-being'],personeel:['Belang van medewerkers','Employee interests'],organisatie:['Organisatie en financiën','Organisational performance and finances'],reputatie:['Reputatie','Reputation'],integriteit:['Integriteit en regels','Integrity and rules'],samenwerking:['Dialoog en samenwerking','Dialogue and collaboration'],maatschappij:['Maatschappelijk belang','Societal interest']};
const FCOL={patient:'#2f6db5',personeel:'#c2741a',organisatie:'#5f6878',reputatie:'#8a4fa8',integriteit:'#0c6b58',samenwerking:'#3f8f4f',maatschappij:'#b4541f'};
const EN=()=>S.lang==='en';
const fl=k=>FOC[k]?FOC[k][EN()?1:0]:'–';
const focusOf=(n,k)=>(DILEMMAS[n-1].f||{})[k];
const TX={
 title:['Reflectieverslag Dilemma Game','Reflection paper Dilemma Game'],
 A:['A. Hoe ik met dilemma\'s omga: het patroon in mijn keuzes','A. How I deal with dilemmas: the pattern in my choices'],
 B:['B. De invloed van argumenten van medestudenten','B. The influence of fellow students\' arguments'],
 C:['C. Observaties van groepsgenoten en mijn reactie','C. Observations by group members and my response'],
 D:['D. Een dilemma uit de casus St. Bernold\'s hospital','D. A dilemma from the St. Bernold\'s hospital case'],
 app:['Bijlage: overzicht van de gespeelde dilemma\'s','Appendix: overview of the dilemmas played'],
 fill:['[Vul hier je eigen reflectie aan]','[Add your own reflection here]'],
 obsBy:['Observatie door','Observation by'],
 resp:['Mijn reactie','My response'],
 Dq:[['Het dilemma','Waarom is dit een dilemma?','Hoe zou ik ermee zijn omgegaan?','Welke omstandigheden beïnvloeden mijn gedrag (bijv. tijdsdruk)?'],['The dilemma','Why is it a dilemma?','How would I have dealt with it?','Which circumstances would influence my behaviour (e.g. time pressure)?']],
};
const tx=k=>TX[k][EN()?1:0];

function analyse(p){
  const H=S.history.filter(h=>h.choices[p]);
  const cnt={};H.forEach(h=>{const f=focusOf(h.n,h.choices[p]);if(f)cnt[f]=(cnt[f]||0)+1});
  const ranked=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  let maj=0,alone=0;
  H.forEach(h=>{const v=Object.values(h.choices);const c={};v.forEach(x=>c[x]=(c[x]||0)+1);const m=Math.max(...Object.values(c));
    if(c[h.choices[p]]===m)maj++; if(c[h.choices[p]]===1&&v.length>2)alone++});
  const rev=[],caused=[];
  S.history.forEach(h=>Object.entries(h.assess||{}).forEach(([q,a])=>{if(a.final&&h.choices[q]&&a.final!==h.choices[q]){if(q===p)rev.push({h,a});if(a.by===p)caused.push({h,q,a})}}));
  const sup=[];S.history.filter(h=>h.holder===p).forEach(h=>Object.entries(h.assess||{}).forEach(([q,a])=>{if(q!==p&&a.approve)sup.push(a.approve)}));
  const given=[];S.history.filter(h=>h.holder!==p).forEach(h=>{const a=(h.assess||{})[p];if(a&&a.approve)given.push(a.approve)});
  const avg=a=>a.length?(a.reduce((s,v)=>s+v,0)/a.length).toFixed(1):null;
  return {H,cnt,ranked,maj,alone,rev,caused,held:S.history.filter(h=>h.holder===p).length,sup:avg(sup),given:avg(given)};
}
function autoA(p,a){
  const N=a.H.length; if(!N) return EN()?'No dilemmas played yet.':'Nog geen dilemma\'s gespeeld.';
  const [t1,t2]=a.ranked; const en=EN();
  let s=en?`In the ${N} dilemmas I took part in, I most often chose alternatives that put ${fl(t1[0]).toLowerCase()} first (${t1[1]} times)`:`In de ${N} dilemma's waaraan ik deelnam, koos ik het vaakst voor alternatieven die ${fl(t1[0]).toLowerCase()} vooropstellen (${t1[1]} keer)`;
  if(t2) s+=en?`, followed by ${fl(t2[0]).toLowerCase()} (${t2[1]} times).`:`, gevolgd door ${fl(t2[0]).toLowerCase()} (${t2[1]} keer).`; else s+='.';
  s+=en?` In ${a.maj} of the ${N} dilemmas my first choice matched the (shared) majority of the group; ${a.alone} times I was the only one to choose my alternative.`:` In ${a.maj} van de ${N} dilemma's kwam mijn eerste keuze overeen met de (gedeelde) meerderheid van de groep; ${a.alone} keer was ik de enige met mijn alternatief.`;
  const notChosen=Object.keys(FOC).filter(k=>!a.cnt[k]);
  if(notChosen.length) s+=en?` Alternatives centred on ${notChosen.map(k=>fl(k).toLowerCase()).join(', ')} I did not choose at all.`:` Alternatieven die draaien om ${notChosen.map(k=>fl(k).toLowerCase()).join(', ')} heb ik geen enkele keer gekozen.`;
  return s;
}
function autoB(p,a){
  const en=EN();let s='';
  if(!a.rev.length) s+=en?'After the discussions I did not revise my choice in any of the dilemmas. ':'Na de discussies heb ik in geen enkel dilemma mijn keuze herzien. ';
  else{ s+=en?`After the discussion I revised my choice ${a.rev.length} time(s). `:`Na de discussie heb ik ${a.rev.length} keer mijn keuze herzien. `;
    a.rev.forEach(({h,a:x})=>{s+=en?`In dilemma ${h.n} I switched from ${h.choices[p]} to ${x.final}${x.by?`, convinced by ${x.by}`:''}${x.arg?` (argument: “${x.arg}”)`:''}. `:`Bij dilemma ${h.n} ging ik van ${h.choices[p]} naar ${x.final}${x.by?`, overtuigd door ${x.by}`:''}${x.arg?` (argument: “${x.arg}”)`:''}. `});}
  if(a.caused.length) s+=en?`Conversely, ${a.caused.length} time(s) a fellow student changed their choice because of my arguments. `:`Omgekeerd heeft ${a.caused.length} keer een medestudent zijn of haar keuze herzien door mijn argumenten. `;
  if(a.sup) s+=en?`As dilemma holder (${a.held}×) my position received an average support of ${a.sup} on a 1–5 scale.`:`Als dilemmahouder (${a.held}×) kreeg mijn standpunt gemiddeld ${a.sup.replace('.',',')} steun op een schaal van 1–5.`;
  return s;
}

  wc();
}
function para(t){return t?t.split(/\n{2,}/).map(x=>`<p>${esc(x).replace(/\n/g,'<br>')}</p>`).join(''):`<p class="hint">${tx('fill')}</p>`}
function reportHTML(p){
  const R=S.refl[p]||{},O=S.obs[p]||{},a=analyse(p),en=EN();
  const meta=[p,R.student,R.course,R.date].filter(Boolean).join(' · ');
  const others=S.players.filter(x=>x!==p&&O[x]);
  return `<h1>${tx('title')}</h1><p style="color:#666">${esc(meta)}</p>
  <h2>${tx('A')}</h2><p>${esc(autoA(p,a))}</p>${para(R.A)}
  <h2>${tx('B')}</h2><p>${esc(autoB(p,a))}</p>${para(R.B)}
  <h2>${tx('C')}</h2>${others.length?others.map(x=>`<h3>${tx('obsBy')} ${esc(x)}</h3>${para(O[x])}`).join(''):`<p class="hint">${en?'[Add two observations by group members]':'[Voeg twee observaties van groepsgenoten toe]'}</p>`}
  <h3>${tx('resp')}</h3>${para(R.C)}
  <h2>${tx('D')}</h2>${TX.Dq[en?1:0].map((q,i)=>`<h3>${q}</h3>${para(R['D'+i])}`).join('')}
  <h2>${tx('app')}</h2>
  <table><tr><th>#</th><th>${en?'Dilemma':'Dilemma'}</th><th>${en?'Holder':'Houder'}</th><th>${en?'My choice':'Mijn keuze'}</th><th>${en?'Value':'Waarde'}</th><th>${en?'Final':'Eind'}</th><th>${en?'Group':'Groep'}</th></tr>
  ${a.H.map((h,i)=>{const d=D(h.n),c=h.choices[p],f=(h.assess[p]||{}).final||c;const grp=L.map(k=>{const n=Object.values(h.choices).filter(x=>x===k).length;return n?k+n:''}).filter(Boolean).join(' ');
    return `<tr><td>${h.n}</td><td>${esc(d.q.length>110?d.q.slice(0,110)+'…':d.q)}</td><td>${esc(h.holder)}</td><td><b>${c}</b> – ${esc(d.o[c])}</td><td>${fl(focusOf(h.n,c))}</td><td>${f}${f!==c?' ↺':''}</td><td>${grp}</td></tr>`}).join('')}</table>`;
}
function showReport(p){
  $('#app').innerHTML=`<div class="row noprint" style="margin-bottom:14px">
    <button class="btn" id="back">← Terug naar bewerken</button>
    <button class="btn primary" id="print">Afdrukken / opslaan als PDF</button>
    <button class="btn" id="word">Download als Word</button></div>
    <div class="rep" id="rep">${reportHTML(p)}</div>`;
  $('#back').onclick=()=>{S.repView=0;render()};
  $('#print').onclick=()=>window.print();
  $('#word').onclick=()=>{
    const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${tx('title')}</title>
    <style>body{font-family:Calibri,Arial,sans-serif;font-size:11pt;line-height:115%}h1{font-size:16pt}h2{font-size:13pt;color:#0c6b58;margin-top:14pt}h3{font-size:11pt}p{margin:0 0 6pt}table{border-collapse:collapse;font-size:9pt}td,th{border:1px solid #ccc;padding:3pt;vertical-align:top}.hint{color:#999;font-style:italic}</style></head><body>${reportHTML(p)}</body></html>`;
    dl(`${tx('title').replace(/ /g,'_')}_${p.replace(/\W+/g,'_')}.doc`,'﻿'+html,'application/msword');
  };
}

/* ---------- RULES ---------- */
function rRules(){
  $('#app').innerHTML=`<div class="card"><h1>Spelregels</h1>
  <h2>Voorbereiding</h2><ul><li>Maak een groep van 3 tot 5 studenten. Je hoeft niet in dezelfde werkgroep te zitten.</li><li>Prik een datum. Het spel wordt niet tijdens de werkgroep gespeeld; liefst face-to-face, online (Zoom, Teams) mag ook.</li></ul>
  <h2>Per dilemma</h2><ol>
  <li>Kies wie dilemmahouder is. De dilemmahouder trekt een nummer tussen 1 en 50 en leest het dilemma voor.</li>
  <li>Elke speler kiest individueel en zonder overleg een alternatief, en schrijft dat op.</li>
  <li>De dilemmahouder onthult als eerste zijn keuze en motiveert waarom hij voor dit alternatief koos en niet voor de andere.</li>
  <li>De andere spelers onthullen één voor één hun keuze en motiveren die, nog zonder discussie.</li>
  <li>Discussieer daarna samen over wat het beste is om te doen. Overtuig jij de anderen, of zij jou, of komen jullie samen tot een beter inzicht? Ook bij dezelfde keuze kan de motivatie verschillen.</li>
  <li>Beoordeling: iedereen geeft aan in hoeverre hij het oorspronkelijke standpunt (keuze én argumentatie) van de dilemmahouder steunt, en of hij zijn eigen keuze herziet. Zo ja: wie overtuigde je, met welke argumenten?</li></ol>
  <p>Daarna wordt de volgende speler dilemmahouder. Idealiter eindigt het spel als iedereen twee keer dilemmahouder is geweest, maar je mag eerder stoppen.</p></div>`;
}
