<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dilemma Game – Health Care Management</title>
<style>
:root{
  --bg:#f6f4ef;--card:#fff;--ink:#1d2433;--muted:#5f6878;--line:#e3dfd6;
  --accent:#0c6b58;--accent-soft:#e2f1ec;--warn:#b4541f;--warn-soft:#fbeee6;
  --A:#2f6db5;--B:#c2741a;--C:#3f8f4f;--D:#8a4fa8;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14171d;--card:#1d222b;--ink:#e9ebef;--muted:#9aa3b2;--line:#2e3542;
  --accent:#4fc2a5;--accent-soft:#1d3a33;--warn:#f0955f;--warn-soft:#3b2a20;
  --A:#6ea4e6;--B:#e8a14d;--C:#6fc380;--D:#c08ad9;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;gap:14px;padding:12px 0;flex-wrap:wrap}
.logo{font-weight:750;font-size:18px;letter-spacing:-.01em}
.logo span{color:var(--accent)}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 12px;border-radius:9px;color:var(--muted);font:inherit;font-size:14px;cursor:pointer}

.lang{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.lang button{border:0;background:none;padding:7px 10px;font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.lang button.on{background:var(--accent);color:#fff}
.rep{background:#fff;color:#111;padding:48px 56px;border-radius:6px;box-shadow:0 2px 16px rgba(0,0,0,.08);font:15px/1.15 Calibri,Arial,sans-serif;max-width:820px;margin:0 auto}
.rep h1{font-size:22px;margin:0 0 4px}.rep h2{font-size:17px;margin:22px 0 6px;color:#0c6b58}.rep h3{font-size:14px;margin:14px 0 4px}
.rep p,.rep li{line-height:1.15;margin:0 0 8px}.rep table{font-size:12.5px}.rep th,.rep td{border-bottom:1px solid #ddd;padding:4px}
.rep .hint{color:#999;font-style:italic}
@media print{header,footer,.noprint{display:none!important}body{background:#fff}main{padding:0}.rep{box-shadow:none;padding:0;max-width:none}}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
main{padding:22px 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
h1{font-size:24px;margin:0 0 6px;letter-spacing:-.015em}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
input[type=text],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:70px;resize:vertical}
.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 15px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.dark .btn.primary,.btn.primary{color:#fff}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:13px;padding:6px 10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.steps{display:flex;gap:6px;margin:4px 0 18px;flex-wrap:wrap}
.step{flex:1;min-width:110px;padding:8px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.step b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.step.on{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 2px var(--accent-soft)}
.step.done{color:var(--accent)}
.dq{font-size:17px;line-height:1.6}
.opt{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-top:10px;background:var(--card);text-align:left;width:100%;font:inherit;color:inherit}
button.opt{cursor:pointer}
button.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.let{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;color:#fff}
.lA{background:var(--A)}.lB{background:var(--B)}.lC{background:var(--C)}.lD{background:var(--D)}
.players{display:flex;gap:8px;flex-wrap:wrap}
.pchip{padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.pchip.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pchip.holder::after{content:" ★";color:var(--warn)}
.reveal{border-left:4px solid var(--line);padding:10px 14px;margin-top:10px;border-radius:8px;background:var(--bg)}
.reveal.h{border-left-color:var(--warn)}
.big{font-size:44px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bar{height:22px;border-radius:6px;display:flex;overflow:hidden;background:var(--line)}
.bar div{height:100%}
.legend{display:flex;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.num{font-variant-numeric:tabular-nums}
.list .it{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:hover h3{color:var(--accent)}
.hidden{display:none}
.scale{display:flex;gap:4px}
.scale button{flex:1;padding:7px 0;border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;font:inherit;font-size:13px;color:var(--ink)}
.scale button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.privacy{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14px}
.kpi{padding:14px;border:1px solid var(--line);border-radius:12px}
.kpi .v{font-size:28px;font-weight:750;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted)}
footer{color:var(--muted);font-size:12px;text-align:center;padding:20px}
</style>
</head>
<body>
<header><div class="wrap top">
  <div class="logo">Dilemma <span>Game</span></div>
  <nav id="nav">
    <button data-v="setup">Spelers</button>
    <button data-v="play">Spelen</button>
    <button data-v="results">Resultaten</button>
    <button data-v="library">Alle dilemma's</button>
    <button data-v="report">Verslag</button>
    <button data-v="rules">Spelregels</button>
  </nav>
  <div class="lang" id="lang"><button data-l="nl">NL</button><button data-l="en">EN</button></div>
</div></header>
<main class="wrap" id="app"></main>
<footer>Dilemma's: Erasmus School of Health Policy &amp; Management · Je spel wordt alleen in deze browser bewaard. Exporteer het onder Resultaten om het te delen.</footer>

<script>
const DILEMMAS = [{"n": 1, "q": "In the hospital department you manage, a physician of high standing has made a mistake. He has failed to complete the full list of admission forms for a patient in time, causing an extended stay. This is a recurring problem for this physician. How will you deal with this internally?", "o": {"A": "During a team meeting, I will address the problem and talk to the person responsible. Transparency is important for the proper functioning of any department.", "B": "I will discuss the problem only with the responsible physician. This approach allows me to tackle the issue at the source while leaving the physician's reputation unharmed within the department.", "C": "I will inform the department of the situation so that everyone can learn from it. I will mention no names; all I care about is preventing the problem from recurring in future.", "D": "I will disregard the issue as I simply do not have the time. I am sure that the physician has taken a deliberate decision, weighing all of the interests at stake."}, "nl": {"q": "In de ziekenhuisafdeling waar jij leiding aan geeft, heeft een hooggeplaatste arts een fout gemaakt. Hij heeft de volledige lijst opnameformulieren van een patiënt niet op tijd ingevuld, waardoor de opname langer duurde. Dit is een terugkerend probleem bij deze arts. Hoe ga je hier intern mee om?", "o": {"A": "Tijdens een teamoverleg bespreek ik het probleem en spreek ik de verantwoordelijke aan. Transparantie is belangrijk voor het goed functioneren van elke afdeling.", "B": "Ik bespreek het probleem alleen met de betreffende arts. Zo pak ik het probleem bij de bron aan en blijft de reputatie van de arts binnen de afdeling onbeschadigd.", "C": "Ik informeer de afdeling over de situatie, zodat iedereen ervan kan leren. Ik noem geen namen; het enige wat voor mij telt is dat het probleem zich in de toekomst niet meer voordoet.", "D": "Ik laat de kwestie rusten, want ik heb er simpelweg geen tijd voor. Ik ga ervan uit dat de arts bewust een keuze heeft gemaakt waarbij alle betrokken belangen zijn afgewogen."}}, "f": {"A": "integriteit", "B": "personeel", "C": "organisatie", "D": "organisatie"}}, {"n": 2, "q": "You manage a team in a hospital department. The head of the department asks you for notes concerning a patient that are kept in a locked cupboard belonging to a physician. The information is needed to prepare for an intake interview for a routine surgical operation. The physician concerned is currently away on holiday, but you know the code of the lock. Will you open the cupboard and provide the department head with the patient details?", "o": {"A": "Yes, I will do as I am told, because otherwise, the operation would have to be delayed, and the patient would suffer. If, in retrospect, it turns out that unlocking the cupboard was not allowed, the responsibility will be on the department head.", "B": "Yes, provided that this is normal procedure here, and only if I know that the physician would not mind. If I am not sure whether she would mind, I will refuse to open the cupboard.", "C": "I will not do this, it would fly in the face of integrity.", "D": "I will try to contact the physician at her holiday location. I will not open the cupboard without her permission."}, "nl": {"q": "Je geeft leiding aan een team op een ziekenhuisafdeling. Het afdelingshoofd vraagt je om aantekeningen over een patiënt die in een afgesloten kast van een arts liggen. De informatie is nodig ter voorbereiding op een intakegesprek voor een routinematige operatie. De betreffende arts is op vakantie, maar jij kent de code van het slot. Open je de kast en geef je de patiëntgegevens aan het afdelingshoofd?", "o": {"A": "Ja, ik doe wat mij gevraagd wordt, want anders moet de operatie worden uitgesteld en heeft de patiënt daar last van. Mocht achteraf blijken dat het openen van de kast niet was toegestaan, dan ligt de verantwoordelijkheid bij het afdelingshoofd.", "B": "Ja, mits dit hier de gebruikelijke gang van zaken is en alleen als ik weet dat de arts er geen bezwaar tegen zou hebben. Ben ik er niet zeker van of zij bezwaar zou hebben, dan weiger ik de kast te openen.", "C": "Dat doe ik niet, want het zou ingaan tegen mijn integriteit.", "D": "Ik probeer de arts op haar vakantieadres te bereiken. Zonder haar toestemming open ik de kast niet."}}, "f": {"A": "patient", "B": "integriteit", "C": "integriteit", "D": "samenwerking"}}, {"n": 3, "q": "Many hospitals struggle with significant IC staff shortages, including the one where you serve as director. What will you do to ensure that sufficient capacity is reserved for the IC?", "o": {"A": "I will raise the wages of IC personnel substantially in the hopes of securing the loyalty of my current staff and perhaps even attracting staff from other hospitals.", "B": "The base of available IC professionals in the Netherlands is insufficient. I will therefore look abroad to try and recruit additional manpower.", "C": "I will sign an agreement with another hospital to enable the exchange and sharing of personnel.", "D": "I will ensure that there are sufficient training slots for our current staff, so that we can supplement any shortages from our own resources."}, "nl": {"q": "Veel ziekenhuizen kampen met grote personeelstekorten op de IC, ook het ziekenhuis waar jij bestuurder bent. Wat ga je doen om ervoor te zorgen dat er voldoende capaciteit voor de IC beschikbaar blijft?", "o": {"A": "Ik verhoog de salarissen van het IC-personeel aanzienlijk, in de hoop mijn huidige medewerkers aan mij te binden en misschien zelfs personeel van andere ziekenhuizen aan te trekken.", "B": "Het aanbod van IC-professionals in Nederland is onvoldoende. Ik ga daarom in het buitenland op zoek naar extra personeel.", "C": "Ik sluit een overeenkomst met een ander ziekenhuis om personeel te kunnen uitwisselen en delen.", "D": "Ik zorg voor voldoende opleidingsplekken voor ons huidige personeel, zodat we eventuele tekorten uit eigen gelederen kunnen aanvullen."}}, "f": {"A": "personeel", "B": "maatschappij", "C": "samenwerking", "D": "personeel"}}, {"n": 4, "q": "In the hospital where you serve as director, hygiene is a prime focus. Professional cleaners deliver an important contribution to the hospital’s hygiene on a daily basis. You have a choice either to employ these cleaning professionals on a (permanent) contract or to outsource. Which do you choose?", "o": {"A": "I will employ the cleaners. The main reason for this choice is that I want to convey to the outside world that my hospital considers hygiene of paramount importance and regards cleaners as indispensable hospital personnel.", "B": "I will employ the cleaners. The main reason for this choice is that I want to secure their loyalty to the hospital and therefore increase their commitment to the best possible hygiene.", "C": "I will outsource the cleaners. This will help to avoid the additional expenses involved in the employment of personnel.", "D": "I will outsource the cleaners, predominantly in view of the flexibility it allows me to deploy more or fewer cleaners (temporarily) according to current needs."}, "nl": {"q": "In het ziekenhuis waar jij bestuurder bent, staat hygiëne voorop. Professionele schoonmakers leveren dagelijks een belangrijke bijdrage aan de hygiëne van het ziekenhuis. Je kunt kiezen: deze schoonmaakprofessionals in (vaste) dienst nemen of de schoonmaak uitbesteden. Wat kies je?", "o": {"A": "Ik neem de schoonmakers in dienst. De belangrijkste reden is dat ik naar buiten toe wil uitdragen dat mijn ziekenhuis hygiëne van het allergrootste belang vindt en schoonmakers beschouwt als onmisbaar ziekenhuispersoneel.", "B": "Ik neem de schoonmakers in dienst. De belangrijkste reden is dat ik hun binding met het ziekenhuis wil vergroten en daarmee hun betrokkenheid bij een zo goed mogelijke hygiëne.", "C": "Ik besteed de schoonmaak uit. Zo vermijd ik de extra kosten die gepaard gaan met het in dienst hebben van personeel.", "D": "Ik besteed de schoonmaak uit, vooral vanwege de flexibiliteit die het mij biedt om (tijdelijk) meer of minder schoonmakers in te zetten, afhankelijk van de actuele behoefte."}}, "f": {"A": "reputatie", "B": "personeel", "C": "organisatie", "D": "organisatie"}}, {"n": 5, "q": "You have a vacancy for a nurse. A single dad comes to apply for the job. He is the sole caretaker of his child. He seems competent enough, but there is always the risk that he may be late if the child falls ill or the school teachers go on strike. You do need to hire someone as soon as possible to ensure sufficient capacity. Will you hire this single dad?", "o": {"A": "Yes, I will hire him. His personal situation is less important to me. All that counts is that he will do a good job.", "B": "Yes, I will hire him. I hope that this job will help him cope with his personal situation.", "C": "No, I will not hire him. I cannot take the chance. The proper functioning of my department and, ultimately, the hospital itself, is my responsibility. I will look for a new candidate as soon as possible.", "D": "Yes, I will hire him, but on the condition that he himself arranges for replacement in case of such a situation."}, "nl": {"q": "Je hebt een vacature voor een verpleegkundige. Een alleenstaande vader solliciteert. Hij is de enige verzorger van zijn kind. Hij lijkt competent genoeg, maar er is altijd het risico dat hij te laat komt als zijn kind ziek wordt of als de leraren staken. Je moet wel zo snel mogelijk iemand aannemen om voldoende capaciteit te waarborgen. Neem je deze alleenstaande vader aan?", "o": {"A": "Ja, ik neem hem aan. Zijn persoonlijke situatie is voor mij minder belangrijk. Het enige wat telt is dat hij goed werk zal leveren.", "B": "Ja, ik neem hem aan. Ik hoop dat deze baan hem helpt om met zijn persoonlijke situatie om te gaan.", "C": "Nee, ik neem hem niet aan. Dat risico kan ik niet nemen. Het goed functioneren van mijn afdeling en uiteindelijk van het ziekenhuis zelf is mijn verantwoordelijkheid. Ik ga zo snel mogelijk op zoek naar een nieuwe kandidaat.", "D": "Ja, ik neem hem aan, maar op voorwaarde dat hij zelf zorgt voor vervanging in geval van een dergelijke situatie."}}, "f": {"A": "integriteit", "B": "personeel", "C": "organisatie", "D": "organisatie"}}, {"n": 6, "q": "You are the director of a nursing home. You have recently been presented with an attractive offer for the purchase of Zoras, care robots, the type that more and more care institutions rave about. Zoras allegedly motivate the elderly to be more active, help psychiatric patients to find peace of mind, and even health care personnel seem to like to have them around. However, purchasing these robots would make part of the staff redundant, and it involves a hefty investment. Would you purchase the robots?", "o": {"A": "Yes, I would purchase the robots. They will bring a lot of positive energy to the patients and the nurses, making them worth the investment.", "B": "Yes, I would purchase the robots to point out that we are a modern nursing home. This will benefit our reputation, and that is how I hope to recoup the investment.", "C": "No, I would not purchase the robots. Technology is developing so fast these days that I suspect the robots will be outdated the moment they arrive. That seems a waste of money to me.", "D": "No, I would not purchase the robots. It is important for the atmosphere in the nursing home that people are not replaced by robots, nor that they need to fear that they will be in the future."}, "nl": {"q": "Je bent bestuurder van een verpleeghuis. Je hebt onlangs een aantrekkelijk aanbod gekregen voor de aanschaf van Zora's, zorgrobots waar steeds meer zorginstellingen enthousiast over zijn. Zora's zouden ouderen motiveren om actiever te zijn, psychiatrische patiënten helpen tot rust te komen en zelfs zorgpersoneel zou het fijn vinden om ze om zich heen te hebben. Aanschaf van deze robots zou echter een deel van het personeel overbodig maken en vraagt om een forse investering. Zou je de robots aanschaffen?", "o": {"A": "Ja, ik zou de robots aanschaffen. Ze brengen veel positieve energie voor zowel de bewoners als de verpleegkundigen, waardoor ze de investering waard zijn.", "B": "Ja, ik zou de robots aanschaffen om te laten zien dat wij een modern verpleeghuis zijn. Dat komt onze reputatie ten goede en zo hoop ik de investering terug te verdienen.", "C": "Nee, ik zou de robots niet aanschaffen. De technologie ontwikkelt zich tegenwoordig zo snel dat ik vermoed dat de robots verouderd zijn zodra ze geleverd worden. Dat lijkt me weggegooid geld.", "D": "Nee, ik zou de robots niet aanschaffen. Voor de sfeer in het verpleeghuis is het belangrijk dat mensen niet worden vervangen door robots en ook niet hoeven te vrezen dat dat in de toekomst gebeurt."}}, "f": {"A": "patient", "B": "reputatie", "C": "organisatie", "D": "personeel"}}, {"n": 7, "q": "As a manager of a hospital department, you notice a trend that doctors and nurses increasingly want to be able to plan their own working hours. They want to have more flexibility and a better balance between work and their private lives. This has a serious impact, mainly on work schedules that need to be prepared every few months. Will you switch to flexible workhours or hang on to traditional work schedules?", "o": {"A": "I will continue to use the traditional work schedule, as the implementation of flexible hours would not benefit the quality and continuity of our care.", "B": "I will stick to traditional hours. It would take too much time, energy and resources to prepare new schedules every time to suit everyone's wishes.", "C": "I will switch to flexible work hours. This will increase the quality of the work, as it will enhance employee satisfaction.", "D": "I will arrange for better opportunities within the schedule to swap shifts, even if this means more red tape."}, "nl": {"q": "Als afdelingshoofd in een ziekenhuis merk je dat artsen en verpleegkundigen steeds vaker hun eigen werktijden willen kunnen plannen. Zij willen meer flexibiliteit en een betere balans tussen werk en privé. Dit heeft grote gevolgen, vooral voor de roosters die om de zoveel maanden moeten worden opgesteld. Stap je over op flexibele werktijden of houd je vast aan traditionele roosters?", "o": {"A": "Ik blijf het traditionele rooster hanteren, omdat de invoering van flexibele werktijden de kwaliteit en continuïteit van onze zorg niet ten goede zou komen.", "B": "Ik houd vast aan traditionele werktijden. Het kost te veel tijd, energie en middelen om telkens nieuwe roosters op te stellen die aan ieders wensen voldoen.", "C": "Ik stap over op flexibele werktijden. Dat verhoogt de kwaliteit van het werk, omdat het de tevredenheid van medewerkers vergroot.", "D": "Ik zorg voor betere mogelijkheden binnen het rooster om diensten te ruilen, ook als dit meer bureaucratie met zich meebrengt."}}, "f": {"A": "patient", "B": "organisatie", "C": "personeel", "D": "personeel"}}, {"n": 8, "q": "As a department head, you have a budget of €10,000.- for 10 FTE of training, 1 FTE per staff member. If you offer every employee €1,000 a year, they can each take a small training course. Alternatively, you can choose to allocate the funds differently, for instance by offering great talents a more extensive training programme. What would you choose?", "o": {"A": "I will allocate the funds differently. Great talents will be given more training opportunities. That is how I hope to retain talents.", "B": "Everyone should be given the same development opportunities. Every employee will get the same amount.", "C": "Employees who love to learn, are motivated, and have a good plan to back up their ambitions, will receive more money for training. Those who indicate that they are not interested in studying or who show little commitment to do so, will receive a smaller amount.", "D": "I will decide per individual who applies for training. Those who want to take a course that is a perfect match for the department will receive more budget than those who want to take a less suitable training course."}, "nl": {"q": "Als afdelingshoofd heb je een budget van €10.000,- voor 10 FTE aan opleiding, 1 FTE per medewerker. Als je elke medewerker €1.000 per jaar geeft, kan iedereen een kleine cursus volgen. Je kunt de middelen ook anders verdelen, bijvoorbeeld door grote talenten een uitgebreider opleidingstraject aan te bieden. Wat kies je?", "o": {"A": "Ik verdeel de middelen anders. Grote talenten krijgen meer opleidingsmogelijkheden. Zo hoop ik talent te behouden.", "B": "Iedereen moet dezelfde ontwikkelmogelijkheden krijgen. Elke medewerker krijgt hetzelfde bedrag.", "C": "Medewerkers die graag leren, gemotiveerd zijn en een goed plan hebben om hun ambities te onderbouwen, krijgen meer geld voor opleiding. Wie aangeeft geen interesse te hebben in studeren of daarvoor weinig inzet toont, krijgt een lager bedrag.", "D": "Ik beslis per individu die een opleiding aanvraagt. Wie een cursus wil volgen die perfect aansluit bij de afdeling, krijgt meer budget dan wie een minder passende opleiding wil volgen."}}, "f": {"A": "personeel", "B": "personeel", "C": "personeel", "D": "organisatie"}}, {"n": 9, "q": "The hospital where you serve as director applies targets for the number of medical procedures that need to be carried out. However, to gain new knowledge and to advance the reputation of the hospital, it is important to carry out sufficient experiments as well. This makes it harder to achieve the targets. You are in a position to decide to set new targets. Will you?", "o": {"A": "Up-to-date knowledge and the reputation of the hospital are both so important that I decide to adjust the targets. A good reputation, new inventions, and employees who embrace the opportunities of the future will all combine to generate more revenue anyway.", "B": "No matter how important reputation and knowledge development are to a hospital, in the end, it needs to be a ‘healthy’ business for it to be able to provide good care. I will, therefore, not adjust the targets.", "C": "In order to motivate the staff to keep on developing, I will adjust the targets to include a better focus on gaining knowledge and skills and conducting experiments.", "D": "I will adjust the targets for a portion of the staff; those who apply a high degree of innovation and experiments in their work. The current targets will continue to apply for the rest."}, "nl": {"q": "Het ziekenhuis waar jij bestuurder bent, hanteert streefcijfers voor het aantal uit te voeren medische ingrepen. Om nieuwe kennis op te doen en de reputatie van het ziekenhuis te bevorderen, is het echter ook belangrijk om voldoende experimenten uit te voeren. Dit maakt het moeilijker om de streefcijfers te halen. Je bent in de positie om nieuwe streefcijfers vast te stellen. Doe je dat?", "o": {"A": "Actuele kennis en de reputatie van het ziekenhuis zijn allebei zo belangrijk dat ik besluit de streefcijfers aan te passen. Een goede reputatie, nieuwe uitvindingen en medewerkers die de kansen van de toekomst omarmen zorgen samen toch voor meer omzet.", "B": "Hoe belangrijk reputatie en kennisontwikkeling voor een ziekenhuis ook zijn, uiteindelijk moet het een 'gezond' bedrijf zijn om goede zorg te kunnen bieden. Ik pas de streefcijfers daarom niet aan.", "C": "Om het personeel te motiveren zich te blijven ontwikkelen, pas ik de streefcijfers aan, zodat er meer aandacht is voor het opdoen van kennis en vaardigheden en het uitvoeren van experimenten.", "D": "Ik pas de streefcijfers aan voor een deel van het personeel: zij die in hun werk in hoge mate innoveren en experimenteren. Voor de rest blijven de huidige streefcijfers gelden."}}, "f": {"A": "reputatie", "B": "organisatie", "C": "personeel", "D": "organisatie"}}, {"n": 10, "q": "The nursing home where you serve as director accommodates many long-stay patients. These patients stay here for many, many years, and for them it is convenient if the bedside staff consists of familiar faces as much as possible. This avoids situations where they need to get used to new faces, find out which is the best way to communicate with them, et cetera. For the nursing home, however, change is good. Nurses who have to carry out the same tasks again and again for extended periods of time will easily lose their motivation, have insufficient opportunities to learn how to deal with a wide variety of patients and situations, and are at risk of becoming less attentive due to habituation. Will you focus your management style on change or on retention?", "o": {"A": "The patient experience is paramount. I will try to retain the same staff for the nursing home for as long as possible.", "B": "The proper functioning of the nursing home is what is most important. I will promote staff changes.", "C": "Not only for the patients, but also for the staff themselves it is more convenient not to have to switch jobs too often. I will try to retain the same staff for the nursing home for as long as possible.", "D": "Not only for the nursing home, but also for the staff themselves it is better to switch jobs every now and then. I will promote staff changes."}, "nl": {"q": "Het verpleeghuis waar jij bestuurder bent, biedt onderdak aan veel langdurig verblijvende bewoners. Deze bewoners verblijven hier vele jaren en voor hen is het prettig als het personeel aan het bed zoveel mogelijk uit bekende gezichten bestaat. Zo hoeven ze niet te wennen aan nieuwe gezichten, uit te zoeken hoe je het beste met hen communiceert, enzovoort. Voor het verpleeghuis is verandering echter goed. Verpleegkundigen die langdurig steeds dezelfde taken moeten uitvoeren, verliezen gemakkelijk hun motivatie, hebben onvoldoende gelegenheid te leren omgaan met een grote verscheidenheid aan patiënten en situaties, en lopen het risico minder alert te worden door gewenning. Richt je je managementstijl op verandering of op behoud?", "o": {"A": "De ervaring van de bewoner staat voorop. Ik probeer hetzelfde personeel zo lang mogelijk aan het verpleeghuis te binden.", "B": "Het goed functioneren van het verpleeghuis is het belangrijkst. Ik stimuleer personeelswisselingen.", "C": "Niet alleen voor de bewoners, maar ook voor het personeel zelf is het prettiger om niet te vaak van baan te hoeven wisselen. Ik probeer hetzelfde personeel zo lang mogelijk aan het verpleeghuis te binden.", "D": "Niet alleen voor het verpleeghuis, maar ook voor het personeel zelf is het beter om af en toe van baan te wisselen. Ik stimuleer personeelswisselingen."}}, "f": {"A": "patient", "B": "organisatie", "C": "personeel", "D": "personeel"}}, {"n": 11, "q": "A few of the doctors in your team frequently cancel surgical operations due to work schedule inconvenience. They will then have to be replaced, or the operation has to be cancelled. This is inconvenient for the replacement and colleagues, but also for the patients, and it causes a lack of continuity of care. How will you respond to this situation as an OR manager?", "o": {"A": "I will accept it. Physicians are simply in a position to change their schedules whenever and however they want.", "B": "I will not accept it and will discuss the situation with the physicians. Appointments with patients should never be changed unless for very good reasons.", "C": "My department considers a good work-life balance very important. For this reason, physicians are entitled to adjust their schedules to suit their private lives. We will sit down together to reach agreement on the extent to which this is possible.", "D": "The physicians are only entitled to adjust their schedules if their replacement and other employees have no objections."}, "nl": {"q": "Enkele artsen in jouw team annuleren regelmatig operaties omdat hun werkrooster hun niet uitkomt. Zij moeten dan worden vervangen, of de operatie moet worden afgezegd. Dit is lastig voor de vervanger en de collega's, maar ook voor de patiënten, en het gaat ten koste van de continuïteit van zorg. Hoe reageer je op deze situatie als OK-manager?", "o": {"A": "Ik accepteer het. Artsen kunnen hun rooster nu eenmaal wijzigen wanneer en hoe zij maar willen.", "B": "Ik accepteer het niet en bespreek de situatie met de artsen. Afspraken met patiënten mogen nooit worden gewijzigd, tenzij er zeer goede redenen voor zijn.", "C": "Mijn afdeling hecht veel waarde aan een goede werk-privébalans. Daarom hebben artsen het recht hun rooster aan te passen aan hun privéleven. We gaan samen om de tafel om afspraken te maken over de mate waarin dit mogelijk is.", "D": "De artsen mogen hun rooster alleen aanpassen als hun vervanger en andere medewerkers daar geen bezwaar tegen hebben."}}, "f": {"A": "personeel", "B": "patient", "C": "samenwerking", "D": "personeel"}}, {"n": 12, "q": "It has come to your notice that many residents (i.e. doctor in training) in the department under your management suffer from fatigue, are nearing burnout or are burnt out. This may have an adverse impact on patients and colleagues. To relieve the pressure somewhat, you can implement a downwards adjustment to the number of mandatory contact hours. However, this also entails disadvantages, including the risk of an impaired bond with their medical supervisors (physicians). Which approach will you take?", "o": {"A": "In my approach, the same number of mandatory contact hours will apply to everyone. After all, working in health care is hard work, and residents should better find out sooner than later.", "B": "I will make a distinction, as not everyone can handle the same heavy workload. Care would be compromised if I would make people who are less able to handle a heavy workload work as hard as the rest.", "C": "For the sake of the contact with their medical supervisors, I will urge them to stick to the number of mandatory contact hours. At the same time, I will urge their medical supervisors to watch closely for any signs of excessive fatigue in their ‘pupils’.", "D": "If people feel that they are at risk of collapsing under the pressure of the large number of contact hours, they should bring this to my attention. Together with a few medical supervisors, I will decide for every individual case whether it is necessary to reduce the number of contact hours."}, "nl": {"q": "Het is je ter ore gekomen dat veel AIOS op de afdeling onder jouw leiding kampen met vermoeidheid, tegen een burn-out aan zitten of een burn-out hebben. Dit kan nadelige gevolgen hebben voor patiënten en collega's. Om de druk enigszins te verlichten kun je het aantal verplichte contacturen naar beneden bijstellen. Dit heeft echter ook nadelen, waaronder het risico op een verzwakte band met hun opleiders (medisch specialisten). Welke aanpak kies je?", "o": {"A": "In mijn aanpak geldt voor iedereen hetzelfde aantal verplichte contacturen. Werken in de zorg is immers zwaar werk, en AIOS kunnen daar maar beter zo snel mogelijk achter komen.", "B": "Ik maak onderscheid, want niet iedereen kan dezelfde zware werkbelasting aan. De zorg zou eronder lijden als ik mensen die minder goed tegen een hoge werkdruk kunnen, net zo hard laat werken als de rest.", "C": "Met het oog op het contact met hun opleiders dring ik erop aan dat zij zich aan het aantal verplichte contacturen houden. Tegelijkertijd dring ik er bij hun opleiders op aan goed te letten op signalen van overmatige vermoeidheid bij hun 'leerlingen'.", "D": "Als mensen het gevoel hebben dat zij dreigen te bezwijken onder de druk van het grote aantal contacturen, dan moeten zij dat bij mij melden. Samen met enkele opleiders beslis ik per individueel geval of het nodig is het aantal contacturen te verminderen."}}, "f": {"A": "organisatie", "B": "patient", "C": "samenwerking", "D": "personeel"}}, {"n": 13, "q": "Residing in your psychiatric institution for children is an eight-year-old boy who does not respond well to some of the staff. While he is great friends with some, he is mostly at odds with a number of others. These employees prefer not to work with the boy. The boy, in his turn, is quite picky in who gets to take care of him and who does not. What will you do? Will you adjust the schedules to ensure that only ‘matching’ staff will work with this boy?", "o": {"A": "In the interest of the staff, I will make sure that only those staff members who can handle him will work with the boy.", "B": "In the interest of the boy, I will make sure that only those staff members who can handle him will work with the boy.", "C": "In order to point out clearly to the boy that he is not the one who is in charge of who gets to work with him, I will let all of the staff work with the boy. I will not take his preferences into account.", "D": "All staff members should be able to work with all patients. I will not adjust the schedules to include only optimal ‘matches’."}, "nl": {"q": "In jouw psychiatrische instelling voor kinderen verblijft een jongen van acht jaar die slecht reageert op een aantal medewerkers. Met sommigen is hij dikke vrienden, maar met een aantal anderen ligt hij vooral overhoop. Deze medewerkers werken liever niet met de jongen. De jongen is op zijn beurt nogal kieskeurig over wie hem verzorgt en wie niet. Wat ga je doen? Pas je de roosters aan zodat alleen 'passende' medewerkers met deze jongen werken?", "o": {"A": "In het belang van de medewerkers zorg ik ervoor dat alleen die medewerkers met de jongen werken die met hem overweg kunnen.", "B": "In het belang van de jongen zorg ik ervoor dat alleen die medewerkers met de jongen werken die met hem overweg kunnen.", "C": "Om de jongen duidelijk te maken dat hij niet degene is die bepaalt wie met hem werkt, laat ik alle medewerkers met de jongen werken. Ik houd geen rekening met zijn voorkeuren.", "D": "Alle medewerkers moeten met alle patiënten kunnen werken. Ik pas de roosters niet aan om alleen optimale 'matches' in te zetten."}}, "f": {"A": "personeel", "B": "patient", "C": "patient", "D": "organisatie"}}, {"n": 14, "q": "You manage a team in a hospital department. Several of the team members call in sick during their holidays. They may actually be sick, but they may also be doing this under false pretences to save up holidays. Team members who report in sick on a holiday can use this day later to take a day off. At times, this may result in large numbers of free days for the team members concerned, which the rest of the team have to absorb. How will you handle this as a team leader?", "o": {"A": "I trust my staff completely. It is nothing but a mere coincidence that they happen to fall ill during their holidays. I cannot hold them accountable.", "B": "I assume that the team members who call in sick during a holiday are actually sick on that particular day. I will, however, broach the subject during the team meeting. After all, this is an issue that has a serious impact on the entire team.", "C": "I do not trust the situation. It cannot be a coincidence when so many team members report in sick during holidays. I will personally discuss the subject with all of the team members who did this to question whether they have been honest and to point out how annoying this may be to the rest of the team.", "D": "I have to put a stop to this. For this purpose, I will introduce strict rules, require a doctor's note, and perform checks."}, "nl": {"q": "Je leidt een team op een ziekenhuisafdeling. Verschillende teamleden melden zich tijdens hun vakantie ziek. Misschien zijn ze echt ziek, maar mogelijk doen ze dit ook onder valse voorwendselen om vakantiedagen te sparen. Teamleden die zich op een vakantiedag ziekmelden, mogen die dag later opnemen als vrije dag. Soms leidt dit tot grote aantallen vrije dagen voor de betrokken teamleden, die de rest van het team moet opvangen. Hoe pak je dit aan als teamleider?", "o": {"A": "Ik vertrouw mijn medewerkers volledig. Het is puur toeval dat zij tijdens hun vakantie ziek worden. Ik kan hen daar niet op aanspreken.", "B": "Ik ga ervan uit dat de teamleden die zich tijdens een vakantie ziekmelden op die dag echt ziek zijn. Wel breng ik het onderwerp ter sprake tijdens het teamoverleg. Dit is immers een kwestie die grote gevolgen heeft voor het hele team.", "C": "Ik vertrouw de situatie niet. Het kan geen toeval zijn dat zoveel teamleden zich tijdens vakanties ziekmelden. Ik bespreek het onderwerp persoonlijk met alle teamleden die dit hebben gedaan, om te vragen of zij eerlijk zijn geweest en om erop te wijzen hoe vervelend dit voor de rest van het team kan zijn.", "D": "Hier moet ik een einde aan maken. Daarvoor voer ik strikte regels in, eis ik een doktersverklaring en voer ik controles uit."}}, "f": {"A": "personeel", "B": "samenwerking", "C": "integriteit", "D": "integriteit"}}, {"n": 15, "q": "Some of the treatment procedures in the hospital where you serve as director depend on a small number of medical specialists. They threaten to switch to a rival hospital where they will earn more money. Will you try to retain the specialists or would you rather choose to stop offering these particular treatments?", "o": {"A": "I will pay them what they ask. After all, I want to be able to treat all patients.", "B": "There is a limit to my budget for human resources, and I will not cross it. Otherwise, the hospital would go bankrupt.", "C": "I will stop offering these particular therapies and ensure that the hospital specializes in other therapies.", "D": "I say good riddance to employees who leave the hospital for financial reasons. I want highly motivated specialists only."}, "nl": {"q": "Sommige behandelingen in het ziekenhuis waar je directeur bent, zijn afhankelijk van een klein aantal medisch specialisten. Zij dreigen over te stappen naar een concurrerend ziekenhuis waar ze meer gaan verdienen. Probeer je de specialisten te behouden, of kies je er liever voor deze behandelingen niet langer aan te bieden?", "o": {"A": "Ik betaal hen wat ze vragen. Ik wil immers alle patiënten kunnen behandelen.", "B": "Mijn budget voor personeel kent een grens en die overschrijd ik niet. Anders zou het ziekenhuis failliet gaan.", "C": "Ik stop met het aanbieden van deze behandelingen en zorg ervoor dat het ziekenhuis zich specialiseert in andere behandelingen.", "D": "Ik laat medewerkers die om financiële redenen het ziekenhuis verlaten graag gaan. Ik wil alleen zeer gemotiveerde specialisten."}}, "f": {"A": "patient", "B": "organisatie", "C": "organisatie", "D": "personeel"}}, {"n": 16, "q": "A patient wants to be treated for varicose veins. Upon examination, this patient’s varicose veins appear to fall into category 2, which means that the treatment is not covered by health insurance. The patient states that she finds the costs too high, and decides not to go ahead with the operation in spite of her complaints. In the event of classification in category 3, the treatment would be covered. What do you do?", "o": {"A": "I will meet my patient’s need and put her condition down as category 3 instead of category 2. I will bear the responsibility for this choice.", "B": "I will remind my patient of the health benefits of the procedure and urge her to reconsider.", "C": "My involvement stops here. I will not put down category 3 where category 2 applies, as that would drive up the cost of health care.", "D": "I can do nothing about this. Rules are rules, and it is up to the patient to decide whether or not to go ahead with the operation."}, "nl": {"q": "Een patiënt wil behandeld worden voor spataderen. Bij onderzoek blijken de spataderen van deze patiënt in categorie 2 te vallen, wat betekent dat de behandeling niet door de zorgverzekering wordt vergoed. De patiënt geeft aan dat zij de kosten te hoog vindt en besluit, ondanks haar klachten, de operatie niet te laten doen. Bij indeling in categorie 3 zou de behandeling wel worden vergoed. Wat doe je?", "o": {"A": "Ik kom tegemoet aan de behoefte van mijn patiënt en leg haar aandoening vast als categorie 3 in plaats van categorie 2. Ik draag de verantwoordelijkheid voor deze keuze.", "B": "Ik wijs mijn patiënt op de gezondheidsvoordelen van de ingreep en dring erop aan dat zij haar besluit heroverweegt.", "C": "Hier houdt mijn betrokkenheid op. Ik leg geen categorie 3 vast waar categorie 2 van toepassing is, omdat dat de zorgkosten zou opdrijven.", "D": "Hier kan ik niets aan doen. Regels zijn regels, en het is aan de patiënt om te beslissen of zij de operatie wel of niet laat uitvoeren."}}, "f": {"A": "patient", "B": "patient", "C": "maatschappij", "D": "integriteit"}}, {"n": 17, "q": "A patient wants to be treated for varicose veins. Upon examination, this patient’s varicose veins appear to fall into category 2. If the classification were category 3, the hospital would receive a higher reimbursement, while the actual procedure is practically identical. It makes no difference to the patient which category you put down. What do you do?", "o": {"A": "I will put down category 3. It is a small adjustment and the only consequence is that the hospital receives more money.", "B": "I will put down category 3, but I will feel guilty about it as it is not entirely honest.", "C": "I will put down category 2, because that is what it is.", "D": "I will ask my supervisor what to do."}, "nl": {"q": "Een patiënt wil behandeld worden voor spataderen. Bij onderzoek blijken de spataderen van deze patiënt in categorie 2 te vallen. Als de indeling categorie 3 zou zijn, zou het ziekenhuis een hogere vergoeding ontvangen, terwijl de feitelijke ingreep vrijwel identiek is. Voor de patiënt maakt het niet uit welke categorie je vastlegt. Wat doe je?", "o": {"A": "Ik leg categorie 3 vast. Het is een kleine aanpassing en het enige gevolg is dat het ziekenhuis meer geld ontvangt.", "B": "Ik leg categorie 3 vast, maar ik voel me er schuldig over omdat het niet helemaal eerlijk is.", "C": "Ik leg categorie 2 vast, want dat is wat het is.", "D": "Ik vraag mijn leidinggevende wat ik moet doen."}}, "f": {"A": "organisatie", "B": "organisatie", "C": "integriteit", "D": "samenwerking"}}, {"n": 18, "q": "You work as a patient care coordinator for three children from a multiple-problem family. One of your tasks is to arrange for financial support. Being in close contact and having access to financial documents, you soon discover that the children’s mother works in the black economy. A municipal fraud investigator suspects social benefit fraud and turns to you for information. What will you tell him?", "o": {"A": "I will tell the investigator what I know. I am the only one who knows it, and I feel that it is my responsibility to share this knowledge with those who need to know.", "B": "I will tell the investigator what I know. It is not my responsibility, but I feel that this is an unjust burden on the community.", "C": "I will say that I have no knowledge of this. Live and let live. A bit of extra cash can go a long way to help the mother in her difficult situation.", "D": "It seems to me that this is privileged information, so I keep my mouth shut."}, "nl": {"q": "Je werkt als zorgcoördinator voor drie kinderen uit een multiprobleemgezin. Een van je taken is het regelen van financiële ondersteuning. Doordat je nauw contact hebt en toegang hebt tot financiële documenten, ontdek je al snel dat de moeder van de kinderen in het zwarte circuit werkt. Een fraudeonderzoeker van de gemeente vermoedt uitkeringsfraude en benadert jou voor informatie. Wat vertel je hem?", "o": {"A": "Ik vertel de onderzoeker wat ik weet. Ik ben de enige die het weet, en ik vind het mijn verantwoordelijkheid deze kennis te delen met degenen die het moeten weten.", "B": "Ik vertel de onderzoeker wat ik weet. Het is niet mijn verantwoordelijkheid, maar ik vind dat dit een onterechte last voor de gemeenschap is.", "C": "Ik zeg dat ik hier niets van weet. Leven en laten leven. Een beetje extra geld kan de moeder in haar moeilijke situatie een flinke steun zijn.", "D": "Het lijkt mij dat dit vertrouwelijke informatie is, dus ik zwijg erover."}}, "f": {"A": "integriteit", "B": "maatschappij", "C": "patient", "D": "integriteit"}}, {"n": 19, "q": "You are the director of a daycare centre for disabled children. The municipality imposes an unrealistic hourly rate. You are allowed to charge €19.- an hour for your work, but the current cost amounts to €23.- an hour. What will you do?", "o": {"A": "I will discuss the matter with the alderman to try to get him to reverse the decision. In the meantime, I will accept the (paltry) rate.", "B": "I will refuse to sign the contract, and will temporarily be unable to provide sufficient care. As a result, the waiting lists will grow and children in need of help will go without help.", "C": "I will accept the hourly rate, as I simply want to provide care. To make ends meet, I will carry out a restructuring that will require me to lay off employees and hire new ones at a lower rate.", "D": "This is a scandal and I will be sure to inform the media. Until the time when the municipality bows to media attention, I will offer care against the low rate. I will share the consequences of this decision with the entire media landscape."}, "nl": {"q": "Je bent directeur van een dagbesteding voor kinderen met een beperking. De gemeente hanteert een onrealistisch uurtarief. Je mag voor jullie werk €19,- per uur rekenen, maar de huidige kosten bedragen €23,- per uur. Wat ga je doen?", "o": {"A": "Ik bespreek de kwestie met de wethouder om te proberen hem het besluit te laten terugdraaien. In de tussentijd accepteer ik het (povere) tarief.", "B": "Ik weiger het contract te tekenen en kan tijdelijk onvoldoende zorg bieden. Hierdoor groeien de wachtlijsten en blijven kinderen die hulp nodig hebben zonder hulp.", "C": "Ik accepteer het uurtarief, want ik wil gewoon zorg verlenen. Om de eindjes aan elkaar te knopen voer ik een reorganisatie door waarbij ik medewerkers moet ontslaan en nieuwe medewerkers tegen een lager tarief aanneem.", "D": "Dit is een schandaal en ik zal er zeker de media over informeren. Tot het moment waarop de gemeente onder de mediaaandacht zwicht, bied ik zorg aan tegen het lage tarief. De gevolgen van dit besluit deel ik met het hele medialandschap."}}, "f": {"A": "samenwerking", "B": "organisatie", "C": "organisatie", "D": "reputatie"}}, {"n": 20, "q": "Integrated care is the trend nowadays. However, partnerships between organizations can, in practice, lead to ‘throwing things over the fence’, a situation in which the organizations keep referring patients to other organizations as long-stay care is too expensive. You are the manager of a rehabilitation centre. Will you acquiesce in this development, or will you, on the contrary, fight it and try to turn the tide?", "o": {"A": "I will acquiesce in the development. One person cannot change the world.", "B": "I will acquiesce. If you play the game of throwing problems over the fence well, you will end up with a financially healthy organization. This, in turn, will benefit both staff and patients.", "C": "I will try to turn the tide by conducting monthly meetings with the organizations with which I collaborate. Together, we can make the difference.", "D": "Each organization has its own responsibility. My rehabilitation centre is not one to participate in the game of throwing problems over the fence. I will set up policies to avoid this, and I will have my staff trained to refrain from such practices."}, "nl": {"q": "Geïntegreerde zorg is tegenwoordig de trend. Samenwerkingsverbanden tussen organisaties kunnen in de praktijk echter leiden tot 'over de schutting gooien', een situatie waarin organisaties patiënten blijven doorverwijzen naar andere organisaties omdat langdurige zorg te duur is. Je bent manager van een revalidatiecentrum. Berust je in deze ontwikkeling, of bestrijd je haar juist en probeer je het tij te keren?", "o": {"A": "Ik berust in de ontwikkeling. Eén persoon kan de wereld niet veranderen.", "B": "Ik berust erin. Als je het spel van problemen over de schutting gooien goed speelt, houd je een financieel gezonde organisatie over. Dat komt op zijn beurt zowel de medewerkers als de patiënten ten goede.", "C": "Ik probeer het tij te keren door maandelijks overleg te voeren met de organisaties waarmee ik samenwerk. Samen kunnen we het verschil maken.", "D": "Elke organisatie heeft haar eigen verantwoordelijkheid. Mijn revalidatiecentrum doet niet mee aan het spel van problemen over de schutting gooien. Ik stel beleid op om dit te voorkomen en laat mijn medewerkers trainen om van dergelijke praktijken af te zien."}}, "f": {"A": "organisatie", "B": "organisatie", "C": "samenwerking", "D": "integriteit"}}, {"n": 21, "q": "One of the junior doctors in your department who is a doctor in training quits and resigns his position in the hospital. During the time this training doctor worked in the hospital, he made a mistake that could lead to reputational damage for the hospital. The information has come out. How will you deal with this as a manager?", "o": {"A": "I will speak to the press whenever I am asked to, but other than that, I will have no part in it. This concerns a mistake made by someone who is no longer involved in the hospital.", "B": "I will get actively involved in explaining the details of this mistake to the media. We need to be transparent at all times, even when it comes to matters that took place in the past.", "C": "I will share no information on the topic. The attention for this mistake will soon die down. Any serious discussion of the matter on my part would only further jeopardize our reputation.", "D": "I will seize this opportunity to show the outside world how we deal with this type of mistakes, in our department and as a hospital. Together with our consultants, I will draft a story that will make the hospital come out smelling like roses."}, "nl": {"q": "Een van de jonge artsen op jouw afdeling, een AIOS, zegt zijn functie in het ziekenhuis op. Tijdens zijn werkperiode in het ziekenhuis heeft hij een fout gemaakt die tot reputatieschade voor het ziekenhuis kan leiden. De informatie is naar buiten gekomen. Hoe ga je hier als manager mee om?", "o": {"A": "Ik praat met de pers wanneer mij dat gevraagd wordt, maar verder bemoei ik mij er niet mee. Het gaat om een fout van iemand die niet meer bij het ziekenhuis betrokken is.", "B": "Ik ga actief de details van deze fout aan de media toelichten. Wij moeten altijd transparant zijn, ook over zaken uit het verleden.", "C": "Ik deel geen informatie over dit onderwerp. De aandacht voor deze fout ebt snel weer weg. Als ik er serieus op inga, schaad ik onze reputatie alleen maar verder.", "D": "Ik grijp deze gelegenheid aan om de buitenwereld te laten zien hoe wij met dit soort fouten omgaan, op onze afdeling en als ziekenhuis. Samen met onze medisch specialisten stel ik een verhaal op waarmee het ziekenhuis er juist goed uitkomt."}}, "f": {"A": "organisatie", "B": "integriteit", "C": "reputatie", "D": "reputatie"}}, {"n": 22, "q": "You are the director of a hospital. This hospital attracts abundant attention on social media. People are asking questions, they respond to news releases, and they discuss their experiences with the hospital. Social media offer a great platform for interaction with (future) patients, but there is a downside to it as well. For instance, it takes a lot of time and energy to monitor all of this attention and to respond to it in a responsible manner. Furthermore, reputation risk management requires great accuracy. Will you reserve time and budget for social media?", "o": {"A": "I will recruit a large team for web care to engage proactively in social media.", "B": "I will instruct a team of web editors to answer questions only.", "C": "I will do nothing at all. Despite full commitment, the risk is too high that we will slip up in the many replies and messages we would send out.", "D": "I will have the media attention monitored. I will limit our responses to times when it is absolutely necessary to respond or when we have an opportunity to contribute significantly to our reputation."}, "nl": {"q": "Je bent directeur van een ziekenhuis. Dit ziekenhuis krijgt veel aandacht op social media. Mensen stellen vragen, reageren op nieuwsberichten en delen hun ervaringen met het ziekenhuis. Social media bieden een mooi platform voor interactie met (toekomstige) patiënten, maar er zit ook een keerzijde aan. Het kost bijvoorbeeld veel tijd en energie om al deze aandacht te volgen en er op een verantwoorde manier op te reageren. Bovendien vraagt het beheersen van reputatierisico's grote nauwkeurigheid. Reserveer je tijd en budget voor social media?", "o": {"A": "Ik werf een groot webcareteam om proactief aan de slag te gaan op social media.", "B": "Ik laat een team van webredacteuren uitsluitend vragen beantwoorden.", "C": "Ik doe helemaal niets. Ondanks alle inzet is het risico te groot dat wij ons in de vele reacties en berichten die we zouden versturen vergissen.", "D": "Ik laat de media-aandacht monitoren. Ik beperk onze reacties tot momenten waarop reageren echt noodzakelijk is of waarop we een belangrijke bijdrage aan onze reputatie kunnen leveren."}}, "f": {"A": "samenwerking", "B": "organisatie", "C": "reputatie", "D": "reputatie"}}, {"n": 23, "q": "Your hospital is struggling with a drug-resistant bacteria. Internally, almost no one knows about this, and outside the hospital, it is completely unknown. You serve on the board of directors. Which approach will you advocate?", "o": {"A": "It is absolutely vital that we release this news. This information is important to the entire region. I will engage a communications agency to broadcast and respond on as many channels as possible, while at the same time trying to minimize reputational damage.", "B": "I will start an internal investigation immediately to find out how this could have happened and who is responsible.", "C": "We will share this across the organization so that all employees are informed and so that they can take precautions. We will ensure internally that we will get rid of the bacteria.", "D": "We will share this information internally, but only with those people who absolutely need to know. We will urge them to keep the information confined within the walls of the institution."}, "nl": {"q": "Jouw ziekenhuis kampt met een resistente bacterie. Intern weet bijna niemand ervan en buiten het ziekenhuis is het volledig onbekend. Je zit in de raad van bestuur. Welke aanpak ga je bepleiten?", "o": {"A": "Het is absoluut noodzakelijk dat wij dit nieuws naar buiten brengen. Deze informatie is belangrijk voor de hele regio. Ik schakel een communicatiebureau in om via zo veel mogelijk kanalen te communiceren en te reageren, en probeer tegelijkertijd de reputatieschade te beperken.", "B": "Ik start direct een intern onderzoek om uit te zoeken hoe dit heeft kunnen gebeuren en wie er verantwoordelijk voor is.", "C": "Wij delen dit binnen de hele organisatie, zodat alle medewerkers op de hoogte zijn en voorzorgsmaatregelen kunnen nemen. Wij zorgen er intern voor dat de bacterie verdwijnt.", "D": "Wij delen deze informatie intern, maar alleen met degenen die het absoluut moeten weten. Wij dringen er bij hen op aan de informatie binnen de muren van de instelling te houden."}}, "f": {"A": "maatschappij", "B": "integriteit", "C": "personeel", "D": "reputatie"}}, {"n": 24, "q": "You are the director of a service flat. For their evening meals, all residents can use a catering service. There is a contract with one sole supplier, and the residents are expected to order their meals from this supplier. A provision to this effect is incorporated in their tenancy contract. Some of the residents are dissatisfied with the meals of this supplier and decide to order their meals elsewhere. How will you respond as a director?", "o": {"A": "I will send a letter to the residents stating that this is unacceptable; if everyone were to order their meals elsewhere, it would become too expensive to offer this service any longer.", "B": "I will accept their decision. Residents should be free to choose their own meals.", "C": "I will personally discuss the matter with each of the dissatisfied residents. I want to hear their story, but I also want to point out to them that ordering your own meals is unacceptable.", "D": "In fact, the complaints of residents are the responsibility of the catering company. I will, therefore, submit them all to the catering company, requesting that they improve the quality of their service."}, "nl": {"q": "Je bent directeur van een serviceflat. Alle bewoners kunnen voor hun avondmaaltijd gebruikmaken van een cateringdienst. Er is een contract met één enkele leverancier en van de bewoners wordt verwacht dat zij hun maaltijden bij deze leverancier bestellen. Een bepaling hierover is opgenomen in hun huurcontract. Een aantal bewoners is ontevreden over de maaltijden van deze leverancier en besluit elders te gaan bestellen. Hoe reageer je als directeur?", "o": {"A": "Ik stuur de bewoners een brief waarin ik schrijf dat dit onacceptabel is; als iedereen elders zou gaan bestellen, wordt het te duur om deze service nog langer aan te bieden.", "B": "Ik accepteer hun beslissing. Bewoners moeten vrij zijn om zelf hun maaltijden te kiezen.", "C": "Ik bespreek de kwestie persoonlijk met elk van de ontevreden bewoners. Ik wil hun verhaal horen, maar ik wil hen er ook op wijzen dat het niet acceptabel is om zelf maaltijden te bestellen.", "D": "De klachten van bewoners zijn eigenlijk de verantwoordelijkheid van het cateringbedrijf. Ik leg ze daarom allemaal voor aan het cateringbedrijf, met het verzoek de kwaliteit van de dienstverlening te verbeteren."}}, "f": {"A": "organisatie", "B": "patient", "C": "samenwerking", "D": "organisatie"}}, {"n": 25, "q": "You serve on the board of a nursing home. Your staff has tied a women to her bed for a couple of hours. Allegedly, she was being aggressive to the point of becoming a danger to herself, the other patients, and the staff. The BOPZ status (Psychiatric Hospitals [Compulsory Admission] status) was not in place yet and, therefore, taking such measures is not allowed officially, but you can apply for it. If granted, it is allowed to tie up patients subject to strict conditions. What do you do?", "o": {"A": "Tying people up is inhuman and I will definitely not apply for BOPZ status. Those who do decide to tie someone up, will be held accountable. It must never happen again.", "B": "I will not apply for BOPZ status. I fear that this would open the floodgates and that on another occasion the staff will be all too eager to decide in favour of tying patients up.", "C": "I will apply for BOPZ status. Subsequently, I will discuss the very stringent legal conditions internally and supervise compliance. Tying someone up must remain the exception.", "D": "I will apply for BOPZ status. The safety of our staff takes top priority, so they should be allowed to tie patients up if they see no alternative to calm them down."}, "nl": {"q": "Je zit in de raad van bestuur van een verpleeghuis. Medewerkers hebben een vrouw enkele uren aan haar bed vastgebonden. Naar verluidt was zij zo agressief dat zij een gevaar vormde voor zichzelf, de andere patiënten en de medewerkers. De BOPZ-status (Wet bijzondere opnemingen in psychiatrische ziekenhuizen) was nog niet van kracht en zulke maatregelen zijn dus formeel niet toegestaan, maar je kunt de status aanvragen. Als die wordt verleend, mogen patiënten onder strikte voorwaarden worden vastgebonden. Wat doe je?", "o": {"A": "Mensen vastbinden is onmenselijk en ik vraag zeker geen BOPZ-status aan. Wie toch besluit iemand vast te binden, wordt ter verantwoording geroepen. Het mag nooit meer gebeuren.", "B": "Ik vraag geen BOPZ-status aan. Ik vrees dat dit de deur openzet en dat medewerkers bij een volgende gelegenheid veel te snel kiezen voor het vastbinden van patiënten.", "C": "Ik vraag de BOPZ-status aan. Vervolgens bespreek ik de zeer strenge wettelijke voorwaarden intern en houd ik toezicht op de naleving. Vastbinden moet de uitzondering blijven.", "D": "Ik vraag de BOPZ-status aan. De veiligheid van onze medewerkers staat voorop, dus zij moeten patiënten mogen vastbinden als zij geen ander alternatief zien om hen te kalmeren."}}, "f": {"A": "patient", "B": "patient", "C": "integriteit", "D": "personeel"}}, {"n": 26, "q": "Your organization offers a so-called ‘last station’ to people with severe psychiatric problems. You have a lot of suicidal patients in your institution, for instance, for whom adequate help is unavailable. The applications keep rolling in, your organization is becoming overcrowded, and the care providers are under increasingly heavy pressure. This concerns both the number of patients and the severity of their clinical presentation. If you admit new patients, you will no longer be able to cope. However, as you are the only place left for them to turn to, it feels as though you have no choice but to accept them. Furthermore, in many cases, it is unclear who is responsible for these types of cases. What will you do?", "o": {"A": "We will reject patients because otherwise we will not be able to provide proper care for the existing patients.", "B": "We will reject patients in order to make a statement to policymakers. They are in a position to change this situation, but they will not introduce any changes unless they are confronted with shortcomings in the current policy.", "C": "As a last place to turn to, we bear such a heavy social responsibility to certain patients that we will have to keep on admitting them. We will do this only if the patient concerned has nowhere else to turn. This does mean that existing patients will get less care.", "D": "We will continue to admit patients who have nowhere else to turn. We will do this for the sake of these patients, whose predicament should not be aggravated. This does mean that we will need to hire extra staff, which will push us into the red."}, "nl": {"q": "Jouw organisatie biedt een zogeheten ‘laatste station’ aan mensen met ernstige psychiatrische problemen. Je hebt bijvoorbeeld veel suïcidale patiënten in je instelling voor wie elders geen passende hulp beschikbaar is. De aanmeldingen blijven binnenkomen, je organisatie raakt overbelast en de zorgverleners staan steeds zwaarder onder druk. Dat geldt zowel voor het aantal patiënten als voor de ernst van hun klachten. Als je nieuwe patiënten opneemt, kun je het niet meer aan. Maar omdat jullie de enige plek zijn waar zij nog terechtkunnen, voelt het alsof je niet anders kunt dan hen accepteren. Bovendien is in veel gevallen onduidelijk wie voor dit soort patiënten verantwoordelijk is. Wat ga je doen?", "o": {"A": "Wij weigeren patiënten, want anders kunnen wij de zorg voor de huidige patiënten niet meer goed verlenen.", "B": "Wij weigeren patiënten om een statement richting beleidsmakers te maken. Zij kunnen deze situatie veranderen, maar zullen niets veranderen zolang zij niet worden geconfronteerd met de tekortkomingen van het huidige beleid.", "C": "Als laatste station dragen wij voor bepaalde patiënten zo'n zware maatschappelijke verantwoordelijkheid dat wij hen moeten blijven opnemen. Wij doen dit alleen als de betreffende patiënt nergens anders terechtkan. Dit betekent wel dat de huidige patiënten minder zorg krijgen.", "D": "Wij blijven patiënten opnemen die nergens anders terechtkunnen. Wij doen dit omwille van deze patiënten, wier situatie niet nog erger mag worden. Dit betekent wel dat wij extra personeel moeten aannemen, waardoor wij in de rode cijfers belanden."}}, "f": {"A": "patient", "B": "maatschappij", "C": "maatschappij", "D": "patient"}}, {"n": 27, "q": "Your hospital is compensated for every inpatient day. This compensation is higher than what you get for a shorter stay. From a financial perspective, a longer stay is, therefore, more attractive, and sometimes, it can be beneficial for patients to be compelled to follow the hospital regime with its peace and proper order. On the other hand, short stays have their advantages as well. Patients often prefer a short stay, and you can fit more treatments in a day. What would you prefer, as the director of this hospital?", "o": {"A": "We will allow patients to stay for longer than strictly necessary in order to be able to claim the higher compensation. This benefits the financial health of the hospital.", "B": "We will allow patients to stay for longer than strictly necessary. This allows us to coerce them into following a daily routine of calm, peace and rest. This will contribute to their speedy recovery and indirectly to our reputation.", "C": "We will try to ensure that people stay for a very short period of time so that we can treat more patients in the same time. In the end, this approach benefits our bottom line and brings in more revenue.", "D": "For the sake of the patients, we will never admit them for longer than necessary without good reason. We will discuss the option with them so that they can stay for longer if that makes them feel more comfortable."}, "nl": {"q": "Jouw ziekenhuis wordt vergoed voor elke ligdag. Deze vergoeding is hoger dan wat je voor een kortere opname krijgt. Vanuit financieel oogpunt is een langere opname dus aantrekkelijker, en soms kan het voor patiënten gunstig zijn om gedwongen het ziekenhuisregime met zijn rust en regelmaat te volgen. Aan de andere kant hebben korte opnames ook voordelen. Patiënten geven vaak de voorkeur aan een korte opname en er passen meer behandelingen in een dag. Wat heeft als directeur van dit ziekenhuis jouw voorkeur?", "o": {"A": "Wij laten patiënten langer blijven dan strikt noodzakelijk, zodat wij de hogere vergoeding kunnen declareren. Dit komt ten goede aan de financiële gezondheid van het ziekenhuis.", "B": "Wij laten patiënten langer blijven dan strikt noodzakelijk. Zo kunnen wij hen dwingen een dagritme van kalmte, rust en regelmaat te volgen. Dit draagt bij aan hun snelle herstel en indirect aan onze reputatie.", "C": "Wij proberen ervoor te zorgen dat mensen zeer kort blijven, zodat wij in dezelfde tijd meer patiënten kunnen behandelen. Uiteindelijk komt deze aanpak ten goede aan ons resultaat en levert hij meer omzet op.", "D": "Omwille van de patiënten nemen wij hen nooit langer op dan nodig zonder goede reden. Wij bespreken de mogelijkheid met hen, zodat zij langer kunnen blijven als zij zich daar prettiger bij voelen."}}, "f": {"A": "organisatie", "B": "patient", "C": "organisatie", "D": "patient"}}, {"n": 28, "q": "You are a consultant for a hospital department. In this department, nurses regularly give injections to children. Most of these shots are very inconvenient for the children. Some new versions have been developed that are less burdensome, but they entail additional expenses, which the hospital has to bear. What will you recommend at the time of preparing the hospital policy?", "o": {"A": "The main priority is to run a financially sound hospital. I will, therefore, recommend the use of the injections that do not entail additional expenses.", "B": "The reputation of a hospital is largely the result of patient experiences. I will, therefore, recommend that the injections that are perceived as less burdensome be used at all times.", "C": "As a care provider, one should always choose what is best for the patients. I will, therefore, recommend the use of the injections that are least burdensome to the patients.", "D": "I will recommend to have physicians make their own choice. They are able to assess whether it is necessary in any individual case to use the less burdensome variety."}, "nl": {"q": "Je bent adviseur van een ziekenhuisafdeling. Op deze afdeling geven verpleegkundigen regelmatig injecties aan kinderen. De meeste van deze prikken zijn erg vervelend voor de kinderen. Er zijn nieuwe varianten ontwikkeld die minder belastend zijn, maar die brengen extra kosten met zich mee, die het ziekenhuis moet dragen. Wat adviseer je bij het opstellen van het ziekenhuisbeleid?", "o": {"A": "De hoofdprioriteit is een financieel gezond ziekenhuis. Ik adviseer daarom de injecties te gebruiken die geen extra kosten met zich meebrengen.", "B": "De reputatie van een ziekenhuis is grotendeels het resultaat van patiëntervaringen. Ik adviseer daarom altijd de injecties te gebruiken die als minder belastend worden ervaren.", "C": "Als zorgverlener moet je altijd kiezen voor wat het beste is voor de patiënten. Ik adviseer daarom de injecties te gebruiken die voor de patiënten het minst belastend zijn.", "D": "Ik adviseer de artsen zelf te laten kiezen. Zij kunnen beoordelen of het in een individueel geval nodig is de minder belastende variant te gebruiken."}}, "f": {"A": "organisatie", "B": "reputatie", "C": "patient", "D": "personeel"}}, {"n": 29, "q": "After hip replacement surgery, patients are given the choice of partial in-hospital rehabilitation. If recovery takes long, they will have to be admitted to a rehabilitation centre. If, eventually, patients return to their own homes, home care agencies will step in for the final phase of recovery. This passing from ‘station’ to ‘station’ should be as smooth as possible for the patient. As a hospital, you can choose to contribute to smooth proceedings, for instance by providing support in their communication with rehabilitation centres. Will you have your hospital take on additional duties simply because that is what patient-centred care is all about, even though you will not be compensated for it?", "o": {"A": "I am deeply committed to patient-centred care. As a care provider, one should always want what is best for the patients, even if this takes some extra time and money.", "B": "I am deeply committed to patient-centred care. This will boost the reputation of the hospital.", "C": "Patient-centred care is not my concern. It is not the responsibility of hospitals to provide for this type of care. We are not compensated for it, so we cannot afford to take on these duties.", "D": "Patient-centred care is not my concern. We do not specialize in it and so we are not in a position to carry out such duties properly."}, "nl": {"q": "Na een heupoperatie krijgen patiënten de keuze voor gedeeltelijke revalidatie in het ziekenhuis. Als het herstel lang duurt, moeten zij worden opgenomen in een revalidatiecentrum. Als patiënten uiteindelijk naar huis terugkeren, nemen thuiszorgorganisaties de laatste fase van het herstel over. Dit doorgeven van ‘station’ naar ‘station’ moet voor de patiënt zo soepel mogelijk verlopen. Als ziekenhuis kun je ervoor kiezen bij te dragen aan een soepel verloop, bijvoorbeeld door ondersteuning te bieden bij de communicatie met revalidatiecentra. Laat je jouw ziekenhuis extra taken op zich nemen, simpelweg omdat dat bij patiëntgerichte zorg hoort, ook al word je er niet voor vergoed?", "o": {"A": "Ik ben zeer begaan met patiëntgerichte zorg. Als zorgverlener moet je altijd het beste voor de patiënten willen, ook als dat wat extra tijd en geld kost.", "B": "Ik ben zeer begaan met patiëntgerichte zorg. Dit verbetert de reputatie van het ziekenhuis.", "C": "Patiëntgerichte zorg is niet mijn zorg. Het is niet de verantwoordelijkheid van ziekenhuizen om hierin te voorzien. Wij worden er niet voor vergoed, dus wij kunnen het ons niet veroorloven deze taken op ons te nemen.", "D": "Patiëntgerichte zorg is niet mijn zorg. Wij zijn er niet in gespecialiseerd en kunnen dergelijke taken dus niet goed uitvoeren."}}, "f": {"A": "patient", "B": "reputatie", "C": "organisatie", "D": "organisatie"}}, {"n": 30, "q": "A project proposal has been submitted in your hospital to invest in an OR robot. This innovation will bring many advantages to some patients. This may significantly improve the patient experience with and perception of the hospital, which will benefit the reputation. A focus on innovation will go a long way for our reputation as well. However, the expenses for purchase, installation, and connection will be substantial, and it will require additional training for the staff who will operate the robot. Will you (the director) decide to purchase the robot?", "o": {"A": "No, the expenses for training the staff are too high, relative to the number of patients who will benefit from it.", "B": "Yes, everything that benefits patients is worth the investment.", "C": "Yes, investing in innovations is good for the reputation of the hospital and for the staff, who will see this as a challenge.", "D": "No, this is nothing but ‘toys for the boys’. It will cause disparity and discord between the group of staff who will be trained to work with it and those who will not."}, "nl": {"q": "In jouw ziekenhuis is een projectvoorstel ingediend om te investeren in een OK-robot. Deze innovatie brengt voor sommige patiënten veel voordelen. Dit kan de patiëntervaring met en de beeldvorming over het ziekenhuis aanzienlijk verbeteren, wat de reputatie ten goede komt. Een focus op innovatie draagt ook sterk bij aan onze reputatie. De kosten voor aanschaf, installatie en aansluiting zijn echter aanzienlijk, en het personeel dat de robot gaat bedienen heeft extra opleiding nodig. Besluit jij (de directeur) de robot aan te schaffen?", "o": {"A": "Nee, de kosten voor het opleiden van het personeel zijn te hoog in verhouding tot het aantal patiënten dat ervan profiteert.", "B": "Ja, alles wat patiënten ten goede komt is de investering waard.", "C": "Ja, investeren in innovaties is goed voor de reputatie van het ziekenhuis en voor het personeel, dat dit als een uitdaging zal zien.", "D": "Nee, dit is niets anders dan ‘speeltjes voor de jongens’. Het zorgt voor ongelijkheid en onenigheid tussen de groep medewerkers die wordt opgeleid om ermee te werken en de groep die dat niet wordt."}}, "f": {"A": "organisatie", "B": "patient", "C": "reputatie", "D": "personeel"}}, {"n": 31, "q": "News reports are singing the praise of an experimental drug. The results are promising for a number of patients who suffer from a very rare condition. A medical specialist in the hospital wants to participate in the experimental study. Prescribing this drug will benefit the doctor-patient relationship as well as contributing to the testing of the new drug. On the other hand, in the short run, this approach will lead to fairly significant additional expenses for the hospital. You serve on the board. What will you recommend?", "o": {"A": "It is unethical to withhold this drug from patients. We simply have to offer it. In order to raise the necessary funds, we will economize on other expenditure items.", "B": "It is wonderful for a hospital to be able to contribute to the development of new drugs. For this reason, we should offer this drug to our patients.", "C": "We will suffer substantial reputational damage if we refrain from offering this drug. Whatever the loss may be in terms of additional expenses will be recouped later as a result of our good reputation.", "D": "We will wait for the drug to reach the market. Until that time, it is too expensive to offer it to our patients."}, "nl": {"q": "In het nieuws wordt een experimenteel geneesmiddel de hemel in geprezen. De resultaten zijn veelbelovend voor een aantal patiënten met een zeer zeldzame aandoening. Een medisch specialist in het ziekenhuis wil deelnemen aan de experimentele studie. Het voorschrijven van dit middel is goed voor de arts-patiëntrelatie en draagt bij aan het testen van het nieuwe geneesmiddel. Aan de andere kant leidt deze aanpak op korte termijn tot behoorlijk forse extra kosten voor het ziekenhuis. Je zit in de raad van bestuur. Wat adviseer je?", "o": {"A": "Het is onethisch om patiënten dit middel te onthouden. We moeten het gewoon aanbieden. Om de benodigde middelen bijeen te brengen, bezuinigen we op andere uitgavenposten.", "B": "Het is mooi dat een ziekenhuis kan bijdragen aan de ontwikkeling van nieuwe geneesmiddelen. Daarom moeten we dit middel aan onze patiënten aanbieden.", "C": "Als we dit middel niet aanbieden, lijden we aanzienlijke reputatieschade. Wat
